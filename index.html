<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ PREMIUM CASINO ✦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: #12161f;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #2a313e;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e2632;
            padding: 12px 20px;
            border-radius: 40px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
        }

        .balance i {
            color: #3b82f6;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a313e;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Навигация */
        .nav {
            display: flex;
            gap: 5px;
            background: #1e2632;
            padding: 5px;
            border-radius: 40px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 35px;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #3b82f6;
            color: white;
        }

        /* Игры */
        .game {
            display: none;
        }

        .game.active {
            display: block;
        }

        /* ROCKET */
        .stage {
            background: #000;
            border-radius: 24px;
            height: 280px;
            position: relative;
            border: 2px solid #2a313e;
            margin-bottom: 16px;
            overflow: hidden;
        }

        #rocketCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 32px;
            font-weight: bold;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            background: #1e2632;
            padding: 16px;
            border-radius: 30px;
            margin: 16px 0;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: bold;
            color: #3b82f6;
            font-size: 18px;
        }

        .bet-panel {
            background: #1e2632;
            padding: 20px;
            border-radius: 30px;
        }

        .bet-input {
            width: 100%;
            padding: 16px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn.primary {
            background: #3b82f6;
            color: white;
        }

        .btn.success {
            background: #10b981;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* PLINKO */
        #plinkoCanvas {
            width: 100%;
            height: 500px;
            display: block;
            background: #000;
        }

        .result {
            margin-top: 16px;
            padding: 20px;
            background: #1e2632;
            border-radius: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
        }

        /* SLOTS */
        .slots-machine {
            background: #000;
            padding: 30px 20px;
            border-radius: 30px;
            margin-bottom: 16px;
        }

        .reels {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: #1e2632;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 3px solid #3b82f6;
        }

        /* WHEEL */
        .wheel-container {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            position: relative;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #3b82f6;
        }

        /* MINES */
        .mines-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mines-select {
            flex: 1;
            background: #1e2632;
            border: 2px solid #2a313e;
            border-radius: 30px;
            padding: 12px;
            color: white;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            background: #1e2632;
            border: 2px solid #2a313e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }

        .cell.star {
            background: #166534;
            border-color: #10b981;
            color: #10b981;
        }

        .cell.mine {
            background: #991b1b;
            border-color: #ef4444;
            color: #ef4444;
        }

        .mines-info {
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
            font-size: 18px;
            font-weight: bold;
        }

        /* История */
        .history {
            background: #1e2632;
            padding: 16px;
            border-radius: 30px;
            margin-top: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #2a313e;
        }

        .win { color: #3b82f6; }
        .lose { color: #ef4444; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="balance">
                <span>⭐</span>
                <span id="balance">10000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="bonusBtn">🎁</button>
            </div>
        </div>

        <!-- Навигация -->
        <div class="nav" id="nav">
            <button class="nav-btn active" data-game="rocket">🚀</button>
            <button class="nav-btn" data-game="plinko">🔴</button>
            <button class="nav-btn" data-game="slots">🎰</button>
            <button class="nav-btn" data-game="wheel">🎡</button>
            <button class="nav-btn" data-game="mines">💣</button>
        </div>

        <!-- ROCKET -->
        <div id="rocket" class="game active">
            <div class="stage">
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier" id="rocketMultiplier">1.00x</div>
            </div>
            <div class="info-panel">
                <div><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
                <div><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
                <div><div class="info-label">BET</div><div class="info-value" id="rocketBetValue">10</div></div>
            </div>
            <div class="bet-panel">
                <input type="number" id="rocketBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn primary" id="rocketStart">СТАРТ</button>
                    <button class="btn success" id="rocketStop" disabled>СТОП</button>
                </div>
            </div>
        </div>

        <!-- PLINKO -->
        <div id="plinko" class="game">
            <div class="stage">
                <canvas id="plinkoCanvas" width="380" height="500"></canvas>
            </div>
            <div class="bet-panel">
                <input type="number" id="plinkoBet" class="bet-input" value="10">
                <button class="btn primary" id="plinkoDrop">БРОСИТЬ</button>
                <div class="result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- SLOTS -->
        <div id="slots" class="game">
            <div class="slots-machine">
                <div class="reels">
                    <div class="reel" id="slot1">🍒</div>
                    <div class="reel" id="slot2">🍒</div>
                    <div class="reel" id="slot3">🍒</div>
                </div>
                <div style="text-align: center; margin-top: 20px; font-size: 24px; color: #3b82f6;" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <input type="number" id="slotsBet" class="bet-input" value="10">
                <button class="btn primary" id="slotsSpin">КРУТИТЬ</button>
            </div>
        </div>

        <!-- WHEEL -->
        <div id="wheel" class="game">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="250" height="250"></canvas>
                <div class="pointer">▼</div>
            </div>
            <div class="result" id="wheelResult">—</div>
            <div class="bet-panel">
                <input type="number" id="wheelBet" class="bet-input" value="10">
                <button class="btn primary" id="wheelSpin">КРУТИТЬ</button>
            </div>
        </div>

        <!-- MINES -->
        <div id="mines" class="game">
            <div class="mines-header">
                <select id="minesCount" class="mines-select">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="btn success" id="minesNewGame">НОВАЯ</button>
            </div>
            <div class="grid" id="minesGrid"></div>
            <div class="mines-info">
                <span>Множитель: <span id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span></span>
            </div>
            <div class="bet-panel">
                <input type="number" id="minesBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn primary" id="minesStart">СТАВКА</button>
                    <button class="btn success" id="minesCashout" disabled>ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- История -->
        <div class="history" id="historyList"></div>
    </div>

    <script>
        (function() {
            const tg = Telegram.WebApp;
            tg.expand();

            // ДАННЫЕ
            let balance = 10000;
            let history = [];

            function updateBalance() {
                document.getElementById('balance').textContent = balance;
            }

            function addStars(amount) {
                balance += amount;
                updateBalance();
                addHistory('Бонус', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            function addHistory(game, text, type) {
                history.unshift({ game, text, type });
                if (history.length > 5) history.pop();
                const list = document.getElementById('historyList');
                list.innerHTML = history.map(item => 
                    `<div class="history-item"><span>${item.game}</span><span class="${item.type}">${item.text}</span></div>`
                ).join('');
            }

            // НАВИГАЦИЯ
            const navBtns = document.querySelectorAll('.nav-btn');
            const games = {
                rocket: document.getElementById('rocket'),
                plinko: document.getElementById('plinko'),
                slots: document.getElementById('slots'),
                wheel: document.getElementById('wheel'),
                mines: document.getElementById('mines')
            };

            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    navBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.values(games).forEach(g => g.classList.remove('active'));
                    games[btn.dataset.game].classList.add('active');
                });
            });

            // ==================== ROCKET ====================
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const multiplierEl = document.getElementById('rocketMultiplier');
                const lastCrash = document.getElementById('lastCrash');
                const maxCrash = document.getElementById('maxCrash');
                const betInput = document.getElementById('rocketBet');
                const betValue = document.getElementById('rocketBetValue');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false;
                let interval = null;
                let crashPoint = 2.0;
                let currentMult = 1.0;
                let bet = 10;
                let stars = [];
                let max = 12.5;
                let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];

                function drawRocket(mult) {
                    ctx.clearRect(0, 0, 380, 280);
                    
                    // Звезды
                    ctx.fillStyle = 'white';
                    for (let i = 0; i < 50; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.random()*380, Math.random()*280, Math.random()*2, 0, Math.PI*2);
                        ctx.fill();
                    }

                    // Ракета
                    ctx.font = '60px sans-serif';
                    ctx.fillStyle = '#3b82f6';
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 20;
                    ctx.fillText('🚀', 160, 150 - (mult - 1) * 15);
                    ctx.shadowBlur = 0;
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    crashPoint = 1 + Math.random() * 9;
                    crashPoint = Math.round(crashPoint * 100) / 100;

                    gameActive = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    currentMult = 1.0;
                    multiplierEl.textContent = '1.00x';
                    
                    const startTime = Date.now();

                    interval = setInterval(() => {
                        if (!gameActive) return;
                        const elapsed = (Date.now() - startTime) / 1000;
                        currentMult = 1 + 0.7 * elapsed;
                        multiplierEl.textContent = currentMult.toFixed(2) + 'x';
                        drawRocket(currentMult);

                        if (currentMult >= crashPoint) {
                            clearInterval(interval);
                            gameActive = false;
                            startBtn.disabled = false;
                            stopBtn.disabled = true;
                            crashHistory.unshift(crashPoint);
                            if (crashPoint > max) max = crashPoint;
                            lastCrash.textContent = crashPoint.toFixed(2) + 'x';
                            maxCrash.textContent = max.toFixed(2) + 'x';
                            addHistory('ROCKET', `CRASH -${bet} ⭐`, 'lose');
                        }
                    }, 50);
                });

                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(interval);
                    gameActive = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const win = Math.floor(bet * currentMult);
                    balance += win;
                    updateBalance();
                    crashHistory.unshift(currentMult);
                    if (currentMult > max) max = currentMult;
                    lastCrash.textContent = currentMult.toFixed(2) + 'x';
                    maxCrash.textContent = max.toFixed(2) + 'x';
                    addHistory('ROCKET', `x${currentMult.toFixed(2)} +${win} ⭐`, 'win');
                });

                betInput.addEventListener('input', () => {
                    betValue.textContent = betInput.value;
                });

                lastCrash.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrash.textContent = max.toFixed(2) + 'x';
                drawRocket(1);
            })();

            // ==================== PLINKO ====================
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const result = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');

                const multipliers = [0.5, 0.7, 1, 1.5, 2, 3, 5, 8, 10];

                function drawBoard() {
                    ctx.clearRect(0, 0, 380, 500);
                    ctx.fillStyle = '#3b82f6';
                    
                    // Колышки
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c <= r; c++) {
                            let x = 190 - r * 20 + c * 40;
                            let y = 50 + r * 48;
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, Math.PI*2);
                            ctx.fill();
                        }
                    }

                    // Ячейки
                    for (let i = 0; i < 9; i++) {
                        let x = 190 - 8*20 + i * 40;
                        let y = 50 + 8*48 + 20;
                        ctx.strokeStyle = '#2a313e';
                        ctx.strokeRect(x-18, y-10, 36, 30);
                        ctx.fillStyle = '#94a3b8';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(multipliers[i].toFixed(1)+'x', x-12, y+10);
                    }
                }

                dropBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    const col = Math.floor(Math.random() * 9);
                    const mult = multipliers[col];
                    const win = Math.floor(bet * mult);
                    balance += win;
                    updateBalance();
                    result.textContent = mult >= 1 ? `WIN ${win} ⭐` : `LOSE ${win} ⭐`;
                    addHistory('PLINKO', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
                });

                drawBoard();
            })();

            // ==================== SLOTS ====================
            (function slots() {
                const slot1 = document.getElementById('slot1');
                const slot2 = document.getElementById('slot2');
                const slot3 = document.getElementById('slot3');
                const multiplier = document.getElementById('slotsMultiplier');
                const spinBtn = document.getElementById('slotsSpin');
                const betInput = document.getElementById('slotsBet');

                const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '⭐'];

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    const r1 = Math.floor(Math.random() * symbols.length);
                    const r2 = Math.floor(Math.random() * symbols.length);
                    const r3 = Math.floor(Math.random() * symbols.length);

                    slot1.textContent = symbols[r1];
                    slot2.textContent = symbols[r2];
                    slot3.textContent = symbols[r3];

                    let mult = 0;
                    if (r1 === r2 && r2 === r3) {
                        if (r1 === 4) mult = 15;
                        else if (r1 === 5) mult = 20;
                        else mult = 3;
                    } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                        mult = 2;
                    }

                    if (mult === 0) {
                        multiplier.textContent = 'x0';
                        addHistory('SLOTS', `LOSE -${bet} ⭐`, 'lose');
                    } else {
                        const win = bet * mult;
                        balance += win;
                        updateBalance();
                        multiplier.textContent = `x${mult}`;
                        addHistory('SLOTS', `x${mult} +${win} ⭐`, 'win');
                    }
                });
            })();

            // ==================== WHEEL ====================
            (function wheel() {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const spinBtn = document.getElementById('wheelSpin');
                const betInput = document.getElementById('wheelBet');
                const result = document.getElementById('wheelResult');

                const sectors = [
                    { label: 'x0', mult: 0, color: '#ef4444' },
                    { label: 'x1', mult: 1, color: '#3b82f6' },
                    { label: 'x2', mult: 2, color: '#10b981' },
                    { label: 'x5', mult: 5, color: '#f59e0b' },
                    { label: 'x10', mult: 10, color: '#8b5cf6' },
                    { label: 'x50', mult: 50, color: '#ec4899' }
                ];

                function drawWheel() {
                    ctx.clearRect(0,0,250,250);
                    const angle = (2 * Math.PI) / sectors.length;
                    
                    for (let i = 0; i < sectors.length; i++) {
                        ctx.beginPath();
                        ctx.moveTo(125,125);
                        ctx.arc(125,125,110, i*angle, (i+1)*angle);
                        ctx.closePath();
                        ctx.fillStyle = sectors[i].color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();
                    }
                }

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    const idx = Math.floor(Math.random() * sectors.length);
                    const mult = sectors[idx].mult;
                    const win = bet * mult;
                    balance += win;
                    updateBalance();
                    result.textContent = `${sectors[idx].label} → ${win} ⭐`;
                    addHistory('WHEEL', `${sectors[idx].label} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>0?'win':'lose');
                });

                drawWheel();
            })();

            // ==================== MINES ====================
            (function mines() {
                const grid = document.getElementById('minesGrid');
                const countSelect = document.getElementById('minesCount');
                const newGame = document.getElementById('minesNewGame');
                const startBtn = document.getElementById('minesStart');
                const cashoutBtn = document.getElementById('minesCashout');
                const betInput = document.getElementById('minesBet');
                const multiplierSpan = document.getElementById('minesMultiplier');
                const winSpan = document.getElementById('minesWin');

                let board = [], revealed = [], active = false, bet = 0, mines = 3, stars = 0;

                function render() {
                    grid.innerHTML = '';
                    for (let i = 0; i < 25; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        if (revealed[i]) {
                            cell.classList.add(board[i] ? 'mine' : 'star');
                            cell.textContent = board[i] ? '💣' : '⭐';
                        } else {
                            cell.textContent = '?';
                        }
                        cell.onclick = () => {
                            if (!active) return;
                            if (revealed[i]) return;
                            if (board[i]) {
                                revealed[i] = true;
                                render();
                                active = false;
                                cashoutBtn.disabled = true;
                                addHistory('MINES', `MINE -${bet} ⭐`, 'lose');
                                alert('💥 Проигрыш!');
                            } else {
                                revealed[i] = true;
                                stars++;
                                const mult = 1 + stars * 0.3;
                                multiplierSpan.textContent = mult.toFixed(2) + 'x';
                                winSpan.textContent = Math.floor(bet * mult);
                                render();
                            }
                        };
                        grid.appendChild(cell);
                    }
                }

                function reset() {
                    active = false;
                    cashoutBtn.disabled = true;
                    stars = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    render();
                }

                newGame.onclick = reset;

                startBtn.onclick = () => {
                    const b = parseInt(betInput.value);
                    if (b < 1 || b > balance) return alert('Неверная ставка');
                    if (!deductStars(b)) return;
                    bet = b;
                    mines = parseInt(countSelect.value);
                    board = new Array(25).fill(false);
                    for (let i = 0; i < mines; i++) {
                        let pos;
                        do { pos = Math.floor(Math.random() * 25); } while (board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    stars = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    active = true;
                    cashoutBtn.disabled = false;
                    render();
                };

                cashoutBtn.onclick = () => {
                    if (!active) return;
                    const mult = 1 + stars * 0.3;
                    const win = Math.floor(bet * mult);
                    balance += win;
                    updateBalance();
                    addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                    active = false;
                    cashoutBtn.disabled = true;
                    render();
                };

                reset();
            })();

            // Бонус
            document.getElementById('bonusBtn').addEventListener('click', () => {
                addStars(1000);
            });

            updateBalance();
        })();
    </script>
</body>
</html>
