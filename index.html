<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ ROCKET ✦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0a0c12;
            color: white;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .app {
            max-width: 400px;
            width: 100%;
            background: #12161f;
            border-radius: 32px;
            padding: 20px;
            border: 1px solid #2a313e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2632;
            padding: 12px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
        }
        .balance i {
            color: #3b82f6;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a313e;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }
        .stage {
            background: #000;
            border-radius: 24px;
            height: 280px;
            position: relative;
            border: 2px solid #2a313e;
            overflow: hidden;
            margin-bottom: 16px;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 32px;
            font-weight: bold;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: #1e2632;
            border-radius: 30px;
            padding: 16px;
            margin: 16px 0;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            color: #94a3b8;
            font-size: 12px;
        }
        .info-value {
            font-weight: bold;
            color: #3b82f6;
            font-size: 18px;
        }
        .bet-panel {
            background: #1e2632;
            border-radius: 30px;
            padding: 20px;
        }
        .bet-input {
            width: 100%;
            padding: 16px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.primary {
            background: #3b82f6;
            color: white;
        }
        .btn.success {
            background: #10b981;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .history {
            background: #1e2632;
            border-radius: 30px;
            padding: 16px;
            margin-top: 20px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #2a313e;
            border-radius: 30px;
            margin-bottom: 8px;
        }
        .win { color: #3b82f6; }
        .lose { color: #ef4444; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance"><i class="fas fa-star"></i> <span id="balance">10000</span></div>
            <div class="header-actions">
                <button class="icon-btn" id="giftBtn"><i class="fas fa-gift"></i></button>
            </div>
        </div>

        <div class="stage">
            <canvas id="rocketCanvas" width="380" height="280"></canvas>
            <div class="multiplier" id="rocketMultiplier">1.00x</div>
        </div>

        <div class="info-panel">
            <div class="info-item"><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
            <div class="info-item"><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
            <div class="info-item"><div class="info-label">BET</div><div class="info-value" id="rocketBetValue">10</div></div>
        </div>

        <div class="bet-panel">
            <input type="number" id="rocketBet" class="bet-input" value="10">
            <div class="actions">
                <button class="btn primary" id="rocketStart">🚀 СТАРТ</button>
                <button class="btn success" id="rocketStop" disabled>⏹️ СТОП</button>
            </div>
        </div>

        <div class="history" id="historyList"></div>
    </div>

    <script>
        (function() {
            const tg = Telegram.WebApp;
            tg.expand();

            const userId = 'user_' + Math.random().toString(36).substring(2);
            const storageKey = `rocket_${userId}`;

            let data = JSON.parse(localStorage.getItem(storageKey)) || {
                balance: 10000,
                history: []
            };

            function saveData() {
                localStorage.setItem(storageKey, JSON.stringify(data));
            }

            function updateBalance() {
                document.getElementById('balance').textContent = data.balance;
            }

            function addStars(amount) {
                data.balance += amount;
                saveData();
                updateBalance();
                addHistory('Бонус', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (data.balance >= amount) {
                    data.balance -= amount;
                    saveData();
                    updateBalance();
                    return true;
                }
                return false;
            }

            function addHistory(game, text, type) {
                data.history.unshift({ game, text, type });
                if (data.history.length > 5) data.history.pop();
                renderHistory();
                saveData();
            }

            function renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = '<div style="margin-bottom:10px">📜 ИСТОРИЯ</div>';
                data.history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `<span>${item.game}</span><span class="${item.type}">${item.text}</span>`;
                    list.appendChild(div);
                });
            }

            document.getElementById('giftBtn').addEventListener('click', () => {
                addStars(1000);
            });

            // ROCKET
            const canvas = document.getElementById('rocketCanvas');
            const ctx = canvas.getContext('2d');
            const multiplierEl = document.getElementById('rocketMultiplier');
            const lastCrash = document.getElementById('lastCrash');
            const maxCrash = document.getElementById('maxCrash');
            const betInput = document.getElementById('rocketBet');
            const betValue = document.getElementById('rocketBetValue');
            const startBtn = document.getElementById('rocketStart');
            const stopBtn = document.getElementById('rocketStop');

            let gameActive = false;
            let interval = null;
            let crashPoint = 2.0;
            let currentMult = 1.0;
            let bet = 10;
            let max = 12.5;
            let history = [4.56, 2.89, 7.23, 3.45, 5.67];

            function drawRocket(mult) {
                ctx.clearRect(0, 0, 380, 280);
                
                // Звёзды
                for (let i = 0; i < 50; i++) {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(Math.random()*380, Math.random()*280, Math.random()*2, 0, 2*Math.PI);
                    ctx.fill();
                }

                // Ракета
                ctx.font = '70px "Segoe UI Emoji"';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#fff';
                ctx.fillText('🚀', 190, 150 - (mult-1)*15);
                ctx.shadowBlur = 0;
            }

            startBtn.addEventListener('click', () => {
                if (gameActive) return;
                
                bet = parseInt(betInput.value);
                if (bet < 1 || bet > data.balance) {
                    alert('Неверная ставка');
                    return;
                }
                
                if (!deductStars(bet)) return;

                crashPoint = +(1 + Math.random() * 9).toFixed(2);
                
                gameActive = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                currentMult = 1.0;
                multiplierEl.textContent = '1.00x';
                drawRocket(1);
                
                const startTime = Date.now();

                interval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    currentMult = 1 + 0.7 * elapsed;
                    multiplierEl.textContent = currentMult.toFixed(2) + 'x';
                    drawRocket(currentMult);
                    
                    if (currentMult >= crashPoint) {
                        clearInterval(interval);
                        gameActive = false;
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                        
                        history.unshift(crashPoint);
                        if (crashPoint > max) max = crashPoint;
                        lastCrash.textContent = crashPoint.toFixed(2) + 'x';
                        maxCrash.textContent = max.toFixed(2) + 'x';
                        
                        addHistory('Rocket', `CRASH -${bet} ⭐`, 'lose');
                    }
                }, 30);
            });

            stopBtn.addEventListener('click', () => {
                if (!gameActive) return;
                
                clearInterval(interval);
                gameActive = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                
                const win = Math.floor(bet * currentMult);
                data.balance += win;
                saveData();
                updateBalance();
                
                history.unshift(currentMult);
                if (currentMult > max) max = currentMult;
                lastCrash.textContent = currentMult.toFixed(2) + 'x';
                maxCrash.textContent = max.toFixed(2) + 'x';
                
                addHistory('Rocket', `x${currentMult.toFixed(2)} +${win} ⭐`, 'win');
            });

            betInput.addEventListener('input', () => {
                betValue.textContent = betInput.value;
            });

            lastCrash.textContent = history[0].toFixed(2) + 'x';
            maxCrash.textContent = max.toFixed(2) + 'x';
            drawRocket(1);
            updateBalance();
            renderHistory();
        })();
    </script>
</body>
</html>
