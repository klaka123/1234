<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINIMAL CASINO • ROCKET • PLINKO • SLOTS • WHEEL • MINES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg: #0b0d12;
            --surface: #14171c;
            --surface-light: #1e2128;
            --text: #ffffff;
            --text-secondary: #8e98a3;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: #2a2f38;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border-radius: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-light);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .balance i {
            color: var(--accent);
            font-size: 18px;
        }

        .balance span {
            font-weight: 700;
            font-size: 22px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Табы в одну строку */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            padding: 4px;
            background: var(--surface-light);
            border-radius: 50px;
            border: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 0 0 auto;
            padding: 10px 16px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        /* Боковое меню */
        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 24px;
            transition: 0.3s;
            z-index: 1000;
            backdrop-filter: blur(10px);
            overflow-y: auto;
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .menu-header h3 {
            font-size: 20px;
            color: var(--accent);
        }

        .close-menu {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
        }

        .menu-item {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .menu-item h4 {
            margin-bottom: 10px;
            color: var(--accent);
        }

        .menu-item input {
            width: 100%;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: white;
            margin-bottom: 10px;
        }

        .menu-item button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Игровой контейнер */
        .game-container {
            background: var(--surface-light);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .hidden { display: none; }

        /* Rocket */
        .rocket-stage {
            position: relative;
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            height: 260px;
            border: 2px solid var(--border);
            margin-bottom: 16px;
        }

        #rocketCanvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            box-shadow: 0 0 4px white;
        }

        .multiplier-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 28px;
            font-weight: 800;
            z-index: 10;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            background: var(--surface);
            border-radius: 30px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
            color: var(--accent);
            font-size: 18px;
        }

        .bet-panel {
            background: var(--surface);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid var(--border);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .bet-input {
            width: 100%;
            padding: 16px;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: 40px;
            color: white;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .action-btn.primary {
            background: var(--accent);
            color: white;
        }

        .action-btn.success {
            background: var(--success);
            color: white;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Plinko */
        .plinko-stage {
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            height: 480px;
            border: 2px solid var(--border);
            margin-bottom: 16px;
        }

        #plinkoCanvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .plinko-result {
            margin-top: 16px;
            padding: 16px;
            background: var(--surface);
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        /* Slots */
        .slots-machine {
            background: #000;
            border-radius: 40px;
            padding: 30px 16px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
        }

        .reels {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: var(--surface);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 2px solid var(--border);
            transition: 0.1s;
        }

        .slots-multiplier {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 16px 0 0;
            color: var(--accent);
        }

        /* Wheel */
        .wheel-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 10px auto 30px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px cyan);
        }

        .wheel-result {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            margin: 20px 0;
            color: var(--accent);
        }

        /* Mines */
        .mines-header {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .mines-select {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 40px;
            padding: 12px;
            color: white;
            font-weight: 600;
            text-align: center;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 16px 0;
        }

        .mines-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mines-cell.revealed-star {
            background: #1e2a3a;
            border-color: var(--success);
            color: var(--success);
        }

        .mines-cell.revealed-mine {
            background: #2a1a1a;
            border-color: var(--danger);
            color: var(--danger);
        }

        .mines-info {
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .mines-multiplier {
            color: var(--accent);
        }

        /* История */
        .history-section {
            background: var(--surface-light);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--surface);
            border-radius: 24px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .history-win { color: var(--success); font-weight: 700; }
        .history-lose { color: var(--danger); font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="dailyBonus">
                    <i class="fas fa-gift"></i>
                </button>
                <button class="icon-btn" id="menuBtn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </header>

        <!-- Табы в одну строку -->
        <div class="tabs">
            <button class="tab active" data-tab="rocket">🚀</button>
            <button class="tab" data-tab="plinko">🔴</button>
            <button class="tab" data-tab="slots">🎰</button>
            <button class="tab" data-tab="wheel">🎡</button>
            <button class="tab" data-tab="mines">💣</button>
        </div>

        <!-- Rocket -->
        <div id="rocketGame" class="game-container">
            <div class="rocket-stage">
                <div class="stars-layer" id="starsLayer"></div>
                <canvas id="rocketCanvas" width="380" height="260"></canvas>
                <div class="multiplier-display" id="rocketMultiplier">1.00x</div>
            </div>
            <div class="info-panel">
                <div class="info-item"><span class="info-label">LAST</span><span class="info-value" id="lastCrash">2.45x</span></div>
                <div class="info-item"><span class="info-label">MAX</span><span class="info-value" id="maxCrash">12.5x</span></div>
                <div class="info-item"><span class="info-label">BET</span><span class="info-value" id="rocketBetAmount">10</span></div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn primary" id="rocketStart"><i class="fas fa-rocket"></i> СТАРТ</button>
                    <button class="action-btn success" id="rocketStop" disabled><i class="fas fa-stop"></i> СТОП</button>
                </div>
            </div>
        </div>

        <!-- Plinko -->
        <div id="plinkoGame" class="game-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="480"></canvas>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="plinkoBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="plinkoDrop"><i class="fas fa-arrow-down"></i> БРОСИТЬ</button>
                <div class="plinko-result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- Slots -->
        <div id="slotsGame" class="game-container hidden">
            <div class="slots-machine">
                <div class="reels">
                    <div class="reel" id="slot1">🍒</div>
                    <div class="reel" id="slot2">🍒</div>
                    <div class="reel" id="slot3">🍒</div>
                </div>
                <div class="slots-multiplier" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="slotsBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="slotsSpin"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- Wheel -->
        <div id="wheelGame" class="game-container hidden">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="240" height="240"></canvas>
                <div class="wheel-pointer">▼</div>
            </div>
            <div class="wheel-result" id="wheelResult">—</div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="wheelBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="wheelSpin"><i class="fas fa-play"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- Mines -->
        <div id="minesGame" class="game-container hidden">
            <div class="mines-header">
                <select id="minesCount" class="mines-select">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="action-btn success" id="minesNewGame">НОВАЯ</button>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
            <div class="mines-info">
                <span>Множитель: <span class="mines-multiplier" id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span></span>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="minesBet" class="bet-input" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn primary" id="minesStart">СТАВКА</button>
                    <button class="action-btn success" id="minesCashout" disabled>ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- История -->
        <div class="history-section">
            <div class="history-title"><i class="fas fa-history"></i> ПОСЛЕДНИЕ 5 ИГР</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Боковое меню -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>МЕНЮ</h3>
            <button class="close-menu" id="closeMenu">&times;</button>
        </div>
        <div class="menu-item">
            <h4>Рефералы</h4>
            <p>Приглашено: <span id="referralCount">0</span>/3</p>
            <button id="claimReferral">Забрать 10 ⭐ (3 реф.)</button>
        </div>
        <div class="menu-item">
            <h4>Промокод</h4>
            <input type="text" id="promoInput" placeholder="Введите код">
            <button id="applyPromo">Активировать</button>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            // ========== ГЛОБАЛЬНЫЕ ==========
            let balance = parseInt(localStorage.getItem('balance')) || 10000;
            let referralCount = parseInt(localStorage.getItem('referralCount')) || 0;
            const usedPromos = JSON.parse(localStorage.getItem('usedPromos') || '[]');

            const historyList = document.getElementById('historyList');

            function saveBalance() {
                localStorage.setItem('balance', balance);
                updateBalance();
            }

            function updateBalance() {
                document.getElementById('balance').textContent = balance.toLocaleString().replace(',', ' ');
            }

            function addStars(amount) {
                balance += amount;
                saveBalance();
                addHistory('BONUS', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    saveBalance();
                    return true;
                }
                return false;
            }

            function addHistory(game, text, type) {
                if (historyList.children.length >= 5) {
                    historyList.removeChild(historyList.lastElementChild);
                }
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
            }

            // ========== ТАБЫ ==========
            const tabs = document.querySelectorAll('.tab');
            const games = {
                rocket: document.getElementById('rocketGame'),
                plinko: document.getElementById('plinkoGame'),
                slots: document.getElementById('slotsGame'),
                wheel: document.getElementById('wheelGame'),
                mines: document.getElementById('minesGame')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const gameId = tab.dataset.tab;
                    Object.values(games).forEach(g => g.classList.add('hidden'));
                    games[gameId].classList.remove('hidden');
                });
            });

            // ========== МЕНЮ ==========
            const menuBtn = document.getElementById('menuBtn');
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const closeMenu = document.getElementById('closeMenu');

            menuBtn.addEventListener('click', () => {
                sideMenu.classList.add('active');
                overlay.classList.add('active');
            });

            closeMenu.addEventListener('click', () => {
                sideMenu.classList.remove('active');
                overlay.classList.remove('active');
            });

            overlay.addEventListener('click', () => {
                sideMenu.classList.remove('active');
                overlay.classList.remove('active');
            });

            // Рефералы
            document.getElementById('referralCount').textContent = referralCount;
            document.getElementById('claimReferral').addEventListener('click', () => {
                if (referralCount >= 3) {
                    addStars(10);
                    referralCount -= 3;
                    localStorage.setItem('referralCount', referralCount);
                    document.getElementById('referralCount').textContent = referralCount;
                } else {
                    alert('Нужно 3 реферала');
                }
            });

            // Промокоды
            document.getElementById('applyPromo').addEventListener('click', () => {
                const code = document.getElementById('promoInput').value.trim().toUpperCase();
                const promos = {
                    '2026': 50,
                    'GDB': 100,
                    'DROP': 10,
                    'FREE': 15
                };
                if (usedPromos.includes(code)) {
                    alert('Промокод уже использован');
                } else if (promos[code]) {
                    addStars(promos[code]);
                    usedPromos.push(code);
                    localStorage.setItem('usedPromos', JSON.stringify(usedPromos));
                    document.getElementById('promoInput').value = '';
                } else {
                    alert('Неверный код');
                }
            });

            // ========== ROCKET ==========
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const starsLayer = document.getElementById('starsLayer');
                const multiplierEl = document.getElementById('rocketMultiplier');
                const lastCrashSpan = document.getElementById('lastCrash');
                const maxCrashSpan = document.getElementById('maxCrash');
                const rocketBetInput = document.getElementById('rocketBet');
                const rocketBetAmount = document.getElementById('rocketBetAmount');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false;
                let countdownActive = false;
                let rocketInterval = null;
                let crashPoint = 2.0;
                let currentMultiplier = 1.0;
                let rocketBet = 10;
                let stars = [];
                let maxCrash = 12.5;
                let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];

                function createStars(count = 80) {
                    starsLayer.innerHTML = '';
                    stars = [];
                    for (let i = 0; i < count; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        star.style.width = (Math.random() * 3 + 1) + 'px';
                        star.style.height = star.style.width;
                        star.style.left = Math.random() * 100 + '%';
                        star.style.top = Math.random() * 100 + '%';
                        starsLayer.appendChild(star);
                        stars.push({ element: star, top: parseFloat(star.style.top) });
                    }
                }

                function moveStars(speed) {
                    stars.forEach(s => {
                        let top = s.top + speed;
                        if (top > 100) {
                            top = -5;
                            s.element.style.left = Math.random() * 100 + '%';
                        }
                        s.element.style.top = top + '%';
                        s.top = top;
                    });
                }

                function drawRocket(mult, vib) {
                    ctx.clearRect(0, 0, 380, 260);
                    // фон черный
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, 380, 260);
                    // ракета повернута вверх
                    ctx.save();
                    ctx.translate(190, 210 - (mult - 1) * 15);
                    // тряска
                    const shakeX = Math.sin(Date.now() * 0.03) * vib * 0.5;
                    const shakeY = Math.cos(Date.now() * 0.04) * vib * 0.5;
                    ctx.translate(shakeX, shakeY);
                    // корпус (белый)
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 15 + vib;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(15, 10);
                    ctx.lineTo(5, 10);
                    ctx.lineTo(5, 20);
                    ctx.lineTo(-5, 20);
                    ctx.lineTo(-5, 10);
                    ctx.lineTo(-15, 10);
                    ctx.closePath();
                    ctx.fill();
                    // нос
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(10, -10);
                    ctx.lineTo(-10, -10);
                    ctx.closePath();
                    ctx.fill();
                    // иллюминатор
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.arc(0, -5, 6, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-1, -6, 2, 0, 2*Math.PI);
                    ctx.fill();
                    // пламя
                    ctx.fillStyle = '#f97316';
                    ctx.shadowColor = '#f97316';
                    ctx.beginPath();
                    ctx.moveTo(-4, 22);
                    ctx.lineTo(0, 30 + Math.sin(Date.now()*0.02)*5);
                    ctx.lineTo(4, 22);
                    ctx.fill();
                    ctx.restore();
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive || countdownActive) return;
                    rocketBet = parseInt(rocketBetInput.value);
                    if (rocketBet < 1 || rocketBet > balance) return alert('Неверная ставка');
                    if (!deductStars(rocketBet)) return;

                    const r = Math.random();
                    crashPoint = r < 0.4 ? 4 + Math.random() * 6 : 1 + Math.random() * 3;
                    crashPoint = parseFloat(crashPoint.toFixed(2));

                    countdownActive = true;
                    multiplierEl.innerHTML = '<span style="color:#3b82f6;">3</span>';
                    let count = 3;
                    const ci = setInterval(() => {
                        count--;
                        if (count > 0) multiplierEl.innerHTML = `<span style="color:#3b82f6;">${count}</span>`;
                        else {
                            clearInterval(ci);
                            countdownActive = false;
                            multiplierEl.textContent = '1.00x';
                            gameActive = true;
                            startBtn.disabled = true;
                            stopBtn.disabled = false;
                            currentMultiplier = 1.0;
                            createStars(80);
                            const startTime = Date.now();

                            rocketInterval = setInterval(() => {
                                if (!gameActive) return;
                                const elapsed = (Date.now() - startTime) / 1000;
                                currentMultiplier = 1 + 0.9 * elapsed;
                                multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                                moveStars(0.1 + currentMultiplier * 0.3);
                                drawRocket(currentMultiplier, currentMultiplier * 1.2);

                                if (currentMultiplier >= crashPoint) {
                                    clearInterval(rocketInterval);
                                    gameActive = false;
                                    startBtn.disabled = false;
                                    stopBtn.disabled = true;
                                    crashHistory.unshift(crashPoint);
                                    if (crashHistory.length > 10) crashHistory.pop();
                                    if (crashPoint > maxCrash) maxCrash = crashPoint;
                                    lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                    addHistory('ROCKET', `CRASH -${rocketBet} ⭐`, 'lose');
                                }
                            }, 30);
                        }
                    }, 800);
                });

                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(rocketInterval);
                    gameActive = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const win = Math.floor(rocketBet * currentMultiplier);
                    balance += win;
                    saveBalance();
                    crashHistory.unshift(currentMultiplier);
                    if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;
                    lastCrashSpan.textContent = currentMultiplier.toFixed(2) + 'x';
                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                    addHistory('ROCKET', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
                });

                rocketBetInput.addEventListener('input', () => {
                    rocketBetAmount.textContent = rocketBetInput.value;
                });

                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                createStars(80);
                drawRocket(1, 0);
            })();

            // ========== PLINKO (исправленный) ==========
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const resultDiv = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');

                const rows = 8;
                const startY = 30;
                const stepY = 50;
                const startX = 190;
                const multipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];

                function drawBoard() {
                    ctx.clearRect(0, 0, 380, 480);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, 380, 480);
                    // колышки (серые)
                    ctx.fillStyle = '#aaa';
                    ctx.shadowColor = '#aaa';
                    ctx.shadowBlur = 8;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c <= r; c++) {
                            let x = startX - (r * 20) + c * 40;
                            let y = startY + r * stepY;
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, 2*Math.PI);
                            ctx.fill();
                        }
                    }
                    // ячейки (минимализм)
                    const cellY = startY + rows * stepY + 20;
                    for (let i = 0; i < 9; i++) {
                        let x = startX - (rows * 20) + i * 40;
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#1e1e1e';
                        ctx.fillRect(x-16, cellY-10, 32, 28);
                        ctx.strokeStyle = '#888';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x-16, cellY-10, 32, 28);
                        ctx.fillStyle = '#ccc';
                        ctx.font = 'bold 12px Inter';
                        ctx.fillText(multipliers[i].toFixed(1)+'x', x-12, cellY+10);
                    }
                }

                let anim = null;
                function dropBall(bet) {
                    if (anim) clearInterval(anim);
                    let ball = { x: 190, y: 15, vx: 0, vy: 1 };
                    let lastCollision = 0;
                    anim = setInterval(() => {
                        ball.vy += 0.4;
                        ball.y += ball.vy;
                        ball.x += ball.vx;
                        ball.vx *= 0.98;

                        for (let r = 0; r < rows; r++) {
                            for (let c = 0; c <= r; c++) {
                                let pegX = startX - (r * 20) + c * 40;
                                let pegY = startY + r * stepY;
                                let dx = ball.x - pegX;
                                let dy = ball.y - pegY;
                                let dist = Math.sqrt(dx*dx + dy*dy);
                                if (dist < 12 && Date.now() - lastCollision > 200) {
                                    let angle = Math.atan2(dy, dx);
                                    ball.vx = Math.cos(angle) * 4;
                                    ball.vy = -Math.abs(Math.sin(angle) * 3);
                                    ball.vx += (Math.random() - 0.5) * 2;
                                    lastCollision = Date.now();
                                    break;
                                }
                            }
                        }
                        if (ball.x < 30) { ball.x = 30; ball.vx *= -0.5; }
                        if (ball.x > 350) { ball.x = 350; ball.vx *= -0.5; }

                        drawBoard();
                        // шар белый
                        ctx.shadowColor = '#fff';
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(ball.x, ball.y, 10, 0, 2*Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 5;
                        ctx.fillStyle = '#ccc';
                        ctx.beginPath();
                        ctx.arc(ball.x-2, ball.y-2, 3, 0, 2*Math.PI);
                        ctx.fill();

                        if (ball.y > 460) {
                            clearInterval(anim);
                            let col = Math.floor((ball.x - (startX - (rows*20))) / 40);
                            col = Math.max(0, Math.min(8, col));
                            let mult = multipliers[col];
                            let win = Math.floor(bet * mult);
                            balance += win;
                            saveBalance();
                            resultDiv.textContent = mult >= 1 ? `ВЫИГРЫШ ${win} ⭐` : `ПРОИГРЫШ ${win} ⭐`;
                            addHistory('PLINKO', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
                        }
                    }, 25);
                }

                dropBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    dropBall(bet);
                });

                drawBoard();
            })();

            // ========== SLOTS ==========
            (function slots() {
                const slot1 = document.getElementById('slot1');
                const slot2 = document.getElementById('slot2');
                const slot3 = document.getElementById('slot3');
                const multiplierSpan = document.getElementById('slotsMultiplier');
                const spinBtn = document.getElementById('slotsSpin');
                const betInput = document.getElementById('slotsBet');

                const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '⭐'];
                // RTP: 60% проигрыш, 25% мелкий (x1.2-x2), 10% средний (x3-x6), 5% крупный (x10+)
                const getRandomSymbols = () => {
                    const r = Math.random();
                    if (r < 0.6) { // проигрыш
                        return [
                            symbols[Math.floor(Math.random() * 3)],
                            symbols[Math.floor(Math.random() * 3)],
                            symbols[Math.floor(Math.random() * 3)]
                        ];
                    } else if (r < 0.85) { // мелкий выигрыш
                        const base = symbols[Math.floor(Math.random() * 2)]; // 🍒 или 🍋
                        return [base, base, symbols[Math.floor(Math.random() * 5)]];
                    } else if (r < 0.95) { // средний
                        const base = symbols[Math.floor(Math.random() * 2) + 2]; // 🍇 или 🔔
                        return [base, base, base];
                    } else { // крупный
                        return ['💎', '💎', '💎'];
                    }
                };

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    // анимация прокрутки
                    let spins = 0;
                    const spinInterval = setInterval(() => {
                        slot1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                        slot2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                        slot3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                        spins++;
                        if (spins > 15) {
                            clearInterval(spinInterval);
                            const final = getRandomSymbols();
                            slot1.textContent = final[0];
                            slot2.textContent = final[1];
                            slot3.textContent = final[2];

                            let mult = 1;
                            if (final[0] === final[1] && final[1] === final[2]) {
                                if (final[0] === '💎') mult = 20;
                                else if (final[0] === '🔔') mult = 10;
                                else if (final[0] === '🍇') mult = 5;
                                else if (final[0] === '🍒' || final[0] === '🍋') mult = 3;
                            } else if (final[0] === final[1] || final[1] === final[2] || final[0] === final[2]) {
                                mult = 2;
                            }
                            // Бонус ⭐
                            if (final.includes('⭐')) {
                                // фриспин: просто еще один бесплатный спин
                                addHistory('SLOTS', 'FREE SPIN', 'win');
                                spinBtn.click(); // рекурсивно, но осторожно
                                return;
                            }
                            multiplierSpan.textContent = `x${mult}`;
                            const win = bet * mult;
                            if (mult > 1) {
                                balance += win;
                                saveBalance();
                            } else {
                                // проигрыш, ставка уже списана
                            }
                            addHistory('SLOTS', `x${mult} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>1?'win':'lose');
                        }
                    }, 100);
                });
            })();

            // ========== WHEEL (исправленный) ==========
            (function wheel() {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const spinBtn = document.getElementById('wheelSpin');
                const betInput = document.getElementById('wheelBet');
                const resultSpan = document.getElementById('wheelResult');

                const segments = [
                    { label: 'x0', color: '#444', multiplier: 0 },
                    { label: 'x1', color: '#3b82f6', multiplier: 1 },
                    { label: 'x2', color: '#10b981', multiplier: 2 },
                    { label: 'x5', color: '#f59e0b', multiplier: 5 },
                    { label: 'x10', color: '#8b5cf6', multiplier: 10 },
                    { label: 'x50', color: '#ec4899', multiplier: 50 }
                ];
                const angles = segments.map((_, i) => i * (Math.PI*2 / segments.length));

                function drawWheel(rotation = 0) {
                    ctx.clearRect(0,0,240,240);
                    const cx = 120, cy = 120, r = 100;
                    for (let i = 0; i < segments.length; i++) {
                        const start = angles[i] + rotation;
                        const end = angles[i+1] + rotation || Math.PI*2 + rotation;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.arc(cx, cy, r, start, end);
                        ctx.closePath();
                        ctx.fillStyle = segments[i].color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(start + (end-start)/2);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px Inter';
                        ctx.fillText(segments[i].label, 60, 5);
                        ctx.restore();
                    }
                }

                let spinning = false;
                spinBtn.addEventListener('click', () => {
                    if (spinning) return;
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    spinning = true;
                    const startTime = Date.now();
                    const startRot = Math.random() * Math.PI*2;
                    const spins = 5 + Math.floor(Math.random()*5);
                    const targetAngle = startRot + spins * Math.PI*2;

                    function animate() {
                        const elapsed = Date.now() - startTime;
                        if (elapsed >= 3000) {
                            spinning = false;
                            const finalRot = targetAngle;
                            drawWheel(finalRot);
                            // определение сектора
                            let norm = finalRot % (Math.PI*2);
                            if (norm < 0) norm += Math.PI*2;
                            let idx = 0;
                            for (let i = 0; i < angles.length; i++) {
                                const start = angles[i];
                                const end = angles[i+1] || Math.PI*2;
                                if (norm >= start && norm < end) {
                                    idx = i;
                                    break;
                                }
                            }
                            const mult = segments[idx].multiplier;
                            const win = bet * mult;
                            balance += win;
                            saveBalance();
                            resultSpan.textContent = `${segments[idx].label} → ${win} ⭐`;
                            addHistory('WHEEL', `${segments[idx].label} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>0?'win':'lose');
                            return;
                        }
                        const progress = elapsed / 3000;
                        const eased = 1 - Math.pow(1 - progress, 3);
                        const rot = startRot + (targetAngle - startRot) * eased;
                        drawWheel(rot);
                        requestAnimationFrame(animate);
                    }
                    animate();
                });

                drawWheel();
            })();

            // ========== MINES ==========
            (function mines() {
                const gridDiv = document.getElementById('minesGrid');
                const minesCountSelect = document.getElementById('minesCount');
                const newGameBtn = document.getElementById('minesNewGame');
                const startBtn = document.getElementById('minesStart');
                const cashoutBtn = document.getElementById('minesCashout');
                const betInput = document.getElementById('minesBet');
                const multiplierSpan = document.getElementById('minesMultiplier');
                const winSpan = document.getElementById('minesWin');

                let board = [];
                let revealed = [];
                let gameActive = false;
                let currentBet = 0;
                let minesCount = 3;
                let starsRevealed = 0;

                // Таблицы множителей для разного количества мин
                const multTable = {
                    3: [1.15, 1.35, 1.70, 2.20, 3.00, 6.50, 20, 50, 100, 200],
                    5: [1.20, 1.50, 2.00, 3.00, 5.00, 10, 25, 60, 150, 300],
                    10: [1.30, 2.00, 3.50, 6.00, 12, 25, 60, 150, 400, 1000]
                };

                function getMultiplier(mines, revealedCount) {
                    const arr = multTable[mines] || multTable[3];
                    if (revealedCount === 0) return 1.0;
                    return arr[Math.min(revealedCount - 1, arr.length - 1)];
                }

                function renderGrid() {
                    gridDiv.innerHTML = '';
                    for (let i = 0; i < 25; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'mines-cell';
                        cell.dataset.index = i;
                        if (revealed[i]) {
                            cell.classList.add(board[i] ? 'revealed-mine' : 'revealed-star');
                            cell.textContent = board[i] ? '💣' : '⭐';
                        } else {
                            cell.textContent = '?';
                        }
                        cell.addEventListener('click', cellClickHandler);
                        gridDiv.appendChild(cell);
                    }
                }

                function cellClickHandler(e) {
                    if (!gameActive) return;
                    const index = parseInt(e.currentTarget.dataset.index);
                    if (revealed[index]) return;
                    if (board[index]) {
                        revealed[index] = true;
                        renderGrid();
                        gameActive = false;
                        cashoutBtn.disabled = true;
                        addHistory('MINES', `MINE -${currentBet} ⭐`, 'lose');
                        alert('💥 Вы проиграли');
                    } else {
                        revealed[index] = true;
                        starsRevealed++;
                        const mult = getMultiplier(minesCount, starsRevealed);
                        multiplierSpan.textContent = mult.toFixed(2) + 'x';
                        const potentialWin = Math.floor(currentBet * mult);
                        winSpan.textContent = potentialWin;
                        renderGrid();
                    }
                }

                function newGame() {
                    gameActive = false;
                    cashoutBtn.disabled = true;
                    board = new Array(25).fill(false);
                    revealed = new Array(25).fill(false);
                    starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    renderGrid();
                }

                newGameBtn.addEventListener('click', newGame);

                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    const bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    currentBet = bet;
                    minesCount = parseInt(minesCountSelect.value);
                    // генерация мин
                    board = new Array(25).fill(false);
                    for (let i = 0; i < minesCount; i++) {
                        let pos;
                        do { pos = Math.floor(Math.random() * 25); } while (board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    gameActive = true;
                    cashoutBtn.disabled = false;
                    renderGrid();
                });

                cashoutBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    const mult = getMultiplier(minesCount, starsRevealed);
                    const win = Math.floor(currentBet * mult);
                    balance += win;
                    saveBalance();
                    addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                    gameActive = false;
                    cashoutBtn.disabled = true;
                });

                newGame();
            })();

            // ========== БОНУС ==========
            document.getElementById('dailyBonus').addEventListener('click', () => addStars(1000));

            // Инициализация
            updateBalance();
        })();
    </script>
