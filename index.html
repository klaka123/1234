<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINIMAL ROCKET</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== ГЛОБАЛЬНЫЙ МИНИМАЛИЗМ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d12;
            --surface: #14171c;
            --surface-light: #1e2128;
            --text: #ffffff;
            --text-secondary: #8e98a3;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --border: #2a2f38;
            --white: #ffffff;
            --red: #ef4444;
            --blue: #3b82f6;
            --yellow: #eab308;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-light);
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .balance i {
            color: var(--accent);
            font-size: 16px;
        }

        .balance span {
            font-weight: 600;
            font-size: 18px;
        }

        .daily-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .daily-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ========== ИГРОВОЙ ЭКРАН ========== */
        .game-screen {
            background: var(--surface-light);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        #rocketCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            margin-bottom: 16px;
        }

        /* Множитель внизу */
        .multiplier-mini {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            background: var(--surface);
            padding: 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            letter-spacing: 1px;
        }

        /* Инфо-панель */
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin: 16px 0 20px;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: var(--text);
        }

        /* ========== ПАНЕЛЬ СТАВОК ========== */
        .bet-panel {
            background: var(--surface-light);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .bet-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bet-input {
            flex: 2;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 16px;
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent);
        }

        .bet-mults {
            flex: 1;
            display: flex;
            gap: 6px;
        }

        .mult-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mult-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn.launch {
            background: var(--white);
            color: var(--bg);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .action-btn.launch:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .action-btn.cashout {
            background: var(--accent);
            color: white;
        }

        .action-btn.cashout:hover {
            background: #2563eb;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== ОБРАТНЫЙ ОТСЧЁТ ========== */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            border-radius: 32px;
        }

        .countdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .countdown-number {
            font-size: 72px;
            font-weight: 800;
            color: var(--white);
            text-shadow: 0 0 20px var(--accent);
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* ========== ИСТОРИЯ ========== */
        .history-section {
            margin-top: 24px;
            background: var(--surface-light);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: var(--surface);
            border-radius: 16px;
            font-size: 13px;
        }

        .history-win { color: #10b981; }
        .history-lose { color: #ef4444; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <button class="daily-btn" id="dailyBonus">
                <i class="fas fa-gift"></i>
            </button>
        </header>

        <!-- Игровой экран -->
        <div class="game-screen">
            <div class="countdown-overlay" id="countdownOverlay">
                <div class="countdown-number" id="countdownNumber">3</div>
            </div>
            <canvas id="rocketCanvas" width="380" height="280"></canvas>
            <div class="multiplier-mini" id="rocketMultiplier">1.00x</div>
        </div>

        <!-- Инфо-панель -->
        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">Last</div>
                <div class="info-value" id="lastCrash">2.45x</div>
            </div>
            <div class="info-item">
                <div class="info-label">Max</div>
                <div class="info-value" id="maxCrash">12.5x</div>
            </div>
            <div class="info-item">
                <div class="info-label">Bet</div>
                <div class="info-value" id="rocketBetAmount">10</div>
            </div>
        </div>

        <!-- Панель ставок -->
        <div class="bet-panel">
            <div class="bet-header">
                <span>Сумма</span>
                <span>Множители</span>
            </div>

            <div class="bet-row">
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <div class="bet-mults">
                    <button class="mult-btn" data-mult="2">x2</button>
                    <button class="mult-btn" data-mult="5">x5</button>
                    <button class="mult-btn" data-mult="10">x10</button>
                </div>
            </div>

            <div class="action-btns">
                <button class="action-btn launch" id="rocketStart">
                    <i class="fas fa-rocket"></i> Запуск
                </button>
                <button class="action-btn cashout" id="rocketCashout" disabled>
                    <i class="fas fa-hand-holding-usd"></i> Забрать
                </button>
            </div>
        </div>

        <!-- История -->
        <div class="history-section">
            <div class="history-title">
                <i class="fas fa-clock"></i>
                <span>Последние игры</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            // ========== ГЛОБАЛЬНЫЕ ==========
            let balance = 10000;
            let gameActive = false;
            let countdownActive = false;
            let rocketInterval = null;
            let starsInterval = null;
            let crashPoint = 2.0;
            let visualCrashPoint = 2.0;
            let currentMultiplier = 1.0;
            let rocketBet = 10;
            let vibration = 0;
            let currentNonce = 0;

            let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];
            let maxCrash = 12.5;

            // ========== DOM ==========
            const balanceSpan = document.getElementById('balance');
            const rocketCanvas = document.getElementById('rocketCanvas');
            const rocketCtx = rocketCanvas.getContext('2d');
            const rocketMultiplier = document.getElementById('rocketMultiplier');
            const lastCrashSpan = document.getElementById('lastCrash');
            const maxCrashSpan = document.getElementById('maxCrash');
            const rocketBetAmount = document.getElementById('rocketBetAmount');
            const rocketBetInput = document.getElementById('rocketBet');
            const rocketStart = document.getElementById('rocketStart');
            const rocketCashout = document.getElementById('rocketCashout');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const historyList = document.getElementById('historyList');

            // ========== БАЛАНС ==========
            function updateBalance() {
                balanceSpan.textContent = balance.toLocaleString().replace(',', ' ');
            }

            function addStars(amount) {
                balance += amount;
                updateBalance();
                addHistory('Бонус', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            // ========== РАКЕТА ПО РЕФЕРЕНСУ ==========
            function drawRocket(mult, vib) {
                rocketCtx.clearRect(0, 0, 380, 280);

                // Звёзды (очень бледные, минимализм)
                rocketCtx.fillStyle = 'rgba(255,255,255,0.15)';
                for (let i = 0; i < 30; i++) {
                    rocketCtx.beginPath();
                    rocketCtx.arc(20 + i * 15, 30 + (i % 5) * 25, 1, 0, Math.PI * 2);
                    rocketCtx.fill();
                }

                // Основная позиция ракеты (поднимается с множителем)
                const baseY = 180 - (mult - 1) * 20;
                const x = 140;
                const y = baseY;

                // Нос (красный треугольник) — как на референсе
                rocketCtx.fillStyle = '#ef4444';
                rocketCtx.shadowColor = '#ef4444';
                rocketCtx.shadowBlur = 10 + vib * 2;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x + 25, y - 20);
                rocketCtx.lineTo(x + 40, y - 5);
                rocketCtx.lineTo(x + 25, y + 5);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Корпус (синий)
                rocketCtx.fillStyle = '#3b82f6';
                rocketCtx.shadowColor = '#3b82f6';
                rocketCtx.beginPath();
                rocketCtx.moveTo(x - 25, y - 15);
                rocketCtx.lineTo(x + 25, y - 20);
                rocketCtx.lineTo(x + 25, y + 15);
                rocketCtx.lineTo(x - 25, y + 10);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Иллюминатор (жёлтый круг)
                rocketCtx.fillStyle = '#eab308';
                rocketCtx.shadowColor = '#eab308';
                rocketCtx.beginPath();
                rocketCtx.arc(x, y, 8, 0, Math.PI * 2);
                rocketCtx.fill();

                // Маленький блик на иллюминаторе
                rocketCtx.fillStyle = 'white';
                rocketCtx.shadowBlur = 5;
                rocketCtx.beginPath();
                rocketCtx.arc(x - 2, y - 2, 2, 0, Math.PI * 2);
                rocketCtx.fill();

                // Стабилизаторы (как на референсе — снизу)
                rocketCtx.fillStyle = '#2563eb';
                rocketCtx.shadowColor = '#2563eb';
                rocketCtx.beginPath();
                rocketCtx.moveTo(x - 20, y + 15);
                rocketCtx.lineTo(x - 5, y + 30);
                rocketCtx.lineTo(x - 5, y + 15);
                rocketCtx.closePath();
                rocketCtx.fill();

                rocketCtx.beginPath();
                rocketCtx.moveTo(x + 10, y + 15);
                rocketCtx.lineTo(x + 25, y + 30);
                rocketCtx.lineTo(x + 25, y + 15);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Пламя (пульсирует)
                let flameSize = 15 + Math.sin(Date.now() * 0.02) * 5;
                rocketCtx.fillStyle = '#f97316';
                rocketCtx.shadowColor = '#f97316';
                rocketCtx.shadowBlur = 20;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x - 15, y + 18);
                rocketCtx.lineTo(x, y + 28 + flameSize);
                rocketCtx.lineTo(x + 15, y + 18);
                rocketCtx.fill();

                rocketCtx.shadowBlur = 0;
            }

            // ========== ROCKET LOGIC ==========
            rocketStart.addEventListener('click', () => {
                if (gameActive || countdownActive) return;

                rocketBet = parseInt(rocketBetInput.value);
                if (rocketBet < 1 || rocketBet > balance) {
                    alert('Неверная ставка');
                    return;
                }

                if (!deductStars(rocketBet)) return;

                // Генерация краша (40% шанс на 4-10x)
                let r = Math.random();
                if (r < 0.4) {
                    crashPoint = 4 + Math.random() * 6;
                } else {
                    crashPoint = 1 + Math.random() * 3;
                }
                crashPoint = parseFloat(crashPoint.toFixed(2));
                visualCrashPoint = crashPoint;
                currentNonce++;

                // Обратный отсчёт
                countdownActive = true;
                countdownOverlay.classList.add('active');
                let count = 3;
                countdownNumber.textContent = count;

                let countInterval = setInterval(() => {
                    count--;
                    countdownNumber.textContent = count;

                    if (count === 0) {
                        clearInterval(countInterval);
                        countdownOverlay.classList.remove('active');
                        countdownActive = false;

                        gameActive = true;
                        vibration = 0;
                        rocketStart.disabled = true;
                        rocketCashout.disabled = false;
                        currentMultiplier = 1.0;
                        rocketMultiplier.textContent = '1.00x';
                        drawRocket(1.0, 0);

                        const startTime = Date.now();

                        rocketInterval = setInterval(() => {
                            if (!gameActive) return;

                            const elapsed = (Date.now() - startTime) / 1000;
                            currentMultiplier = 1 + 0.9 * elapsed;
                            rocketMultiplier.textContent = currentMultiplier.toFixed(2) + 'x';

                            vibration = Math.min(6, elapsed * 3);
                            drawRocket(currentMultiplier, vibration);

                            if (currentMultiplier >= crashPoint) {
                                clearInterval(rocketInterval);
                                gameActive = false;
                                rocketStart.disabled = false;
                                rocketCashout.disabled = true;

                                crashHistory.unshift(crashPoint);
                                if (crashHistory.length > 10) crashHistory.pop();
                                if (crashPoint > maxCrash) maxCrash = crashPoint;

                                lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                addHistory('Ракета', `crash -${rocketBet} ⭐`, 'lose');
                            }
                        }, 30);
                    }
                }, 1000);
            });

            rocketCashout.addEventListener('click', () => {
                if (!gameActive) return;

                clearInterval(rocketInterval);
                gameActive = false;
                rocketStart.disabled = false;
                rocketCashout.disabled = true;

                const win = Math.floor(rocketBet * currentMultiplier);
                balance += win;

                crashHistory.unshift(currentMultiplier);
                if (crashHistory.length > 10) crashHistory.pop();
                if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;

                lastCrashSpan.textContent = currentMultiplier.toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                updateBalance();
                addHistory('Ракета', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
            });

            // ========== HISTORY ==========
            function addHistory(game, text, type) {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
                if (historyList.children.length > 10) {
                    historyList.removeChild(historyList.lastElementChild);
                }
            }

            // ========== UI ==========
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const mult = parseInt(btn.dataset.mult);
                    const newVal = parseInt(rocketBetInput.value) * mult;
                    rocketBetInput.value = Math.min(10000, Math.max(1, newVal));
                    rocketBetAmount.textContent = rocketBetInput.value;
                });
            });

            rocketBetInput.addEventListener('input', () => {
                rocketBetAmount.textContent = rocketBetInput.value;
            });

            document.getElementById('dailyBonus').addEventListener('click', () => {
                addStars(1000);
            });

            // ========== INIT ==========
            function init() {
                updateBalance();
                drawRocket(1.0, 0);
                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                rocketBetAmount.textContent = rocketBetInput.value;
                addHistory('Ракета', 'x4.56 +456 ⭐', 'win');
                addHistory('Ракета', 'crash -100 ⭐', 'lose');
            }

            init();
        })();
    </script>
</body>
</html>
