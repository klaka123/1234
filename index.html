<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 КАЗИНО</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
        }
        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
        }
        .balance i {
            color: #fbbf24;
        }
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #334155;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .nav {
            display: flex;
            gap: 5px;
            background: #1e293b;
            padding: 5px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 35px;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-btn.active {
            background: #3b82f6;
            color: white;
        }
        .game {
            display: none;
        }
        .game.active {
            display: block;
        }
        .stage {
            background: #000;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 2px solid #334155;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        .info {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 15px;
            border-radius: 20px;
            margin: 16px 0;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            color: #94a3b8;
            font-size: 12px;
        }
        .info-value {
            font-weight: bold;
            color: #3b82f6;
            font-size: 18px;
        }
        .bet-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
        }
        .bet-input {
            width: 100%;
            padding: 16px;
            background: #334155;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn.primary {
            background: #3b82f6;
            color: white;
        }
        .btn.success {
            background: #10b981;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 30px;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 30px;
            font-weight: bold;
        }
        .result {
            margin-top: 16px;
            padding: 20px;
            background: #1e293b;
            border-radius: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        .cell {
            aspect-ratio: 1;
            background: #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }
        .cell.star {
            background: #166534;
        }
        .cell.mine {
            background: #991b1b;
        }
        .history {
            background: #1e293b;
            padding: 16px;
            border-radius: 20px;
            margin-top: 20px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        .win { color: #3b82f6; }
        .lose { color: #ef4444; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="balance">
                <span>⭐</span>
                <span id="balance">10000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="bonusBtn">🎁</button>
            </div>
        </div>

        <!-- Навигация -->
        <div class="nav" id="nav">
            <button class="nav-btn active" data-game="rocket">🚀</button>
            <button class="nav-btn" data-game="plinko">🔴</button>
            <button class="nav-btn" data-game="slots">🎰</button>
            <button class="nav-btn" data-game="wheel">🎡</button>
            <button class="nav-btn" data-game="mines">💣</button>
        </div>

        <!-- ROCKET -->
        <div id="rocket" class="game active">
            <div class="stage" style="position: relative;">
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier" id="rocketMultiplier">1.00x</div>
            </div>
            <div class="info">
                <div><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
                <div><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
                <div><div class="info-label">BET</div><div class="info-value" id="rocketBetValue">10</div></div>
            </div>
            <div class="bet-panel">
                <input type="number" id="rocketBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn primary" id="rocketStart">СТАРТ</button>
                    <button class="btn success" id="rocketStop" disabled>СТОП</button>
                </div>
            </div>
        </div>

        <!-- PLINKO -->
        <div id="plinko" class="game">
            <div class="stage">
                <canvas id="plinkoCanvas" width="380" height="500"></canvas>
            </div>
            <div class="bet-panel">
                <input type="number" id="plinkoBet" class="bet-input" value="10">
                <button class="btn primary" id="plinkoDrop">БРОСИТЬ</button>
                <div class="result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- SLOTS -->
        <div id="slots" class="game">
            <div class="stage" style="padding: 20px;">
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <div style="background: #334155; width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px;" id="slot1">🍒</div>
                    <div style="background: #334155; width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px;" id="slot2">🍒</div>
                    <div style="background: #334155; width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px;" id="slot3">🍒</div>
                </div>
                <div class="info-value" style="text-align: center; margin-top: 20px;" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <input type="number" id="slotsBet" class="bet-input" value="10">
                <button class="btn primary" id="slotsSpin">КРУТИТЬ</button>
            </div>
        </div>

        <!-- WHEEL -->
        <div id="wheel" class="game">
            <div class="stage" style="padding: 20px;">
                <canvas id="wheelCanvas" width="250" height="250" style="margin: 0 auto; display: block;"></canvas>
            </div>
            <div class="result" id="wheelResult">—</div>
            <div class="bet-panel">
                <input type="number" id="wheelBet" class="bet-input" value="10">
                <button class="btn primary" id="wheelSpin">КРУТИТЬ</button>
            </div>
        </div>

        <!-- MINES -->
        <div id="mines" class="game">
            <div class="mines-header" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <select id="minesCount" style="flex:1; background: #334155; border: none; border-radius: 30px; padding: 14px; color: white;">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="btn success" id="minesNewGame">НОВАЯ</button>
            </div>
            <div class="grid" id="minesGrid"></div>
            <div style="display: flex; justify-content: space-between; margin: 16px 0;">
                <span>Множитель: <span id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span></span>
            </div>
            <div class="bet-panel">
                <input type="number" id="minesBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn primary" id="minesStart">СТАВКА</button>
                    <button class="btn success" id="minesCashout" disabled>ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- История -->
        <div class="history">
            <div style="margin-bottom: 10px;">📜 ПОСЛЕДНИЕ ИГРЫ</div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // Telegram
        const tg = Telegram.WebApp;
        tg.expand();

        // Данные
        let balance = 10000;
        let history = [];

        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }

        function addStars(amount) {
            balance += amount;
            updateBalance();
            addHistory('Бонус', `+${amount} ⭐`, 'win');
        }

        function deductStars(amount) {
            if (balance >= amount) {
                balance -= amount;
                updateBalance();
                return true;
            }
            return false;
        }

        function addHistory(game, text, type) {
            history.unshift({ game, text, type });
            if (history.length > 5) history.pop();
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => 
                `<div class="history-item"><span>${item.game}</span><span class="${item.type}">${item.text}</span></div>`
            ).join('');
        }

        // Навигация
        const navBtns = document.querySelectorAll('.nav-btn');
        const games = {
            rocket: document.getElementById('rocket'),
            plinko: document.getElementById('plinko'),
            slots: document.getElementById('slots'),
            wheel: document.getElementById('wheel'),
            mines: document.getElementById('mines')
        };

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(games).forEach(g => g.classList.remove('active'));
                games[btn.dataset.game].classList.add('active');
            });
        });

        // ROCKET
        (function rocket() {
            const canvas = document.getElementById('rocketCanvas');
            const ctx = canvas.getContext('2d');
            const multiplierEl = document.getElementById('rocketMultiplier');
            const lastCrash = document.getElementById('lastCrash');
            const maxCrash = document.getElementById('maxCrash');
            const betInput = document.getElementById('rocketBet');
            const betValue = document.getElementById('rocketBetValue');
            const startBtn = document.getElementById('rocketStart');
            const stopBtn = document.getElementById('rocketStop');

            let gameActive = false;
            let countdown = false;
            let interval = null;
            let crashPoint = 2.0;
            let currentMult = 1.0;
            let bet = 10;

            function drawRocket(mult) {
                ctx.clearRect(0, 0, 380, 280);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, 380, 280);
                
                ctx.font = '70px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#3b82f6';
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 20;
                
                const y = 140 - (mult - 1) * 10;
                ctx.fillText('🚀', 190, y);
                ctx.shadowBlur = 0;
            }

            startBtn.addEventListener('click', () => {
                if (gameActive || countdown) return;
                bet = parseInt(betInput.value);
                if (bet < 1 || bet > balance) return alert('Неверная ставка');
                if (!deductStars(bet)) return;

                crashPoint = 1 + Math.random() * 9;
                crashPoint = Math.round(crashPoint * 100) / 100;

                countdown = true;
                multiplierEl.textContent = '3';
                let c = 3;
                const ci = setInterval(() => {
                    c--;
                    if (c > 0) multiplierEl.textContent = c;
                    else {
                        clearInterval(ci);
                        countdown = false;
                        multiplierEl.textContent = '1.00x';
                        gameActive = true;
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        currentMult = 1.0;
                        const startTime = Date.now();

                        interval = setInterval(() => {
                            if (!gameActive) return;
                            const elapsed = (Date.now() - startTime) / 1000;
                            currentMult = 1 + 0.7 * elapsed;
                            multiplierEl.textContent = currentMult.toFixed(2) + 'x';
                            drawRocket(currentMult);

                            if (currentMult >= crashPoint) {
                                clearInterval(interval);
                                gameActive = false;
                                startBtn.disabled = false;
                                stopBtn.disabled = true;
                                lastCrash.textContent = crashPoint.toFixed(2) + 'x';
                                addHistory('ROCKET', `CRASH -${bet} ⭐`, 'lose');
                            }
                        }, 50);
                    }
                }, 800);
            });

            stopBtn.addEventListener('click', () => {
                if (!gameActive) return;
                clearInterval(interval);
                gameActive = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                const win = Math.floor(bet * currentMult);
                balance += win;
                updateBalance();
                lastCrash.textContent = currentMult.toFixed(2) + 'x';
                addHistory('ROCKET', `x${currentMult.toFixed(2)} +${win} ⭐`, 'win');
            });

            betInput.addEventListener('input', () => {
                betValue.textContent = betInput.value;
            });

            drawRocket(1);
        })();

        // PLINKO
        (function plinko() {
            const canvas = document.getElementById('plinkoCanvas');
            const ctx = canvas.getContext('2d');
            const dropBtn = document.getElementById('plinkoDrop');
            const result = document.getElementById('plinkoResult');
            const betInput = document.getElementById('plinkoBet');

            const multipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];

            function drawBoard() {
                ctx.clearRect(0, 0, 380, 500);
                ctx.fillStyle = '#3b82f6';
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c <= r; c++) {
                        let x = 190 - r * 20 + c * 40;
                        let y = 40 + r * 48;
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }
            }

            dropBtn.addEventListener('click', () => {
                let bet = parseInt(betInput.value);
                if (bet < 1 || bet > balance) return alert('Неверная ставка');
                if (!deductStars(bet)) return;

                const col = Math.floor(Math.random() * 9);
                const mult = multipliers[col];
                const win = Math.floor(bet * mult);
                balance += win;
                updateBalance();
                result.textContent = mult >= 1 ? `WIN ${win} ⭐` : `LOSE ${win} ⭐`;
                addHistory('PLINKO', `x${mult} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
            });

            drawBoard();
        })();

        // SLOTS
        (function slots() {
            const slot1 = document.getElementById('slot1');
            const slot2 = document.getElementById('slot2');
            const slot3 = document.getElementById('slot3');
            const multiplierSpan = document.getElementById('slotsMultiplier');
            const spinBtn = document.getElementById('slotsSpin');
            const betInput = document.getElementById('slotsBet');

            const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '⭐'];

            spinBtn.addEventListener('click', () => {
                let bet = parseInt(betInput.value);
                if (bet < 1 || bet > balance) return alert('Неверная ставка');
                if (!deductStars(bet)) return;

                const r1 = Math.floor(Math.random() * symbols.length);
                const r2 = Math.floor(Math.random() * symbols.length);
                const r3 = Math.floor(Math.random() * symbols.length);

                slot1.textContent = symbols[r1];
                slot2.textContent = symbols[r2];
                slot3.textContent = symbols[r3];

                let mult = 0;
                if (r1 === r2 && r2 === r3) {
                    if (r1 === 4) mult = 15;
                    else if (r1 === 5) mult = 20;
                    else mult = 3;
                } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                    mult = 2;
                }

                if (mult === 0) {
                    multiplierSpan.textContent = 'x0';
                    addHistory('SLOTS', `LOSE -${bet} ⭐`, 'lose');
                } else {
                    const win = bet * mult;
                    balance += win;
                    updateBalance();
                    multiplierSpan.textContent = `x${mult}`;
                    addHistory('SLOTS', `x${mult} +${win} ⭐`, 'win');
                }
            });
        })();

        // WHEEL
        (function wheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('wheelSpin');
            const betInput = document.getElementById('wheelBet');
            const resultSpan = document.getElementById('wheelResult');

            const sectors = [
                { label: 'x0', mult: 0, color: '#ef4444' },
                { label: 'x1', mult: 1, color: '#3b82f6' },
                { label: 'x2', mult: 2, color: '#10b981' },
                { label: 'x5', mult: 5, color: '#f59e0b' },
                { label: 'x10', mult: 10, color: '#8b5cf6' },
                { label: 'x50', mult: 50, color: '#ec4899' }
            ];

            function drawWheel(rot = 0) {
                ctx.clearRect(0,0,250,250);
                const ang = (2 * Math.PI) / sectors.length;
                for (let i = 0; i < sectors.length; i++) {
                    ctx.beginPath();
                    ctx.moveTo(125,125);
                    ctx.arc(125,125,110, i*ang + rot, (i+1)*ang + rot);
                    ctx.closePath();
                    ctx.fillStyle = sectors[i].color;
                    ctx.fill();
                }
            }

            spinBtn.addEventListener('click', () => {
                let bet = parseInt(betInput.value);
                if (bet < 1 || bet > balance) return alert('Неверная ставка');
                if (!deductStars(bet)) return;

                const idx = Math.floor(Math.random() * sectors.length);
                const mult = sectors[idx].mult;
                const win = bet * mult;
                balance += win;
                updateBalance();
                resultSpan.textContent = `${sectors[idx].label} → ${win} ⭐`;
                addHistory('WHEEL', `${sectors[idx].label} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>0?'win':'lose');
                
                let spins = 10;
                let interval = setInterval(() => {
                    drawWheel(Date.now() * 0.01);
                    spins--;
                    if (spins === 0) clearInterval(interval);
                }, 50);
            });

            drawWheel();
        })();

        // MINES
        (function mines() {
            const grid = document.getElementById('minesGrid');
            const countSelect = document.getElementById('minesCount');
            const newGame = document.getElementById('minesNewGame');
            const startBtn = document.getElementById('minesStart');
            const cashoutBtn = document.getElementById('minesCashout');
            const betInput = document.getElementById('minesBet');
            const multiplierSpan = document.getElementById('minesMultiplier');
            const winSpan = document.getElementById('minesWin');

            let board = [], revealed = [], active = false, bet = 0, mines = 3, stars = 0;

            function render() {
                grid.innerHTML = '';
                for (let i = 0; i < 25; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (revealed[i]) {
                        cell.classList.add(board[i] ? 'mine' : 'star');
                        cell.textContent = board[i] ? '💣' : '⭐';
                    } else {
                        cell.textContent = '?';
                    }
                    cell.onclick = () => {
                        if (!active) return;
                        if (revealed[i]) return;
                        if (board[i]) {
                            revealed[i] = true;
                            render();
                            active = false;
                            cashoutBtn.disabled = true;
                            addHistory('MINES', `MINE -${bet} ⭐`, 'lose');
                            alert('💥 Проигрыш!');
                        } else {
                            revealed[i] = true;
                            stars++;
                            const mult = stars === 0 ? 1 : (1 + stars * 0.3);
                            multiplierSpan.textContent = mult.toFixed(2) + 'x';
                            winSpan.textContent = Math.floor(bet * mult);
                            render();
                        }
                    };
                    grid.appendChild(cell);
                }
            }

            function reset() {
                active = false;
                cashoutBtn.disabled = true;
                stars = 0;
                multiplierSpan.textContent = '1.00x';
                winSpan.textContent = '0';
                render();
            }

            newGame.onclick = reset;

            startBtn.onclick = () => {
                const b = parseInt(betInput.value);
                if (b < 1 || b > balance) return alert('Неверная ставка');
                if (!deductStars(b)) return;
                bet = b;
                mines = parseInt(countSelect.value);
                board = new Array(25).fill(false);
                for (let i = 0; i < mines; i++) {
                    let pos;
                    do { pos = Math.floor(Math.random() * 25); } while (board[pos]);
                    board[pos] = true;
                }
                revealed = new Array(25).fill(false);
                stars = 0;
                multiplierSpan.textContent = '1.00x';
                winSpan.textContent = '0';
                active = true;
                cashoutBtn.disabled = false;
                render();
            };

            cashoutBtn.onclick = () => {
                if (!active) return;
                const mult = stars === 0 ? 1 : (1 + stars * 0.3);
                const win = Math.floor(bet * mult);
                balance += win;
                updateBalance();
                addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                active = false;
                cashoutBtn.disabled = true;
                render();
            };

            reset();
        })();

        // Бонус
        document.getElementById('bonusBtn').addEventListener('click', () => {
            addStars(1000);
        });

        updateBalance();
    </script>
</body>
</html>
