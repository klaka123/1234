<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROCKET CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            color: white;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            background: #12161f;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #2a313e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2632;
            padding: 12px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
        }
        .balance i {
            color: #3b82f6;
        }
        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a313e;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-btn:hover {
            color: #3b82f6;
        }
        .game-container {
            background: #1e2632;
            border-radius: 30px;
            padding: 20px;
        }
        .stage {
            background: #000;
            border-radius: 30px;
            height: 280px;
            position: relative;
            border: 2px solid #2a313e;
            overflow: hidden;
            margin-bottom: 16px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 32px;
            font-weight: bold;
            z-index: 10;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: #12161f;
            border-radius: 30px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .info-value {
            font-weight: bold;
            color: #3b82f6;
            font-size: 18px;
        }
        .bet-panel {
            background: #12161f;
            border-radius: 30px;
            padding: 20px;
        }
        .bet-input {
            width: 100%;
            padding: 16px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .history {
            background: #1e2632;
            border-radius: 30px;
            padding: 16px;
            margin-top: 20px;
        }
        .history-title {
            margin-bottom: 12px;
            color: #94a3b8;
            font-size: 14px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #12161f;
            border-radius: 30px;
            font-size: 14px;
        }
        .win {
            color: #3b82f6;
        }
        .lose {
            color: #ef4444;
        }
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1e2632;
            border-radius: 40px;
            padding: 30px;
            max-width: 360px;
            width: 90%;
            border: 2px solid #3b82f6;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        .section {
            margin-bottom: 24px;
        }
        .section h4 {
            margin-bottom: 12px;
            color: #3b82f6;
        }
        .ref-link {
            background: #2a313e;
            padding: 12px;
            border-radius: 30px;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .promo-item {
            background: #2a313e;
            padding: 12px 16px;
            border-radius: 30px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        .promo-code {
            color: #3b82f6;
            font-weight: bold;
        }
        .promo-value {
            background: #3b82f6;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .promo-input {
            width: 100%;
            padding: 14px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            margin: 12px 0;
        }
        .close-btn {
            width: 100%;
            padding: 16px;
            background: #3b82f6;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10000</span>
            </div>
            <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        </div>

        <div class="game-container">
            <div class="stage">
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier" id="rocketMultiplier">1.00x</div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="info-label">LAST</div>
                    <div class="info-value" id="lastCrash">2.45x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">MAX</div>
                    <div class="info-value" id="maxCrash">12.5x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">BET</div>
                    <div class="info-value" id="rocketBetValue">10</div>
                </div>
            </div>

            <div class="bet-panel">
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <div class="actions">
                    <button class="btn btn-primary" id="rocketStart">🚀 СТАРТ</button>
                    <button class="btn btn-success" id="rocketStop" disabled>⏹️ СТОП</button>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">📜 ПОСЛЕДНИЕ ИГРЫ</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Модальное меню -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <h3>МЕНЮ</h3>
            <div class="section">
                <h4>🤝 РЕФЕРАЛЫ</h4>
                <div class="ref-link" id="refLink">Загрузка...</div>
                <div>Приглашено: <span id="refCount">0</span> (бонус: <span id="refBonus">0</span> ⭐)</div>
            </div>
            <div class="section">
                <h4>🎟️ ПРОМОКОДЫ</h4>
                <div class="promo-item" data-code="2026"><span class="promo-code">2026</span><span class="promo-value">+50</span></div>
                <div class="promo-item" data-code="GDB"><span class="promo-code">GDB</span><span class="promo-value">+100</span></div>
                <div class="promo-item" data-code="DROP"><span class="promo-code">DROP</span><span class="promo-value">+10</span></div>
                <div class="promo-item" data-code="FREE"><span class="promo-code">FREE</span><span class="promo-value">+15</span></div>
                <input type="text" id="promoInput" class="promo-input" placeholder="Введите промокод">
                <button class="close-btn" id="applyPromo">АКТИВИРОВАТЬ</button>
            </div>
            <button class="close-btn" id="closeMenu">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        (function() {
            // --- Telegram WebApp ---
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            // --- Уникальный ID пользователя (для localStorage) ---
            const userId = tg.initDataUnsafe?.user?.id?.toString() || 'guest_' + Math.random().toString(36).substring(2);
            const storageKey = `casino_${userId}`;

            // --- Данные пользователя ---
            let data = JSON.parse(localStorage.getItem(storageKey)) || {
                balance: 10000,
                referrals: [],            // массив ID приглашённых (для рефералов)
                usedPromos: [],            // активированные промокоды
                referralBonusPaid: 0,
                history: []                 // история игр
            };

            function saveData() {
                localStorage.setItem(storageKey, JSON.stringify(data));
            }

            // --- Обновление баланса на экране ---
            function updateBalance() {
                document.getElementById('balance').textContent = data.balance;
            }

            // --- Добавление звёзд ---
            function addStars(amount) {
                data.balance += amount;
                saveData();
                updateBalance();
                addHistory('Бонус', `+${amount} ⭐`, 'win');
            }

            // --- Списание звёзд (ставка) ---
            function deductStars(amount) {
                if (data.balance >= amount) {
                    data.balance -= amount;
                    saveData();
                    updateBalance();
                    return true;
                }
                return false;
            }

            // --- История игр ---
            function addHistory(game, text, type) {
                data.history.unshift({ game, text, type });
                if (data.history.length > 5) data.history.pop();
                renderHistory();
                saveData();
            }

            function renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                data.history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `<span>${item.game}</span><span class="${item.type}">${item.text}</span>`;
                    list.appendChild(div);
                });
            }

            // --- Реферальная система ---
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('ref_')) {
                const referrerId = startParam.replace('ref_', '');
                if (!localStorage.getItem(`referred_${userId}`) && referrerId !== userId) {
                    // Добавляем реферала в список пригласившего
                    let referrerData = JSON.parse(localStorage.getItem(`casino_${referrerId}`) || '{"referrals":[]}');
                    if (!referrerData.referrals) referrerData.referrals = [];
                    if (!referrerData.referrals.includes(userId)) {
                        referrerData.referrals.push(userId);
                        localStorage.setItem(`casino_${referrerId}`, JSON.stringify(referrerData));
                    }
                    localStorage.setItem(`referred_${userId}`, 'true');
                }
            }

            function getReferrals() {
                return data.referrals || [];
            }

            function updateReferralDisplay() {
                const botName = tg.initDataUnsafe?.user?.username || 'your_bot';
                document.getElementById('refLink').textContent = `t.me/${botName}?start=ref_${userId}`;
                const refs = getReferrals();
                document.getElementById('refCount').textContent = refs.length;
                document.getElementById('refBonus').textContent = refs.length * 10;
            }

            function applyReferralBonus() {
                const refs = getReferrals();
                const expected = refs.length * 10;
                const current = data.referralBonusPaid || 0;
                if (expected > current) {
                    data.balance += expected - current;
                    data.referralBonusPaid = expected;
                    saveData();
                    updateBalance();
                }
            }

            // --- Промокоды ---
            const promoCodes = {
                '2026': 50,
                'GDB': 100,
                'DROP': 10,
                'FREE': 15
            };

            function applyPromo(code) {
                const upper = code.toUpperCase();
                if (data.usedPromos.includes(upper)) {
                    alert('Промокод уже активирован');
                    return false;
                }
                if (promoCodes[upper]) {
                    data.balance += promoCodes[upper];
                    data.usedPromos.push(upper);
                    saveData();
                    updateBalance();
                    alert(`Промокод активирован! +${promoCodes[upper]} ⭐`);
                    addHistory('Промокод', `+${promoCodes[upper]} ⭐`, 'win');
                    return true;
                }
                alert('Неверный промокод');
                return false;
            }

            // --- Модальное меню ---
            const menuBtn = document.getElementById('menuBtn');
            const menuModal = document.getElementById('menuModal');
            const closeMenu = document.getElementById('closeMenu');

            menuBtn.addEventListener('click', () => {
                applyReferralBonus();
                updateReferralDisplay();
                menuModal.classList.add('active');
            });

            closeMenu.addEventListener('click', () => {
                menuModal.classList.remove('active');
            });

            menuModal.addEventListener('click', (e) => {
                if (e.target === menuModal) menuModal.classList.remove('active');
            });

            // Промокоды в модалке
            document.querySelectorAll('.promo-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.getElementById('promoInput').value = item.dataset.code;
                });
            });

            document.getElementById('applyPromo').addEventListener('click', () => {
                const input = document.getElementById('promoInput');
                const code = input.value.trim();
                if (code) {
                    applyPromo(code);
                    input.value = '';
                }
            });

            // --- ROCKET GAME ---
            const canvas = document.getElementById('rocketCanvas');
            const ctx = canvas.getContext('2d');
            const multiplierEl = document.getElementById('rocketMultiplier');
            const lastCrashEl = document.getElementById('lastCrash');
            const maxCrashEl = document.getElementById('maxCrash');
            const betInput = document.getElementById('rocketBet');
            const betValueEl = document.getElementById('rocketBetValue');
            const startBtn = document.getElementById('rocketStart');
            const stopBtn = document.getElementById('rocketStop');

            let gameActive = false;
            let rocketInterval = null;
            let crashPoint = 2.0;
            let currentMultiplier = 1.0;
            let bet = 10;
            let maxCrash = 12.5;
            let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];

            // Отрисовка ракеты (просто эмодзи)
            function drawRocket(multiplier) {
                ctx.clearRect(0, 0, 380, 280);
                // звёзды
                for (let i = 0; i < 30; i++) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(Math.random()*380, Math.random()*280, Math.random()*2, 0, 2*Math.PI);
                    ctx.fill();
                }
                const y = 150 - (multiplier - 1) * 15;
                ctx.font = '70px "Segoe UI Emoji"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffffff';
                ctx.fillText('🚀', 190, y);
                ctx.shadowBlur = 0;
            }

            startBtn.addEventListener('click', () => {
                if (gameActive) return;
                bet = parseInt(betInput.value);
                if (bet < 1 || bet > data.balance) {
                    alert('Неверная ставка');
                    return;
                }
                if (!deductStars(bet)) return;

                // Генерация точки краша (от 1 до 10)
                crashPoint = 1 + Math.random() * 9;
                crashPoint = Math.round(crashPoint * 100) / 100;

                // Запуск игры
                gameActive = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                currentMultiplier = 1.0;
                multiplierEl.textContent = '1.00x';
                drawRocket(1.0);

                const startTime = Date.now();
                rocketInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    currentMultiplier = 1 + 0.5 * elapsed; // медленный рост
                    multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                    drawRocket(currentMultiplier);

                    if (currentMultiplier >= crashPoint) {
                        // Краш
                        clearInterval(rocketInterval);
                        gameActive = false;
                        startBtn.disabled = false;
                        stopBtn.disabled = true;

                        crashHistory.unshift(crashPoint);
                        if (crashPoint > maxCrash) maxCrash = crashPoint;
                        lastCrashEl.textContent = crashPoint.toFixed(2) + 'x';
                        maxCrashEl.textContent = maxCrash.toFixed(2) + 'x';

                        addHistory('Rocket', `CRASH -${bet} ⭐`, 'lose');
                    }
                }, 30);
            });

            stopBtn.addEventListener('click', () => {
                if (!gameActive) return;
                clearInterval(rocketInterval);
                gameActive = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;

                const win = Math.floor(bet * currentMultiplier);
                data.balance += win;
                saveData();
                updateBalance();

                crashHistory.unshift(currentMultiplier);
                if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;
                lastCrashEl.textContent = currentMultiplier.toFixed(2) + 'x';
                maxCrashEl.textContent = maxCrash.toFixed(2) + 'x';

                addHistory('Rocket', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
            });

            betInput.addEventListener('input', () => {
                betValueEl.textContent = betInput.value;
            });

            // Инициализация
            lastCrashEl.textContent = crashHistory[0].toFixed(2) + 'x';
            maxCrashEl.textContent = maxCrash.toFixed(2) + 'x';
            drawRocket(1);
            updateBalance();
            updateReferralDisplay();
            renderHistory();
        })();
    </script>
</body>
</html>
