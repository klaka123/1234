<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON ROCKET • PLINKO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0c10;
            --surface: #12141a;
            --surface-light: #1e212a;
            --text: #ffffff;
            --text-muted: #8892a6;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: #2a2f3a;
            --white: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border-radius: 36px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-light);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .balance i {
            color: var(--accent);
            font-size: 18px;
        }

        .balance span {
            font-weight: 600;
            font-size: 20px;
        }

        .daily-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .daily-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Табы */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--surface-light);
            border-radius: 60px;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        /* Игровой контейнер */
        .game-container {
            background: var(--surface-light);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        /* Rocket */
        .rocket-stage {
            position: relative;
            background: linear-gradient(180deg, #0c0f17 0%, #05070a 100%);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            height: 280px;
        }

        #rocketCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .multiplier-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            z-index: 10;
        }

        .auto-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .auto-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 60px;
        }

        .auto-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .auto-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Инфо-панель */
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
            color: var(--accent);
        }

        /* Панель ставок */
        .bet-panel {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .bet-input {
            width: 100%;
            padding: 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text);
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent);
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn.primary {
            background: var(--accent);
            color: white;
        }

        .action-btn.primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Plinko specific */
        .plinko-stage {
            background: linear-gradient(180deg, #0c0f17 0%, #05070a 100%);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        #plinkoCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        .multiplier-row {
            display: flex;
            justify-content: space-around;
            margin: 16px 0;
            gap: 4px;
        }

        .multiplier-cell {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface);
            padding: 12px 0;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .plinko-result {
            margin-top: 20px;
            padding: 16px;
            background: var(--surface);
            border-radius: 30px;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        /* История */
        .history-section {
            background: var(--surface-light);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: var(--surface);
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .history-win { color: #3b82f6; }
        .history-lose { color: #ef4444; }

        .hidden { display: none; }

        /* Обратный отсчёт */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            border-radius: 24px;
        }

        .countdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .countdown-number {
            font-size: 80px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <button class="daily-btn" id="dailyBonus">
                <i class="fas fa-gift"></i>
            </button>
        </header>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab active" id="tabRocket">Rocket</button>
            <button class="tab" id="tabPlinko">Plinko</button>
        </div>

        <!-- Rocket -->
        <div id="rocketGame" class="game-container">
            <div class="rocket-stage">
                <div class="countdown-overlay" id="countdownOverlay">
                    <div class="countdown-number" id="countdownNumber">3</div>
                </div>
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier-box" id="rocketMultiplier">1.00x</div>
            </div>

            <!-- Кнопки авто-кэшаута -->
            <div class="auto-buttons" id="autoButtons">
                <button class="auto-btn" data-target="1.5">1.5x</button>
                <button class="auto-btn" data-target="2">2x</button>
                <button class="auto-btn" data-target="5">5x</button>
                <button class="auto-btn" data-target="10">10x</button>
            </div>

            <!-- Инфо -->
            <div class="info-row">
                <div class="info-item">
                    <div class="info-label">Last</div>
                    <div class="info-value" id="lastCrash">2.45x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Max</div>
                    <div class="info-value" id="maxCrash">12.5x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Bet</div>
                    <div class="info-value" id="rocketBetAmount">10</div>
                </div>
            </div>

            <!-- Панель ставок -->
            <div class="bet-panel">
                <div class="bet-header">
                    <span>Ставка</span>
                </div>
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="rocketStart">
                    <i class="fas fa-rocket"></i> Запуск
                </button>
            </div>
        </div>

        <!-- Plinko -->
        <div id="plinkoGame" class="game-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="500"></canvas>
            </div>

            <!-- Множители (просто текст) -->
            <div class="multiplier-row" id="multiplierRow"></div>

            <!-- Панель ставок -->
            <div class="bet-panel">
                <div class="bet-header">
                    <span>Ставка</span>
                </div>
                <input type="number" id="plinkoBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="plinkoDrop">
                    <i class="fas fa-arrow-down"></i> Бросить
                </button>
                <div class="plinko-result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- История (5 последних) -->
        <div class="history-section">
            <div class="history-title">
                <i class="fas fa-history"></i>
                <span>Последние 5 игр</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            // ========== ГЛОБАЛЬНЫЕ ==========
            let balance = 10000;
            let gameActive = false;
            let countdownActive = false;
            let rocketInterval = null;
            let crashPoint = 2.0;
            let visualCrashPoint = 2.0;
            let currentMultiplier = 1.0;
            let rocketBet = 10;
            let vibration = 0;
            let autoTarget = null; // целевой множитель для авто-кэшаута
            let autoTriggered = false; // был ли уже авто-кэшаут

            let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67]; // для last crash
            let maxCrash = 12.5;

            // Plinko
            let plinkoAnimation = null;
            const plinkoMultipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0]; // просто текстовые

            // ========== DOM ==========
            const balanceSpan = document.getElementById('balance');
            const tabRocket = document.getElementById('tabRocket');
            const tabPlinko = document.getElementById('tabPlinko');
            const rocketGame = document.getElementById('rocketGame');
            const plinkoGame = document.getElementById('plinkoGame');
            const rocketCanvas = document.getElementById('rocketCanvas');
            const rocketCtx = rocketCanvas.getContext('2d');
            const plinkoCanvas = document.getElementById('plinkoCanvas');
            const plinkoCtx = plinkoCanvas.getContext('2d');
            const rocketMultiplier = document.getElementById('rocketMultiplier');
            const lastCrashSpan = document.getElementById('lastCrash');
            const maxCrashSpan = document.getElementById('maxCrash');
            const rocketBetAmount = document.getElementById('rocketBetAmount');
            const rocketBetInput = document.getElementById('rocketBet');
            const rocketStart = document.getElementById('rocketStart');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const autoButtons = document.querySelectorAll('.auto-btn');
            const multiplierRow = document.getElementById('multiplierRow');
            const plinkoBetInput = document.getElementById('plinkoBet');
            const plinkoDrop = document.getElementById('plinkoDrop');
            const plinkoResult = document.getElementById('plinkoResult');
            const historyList = document.getElementById('historyList');

            // ========== БАЛАНС ==========
            function updateBalance() {
                balanceSpan.textContent = balance.toLocaleString().replace(',', ' ');
            }

            function addStars(amount) {
                balance += amount;
                updateBalance();
                addHistory('Бонус', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            // ========== КРАСИВАЯ РАКЕТА (ЭМОДЗИ-СТИЛЬ) ==========
            function drawRocket(mult, vib) {
                rocketCtx.clearRect(0, 0, 380, 280);

                // Звёзды позади
                rocketCtx.fillStyle = 'rgba(255,255,255,0.3)';
                for (let i = 0; i < 50; i++) {
                    let x = (i * 27) % 380;
                    let y = (i * 19) % 280;
                    rocketCtx.beginPath();
                    rocketCtx.arc(x, y, 1 + Math.random()*2, 0, Math.PI*2);
                    rocketCtx.fill();
                }

                // Позиция ракеты: поднимается с множителем
                const baseY = 200 - (mult - 1) * 20; // старт с 200px
                const x = 160 + (Math.sin(Date.now()*0.01) * vib); // горизонтальная тряска
                const y = baseY + (Math.cos(Date.now()*0.02) * vib); // вертикальная тряска

                // ---- РАКЕТА (эмодзи-стиль) ----
                // Корпус (белый с синим отливом)
                rocketCtx.shadowColor = '#3b82f6';
                rocketCtx.shadowBlur = 20 + vib * 3;

                // Градиент корпуса
                let gradient = rocketCtx.createLinearGradient(x-25, y-20, x+25, y+20);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.7, '#aaccff');
                rocketCtx.fillStyle = gradient;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-20, y-20);
                rocketCtx.lineTo(x+20, y-25);
                rocketCtx.lineTo(x+25, y+10);
                rocketCtx.lineTo(x-15, y+20);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Нос (синий)
                rocketCtx.fillStyle = '#3b82f6';
                rocketCtx.beginPath();
                rocketCtx.moveTo(x+20, y-25);
                rocketCtx.lineTo(x+40, y-10);
                rocketCtx.lineTo(x+25, y+10);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Иллюминатор (белый с синим ободком)
                rocketCtx.fillStyle = '#ffffff';
                rocketCtx.shadowBlur = 15;
                rocketCtx.beginPath();
                rocketCtx.arc(x, y-5, 8, 0, Math.PI*2);
                rocketCtx.fill();
                rocketCtx.fillStyle = '#3b82f6';
                rocketCtx.beginPath();
                rocketCtx.arc(x-2, y-7, 2, 0, Math.PI*2);
                rocketCtx.fill();

                // Пламя (пульсирует)
                let flame = 15 + Math.sin(Date.now()*0.02) * 5;
                rocketCtx.fillStyle = '#f97316';
                rocketCtx.shadowColor = '#f97316';
                rocketCtx.shadowBlur = 25;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-10, y+20);
                rocketCtx.lineTo(x, y+30 + flame);
                rocketCtx.lineTo(x+10, y+20);
                rocketCtx.fill();

                // Стабилизаторы (синие)
                rocketCtx.fillStyle = '#2563eb';
                rocketCtx.shadowBlur = 15;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-20, y+5);
                rocketCtx.lineTo(x-35, y+25);
                rocketCtx.lineTo(x-15, y+15);
                rocketCtx.closePath();
                rocketCtx.fill();

                rocketCtx.beginPath();
                rocketCtx.moveTo(x+15, y+5);
                rocketCtx.lineTo(x+30, y+25);
                rocketCtx.lineTo(x+10, y+15);
                rocketCtx.closePath();
                rocketCtx.fill();

                rocketCtx.shadowBlur = 0;
            }

            // ========== ROCKET LOGIC ==========
            rocketStart.addEventListener('click', () => {
                if (gameActive || countdownActive) return;

                rocketBet = parseInt(rocketBetInput.value);
                if (rocketBet < 1 || rocketBet > balance) {
                    alert('Неверная ставка');
                    return;
                }

                if (!deductStars(rocketBet)) return;

                // Генерация краша (40% на 4-10x)
                let r = Math.random();
                if (r < 0.4) {
                    crashPoint = 4 + Math.random() * 6;
                } else {
                    crashPoint = 1 + Math.random() * 3;
                }
                crashPoint = parseFloat(crashPoint.toFixed(2));
                visualCrashPoint = crashPoint;

                // Сброс авто-цели
                autoTarget = null;
                autoTriggered = false;
                autoButtons.forEach(btn => btn.classList.remove('active'));

                // Обратный отсчёт
                countdownActive = true;
                countdownOverlay.classList.add('active');
                let count = 3;
                countdownNumber.textContent = count;

                let countInterval = setInterval(() => {
                    count--;
                    countdownNumber.textContent = count;
                    if (count === 0) {
                        clearInterval(countInterval);
                        countdownOverlay.classList.remove('active');
                        countdownActive = false;

                        gameActive = true;
                        vibration = 0;
                        rocketStart.disabled = true;
                        currentMultiplier = 1.0;
                        rocketMultiplier.textContent = '1.00x';
                        drawRocket(1.0, 0);

                        const startTime = Date.now();

                        rocketInterval = setInterval(() => {
                            if (!gameActive) return;

                            const elapsed = (Date.now() - startTime) / 1000;
                            currentMultiplier = 1 + 0.9 * elapsed;
                            rocketMultiplier.textContent = currentMultiplier.toFixed(2) + 'x';

                            // Вибрация растёт с множителем
                            vibration = currentMultiplier * 1.5;
                            drawRocket(currentMultiplier, vibration);

                            // Проверка авто-кэшаута
                            if (autoTarget && !autoTriggered && currentMultiplier >= autoTarget) {
                                autoTriggered = true;
                                // Забираем выигрыш автоматически
                                clearInterval(rocketInterval);
                                gameActive = false;
                                rocketStart.disabled = false;

                                const win = Math.floor(rocketBet * autoTarget);
                                balance += win;

                                crashHistory.unshift(autoTarget);
                                if (crashHistory.length > 10) crashHistory.pop();
                                if (autoTarget > maxCrash) maxCrash = autoTarget;

                                lastCrashSpan.textContent = autoTarget.toFixed(2) + 'x';
                                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                updateBalance();
                                addHistory('Ракета', `x${autoTarget.toFixed(2)} +${win} ⭐`, 'win');

                                // Ракета продолжает лететь визуально до crashPoint
                                let visualInterval = setInterval(() => {
                                    visualCrashPoint += 0.05;
                                    drawRocket(currentMultiplier, vibration);
                                    if (visualCrashPoint >= crashPoint) {
                                        clearInterval(visualInterval);
                                    }
                                }, 30);
                            }

                            // Проверка краша
                            if (currentMultiplier >= crashPoint && !autoTriggered) {
                                clearInterval(rocketInterval);
                                gameActive = false;
                                rocketStart.disabled = false;

                                crashHistory.unshift(crashPoint);
                                if (crashHistory.length > 10) crashHistory.pop();
                                if (crashPoint > maxCrash) maxCrash = crashPoint;

                                lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                addHistory('Ракета', `crash -${rocketBet} ⭐`, 'lose');
                            }
                        }, 30);
                    }
                }, 1000);
            });

            // Кнопки авто-кэшаута
            autoButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameActive || countdownActive) return; // только до старта
                    autoButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    autoTarget = parseFloat(btn.dataset.target);
                });
            });

            // ========== PLINKO ==========
            function drawPlinkoBoard() {
                plinkoCtx.clearRect(0, 0, 380, 500);
                const rows = 8;
                const startY = 40;
                const stepY = 45;
                const startX = 190;

                // Колышки (синие)
                plinkoCtx.fillStyle = '#3b82f6';
                plinkoCtx.shadowColor = '#3b82f6';
                plinkoCtx.shadowBlur = 10;
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col <= row; col++) {
                        let x = startX - (row * 20) + col * 40;
                        let y = startY + row * stepY;
                        plinkoCtx.beginPath();
                        plinkoCtx.arc(x, y, 6, 0, Math.PI*2);
                        plinkoCtx.fill();
                    }
                }

                // Ячейки (без цвета, просто контур)
                const cellY = startY + rows * stepY + 30;
                for (let i = 0; i < 9; i++) {
                    let x = startX - (rows * 20) + i * 40;
                    plinkoCtx.strokeStyle = '#2a2f3a';
                    plinkoCtx.lineWidth = 2;
                    plinkoCtx.strokeRect(x-18, cellY-10, 36, 30);
                    plinkoCtx.fillStyle = '#8892a6';
                    plinkoCtx.font = 'bold 12px Inter';
                    plinkoCtx.fillText(plinkoMultipliers[i].toFixed(1)+'x', x-12, cellY+10);
                }
                plinkoCtx.shadowBlur = 0;
            }

            // Заполнить строку множителей (просто текст)
            function fillMultiplierRow() {
                multiplierRow.innerHTML = '';
                plinkoMultipliers.forEach(m => {
                    let cell = document.createElement('div');
                    cell.className = 'multiplier-cell';
                    cell.textContent = m.toFixed(1) + 'x';
                    multiplierRow.appendChild(cell);
                });
            }

            // Анимация падения с белым шаром
            function animatePlinko() {
                if (plinkoAnimation) clearInterval(plinkoAnimation);
                const rows = 8;
                const startY = 40;
                const stepY = 45;
                const startX = 190;
                let ball = { x: 190, y: 30, vx: 0, vy: 1, row: 0 };
                let lastCollision = 0;

                plinkoAnimation = setInterval(() => {
                    // Гравитация
                    ball.vy += 0.4;
                    ball.y += ball.vy;
                    ball.x += ball.vx;
                    ball.vx *= 0.98;

                    // Проверка коллизий
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c <= r; c++) {
                            let pegX = startX - (r * 20) + c * 40;
                            let pegY = startY + r * stepY;
                            let dx = ball.x - pegX;
                            let dy = ball.y - pegY;
                            let dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 12 && Date.now() - lastCollision > 200) {
                                let angle = Math.atan2(dy, dx);
                                ball.vx = Math.cos(angle) * 4;
                                ball.vy = -Math.abs(Math.sin(angle) * 3);
                                ball.vx += (Math.random() - 0.5) * 2;
                                lastCollision = Date.now();
                                break;
                            }
                        }
                    }

                    // Границы
                    if (ball.x < 40) { ball.x = 40; ball.vx *= -0.5; }
                    if (ball.x > 340) { ball.x = 340; ball.vx *= -0.5; }

                    // Отрисовка
                    drawPlinkoBoard();

                    // Белый шар с градиентом
                    let grad = plinkoCtx.createRadialGradient(ball.x-3, ball.y-3, 3, ball.x, ball.y, 15);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.8, '#aaccff');
                    plinkoCtx.fillStyle = grad;
                    plinkoCtx.shadowColor = '#3b82f6';
                    plinkoCtx.shadowBlur = 20;
                    plinkoCtx.beginPath();
                    plinkoCtx.arc(ball.x, ball.y, 10, 0, Math.PI*2);
                    plinkoCtx.fill();

                    // Финиш
                    if (ball.y > 470) {
                        clearInterval(plinkoAnimation);
                        let col = Math.floor((ball.x - (startX - (rows*20))) / 40);
                        col = Math.max(0, Math.min(8, col));
                        let mult = plinkoMultipliers[col];
                        let bet = parseInt(plinkoBetInput.value);
                        let win = Math.floor(bet * mult);
                        balance += win;
                        updateBalance();
                        plinkoResult.textContent = mult >= 1 ? `Выигрыш: ${win} ⭐` : `Проигрыш: ${win} ⭐`;
                        addHistory('Plinko', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
                    }
                }, 25);
            }

            plinkoDrop.addEventListener('click', () => {
                let bet = parseInt(plinkoBetInput.value);
                if (bet < 1 || bet > balance) {
                    alert('Неверная ставка');
                    return;
                }
                if (!deductStars(bet)) return;
                animatePlinko();
            });

            // ========== ИСТОРИЯ (5 последних) ==========
            function addHistory(game, text, type) {
                let items = historyList.children;
                if (items.length >= 5) {
                    historyList.removeChild(items[items.length-1]);
                }
                let item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
            }

            // ========== UI ==========
            rocketBetInput.addEventListener('input', () => {
                rocketBetAmount.textContent = rocketBetInput.value;
            });

            document.getElementById('dailyBonus').addEventListener('click', () => {
                addStars(1000);
            });

            // Переключение табов
            tabRocket.addEventListener('click', () => {
                tabRocket.classList.add('active');
                tabPlinko.classList.remove('active');
                rocketGame.classList.remove('hidden');
                plinkoGame.classList.add('hidden');
            });

            tabPlinko.addEventListener('click', () => {
                tabPlinko.classList.add('active');
                tabRocket.classList.remove('active');
                rocketGame.classList.add('hidden');
                plinkoGame.classList.remove('hidden');
            });

            // ========== INIT ==========
            function init() {
                updateBalance();
                drawRocket(1.0, 0);
                drawPlinkoBoard();
                fillMultiplierRow();
                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                rocketBetAmount.textContent = rocketBetInput.value;

                // Пример истории (5 записей)
                addHistory('Ракета', 'x4.56 +456 ⭐', 'win');
                addHistory('Plinko', 'x0.5 -5 ⭐', 'lose');
                addHistory('Ракета', 'x7.23 +723 ⭐', 'win');
                addHistory('Ракета', 'crash -50 ⭐', 'lose');
                addHistory('Plinko', 'x3.0 +300 ⭐', 'win');
            }

            init();
        })();
    </script>
</body>
</html>
