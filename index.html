<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEBULA • PREMIUM CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== МИНИМАЛИСТИЧНЫЙ ПРЕМИУМ ДИЗАЙН ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B0E14;
            --bg-secondary: #141820;
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Минималистичный градиентный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========== МИНИМАЛИСТИЧНАЯ ШАПКА ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            backdrop-filter: blur(10px);
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .balance i {
            color: var(--accent-primary);
            font-size: 20px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* ========== МИНИМАЛИСТИЧНЫЕ ТАБЫ ========== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 100px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab.active {
            background: var(--accent-primary);
            color: white;
        }

        /* ========== ИГРОВОЙ КОНТЕЙНЕР ========== */
        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 24px;
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        /* ========== ROCKET - КИНЕМАТОГРАФИЧЕСКИЙ ЭФФЕКТ ========== */
        .rocket-stage {
            position: relative;
            background: linear-gradient(180deg, #0A0C12 0%, #000000 100%);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        #rocketCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        /* Бесконечный космос для звезд */
        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
        }

        .multiplier-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 800;
            color: var(--accent-primary);
            text-shadow: 0 0 30px var(--accent-primary);
            background: rgba(0, 0, 0, 0.3);
            padding: 30px 60px;
            border-radius: 100px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--accent-primary);
            z-index: 10;
            letter-spacing: 2px;
        }

        .crash-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .crash-stat {
            text-align: center;
        }

        .crash-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .crash-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        /* ========== PLINKO - РЕАЛИСТИЧНАЯ ФИЗИКА ========== */
        .plinko-stage {
            background: linear-gradient(180deg, #0A0C12 0%, #000000 100%);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        #plinkoCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        .risk-selector {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
        }

        .risk-option {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 100px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .risk-option.low.active {
            background: #10B981;
            color: white;
        }

        .risk-option.medium.active {
            background: #F59E0B;
            color: white;
        }

        .risk-option.high.active {
            background: #EF4444;
            color: white;
        }

        .multiplier-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            margin: 20px 0;
        }

        .multiplier-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: 0.2s;
        }

        .multiplier-cell.highlight {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ========== МИНИМАЛИСТИЧНАЯ ПАНЕЛЬ СТАВОК ========== */
        .bet-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .bet-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bet-input {
            flex: 2;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent-primary);
        }

        .bet-multipliers {
            flex: 1;
            display: flex;
            gap: 6px;
        }

        .mult-btn {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .mult-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .game-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .game-btn.primary {
            background: var(--accent-primary);
            color: white;
        }

        .game-btn.primary:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .game-btn.success {
            background: #10B981;
            color: white;
        }

        .game-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== ИСТОРИЯ ========== */
        .history-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-win {
            color: #10B981;
        }

        .history-lose {
            color: #EF4444;
        }

        .hidden {
            display: none !important;
        }

        /* Анимации */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-sparkle"></i>
                <span id="balance">10,000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="dailyBonus">
                    <i class="fas fa-gift"></i>
                </button>
                <button class="icon-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab active" id="tabRocket">Rocket</button>
            <button class="tab" id="tabPlinko">Plinko</button>
        </div>

        <!-- ROCKET GAME -->
        <div id="rocketGame" class="game-container">
            <div class="rocket-stage">
                <div class="stars-layer" id="starsLayer"></div>
                <canvas id="rocketCanvas" width="800" height="400"></canvas>
                <div class="multiplier-display" id="rocketMultiplier">1.00x</div>
            </div>

            <div class="crash-info">
                <div class="crash-stat">
                    <div class="crash-label">Last Crash</div>
                    <div class="crash-value" id="lastCrash">2.45x</div>
                </div>
                <div class="crash-stat">
                    <div class="crash-label">Max Crash</div>
                    <div class="crash-value" id="maxCrash">12.5x</div>
                </div>
                <div class="crash-stat">
                    <div class="crash-label">Next</div>
                    <div class="crash-value" id="nextCrash">3.2x</div>
                </div>
            </div>

            <div class="bet-panel">
                <div class="bet-header">
                    <span>Bet Amount</span>
                    <span id="rocketBetAmount">10 ⭐</span>
                </div>

                <div class="bet-input-wrapper">
                    <input type="number" id="rocketBet" class="bet-input" min="1" max="10000" value="10">
                    <div class="bet-multipliers">
                        <button class="mult-btn" data-mult="2">2x</button>
                        <button class="mult-btn" data-mult="5">5x</button>
                        <button class="mult-btn" data-mult="10">10x</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="game-btn primary" id="rocketStart">
                        <i class="fas fa-play"></i> Launch
                    </button>
                    <button class="game-btn success" id="rocketCashout" disabled>
                        <i class="fas fa-hand-holding-usd"></i> Cash Out
                    </button>
                </div>
            </div>
        </div>

        <!-- PLINKO GAME -->
        <div id="plinkoGame" class="game-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="800" height="600"></canvas>
            </div>

            <div class="risk-selector">
                <button class="risk-option low active" data-risk="low">Low Risk</button>
                <button class="risk-option medium" data-risk="medium">Medium Risk</button>
                <button class="risk-option high" data-risk="high">High Risk</button>
            </div>

            <div class="multiplier-grid" id="multiplierGrid"></div>

            <div class="bet-panel">
                <div class="bet-header">
                    <span>Bet Amount</span>
                    <span id="plinkoBetAmount">10 ⭐</span>
                </div>

                <div class="bet-input-wrapper">
                    <input type="number" id="plinkoBet" class="bet-input" min="1" max="10000" value="10">
                    <div class="bet-multipliers">
                        <button class="mult-btn" data-mult="2">2x</button>
                        <button class="mult-btn" data-mult="5">5x</button>
                        <button class="mult-btn" data-mult="10">10x</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="game-btn primary" id="plinkoDrop">
                        <i class="fas fa-arrow-down"></i> Drop Ball
                    </button>
                </div>

                <div class="multiplier-display" style="position: relative; transform: none; left: auto; margin-top: 20px; font-size: 36px;" id="plinkoResult">
                    ⚡ Place Your Bet
                </div>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="history-section">
            <div class="history-title">
                <i class="fas fa-clock"></i>
                <span>Recent Games</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            // Telegram Integration
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
            let balance = 10000;
            let gameActive = false;
            let rocketInterval = null;
            let starsInterval = null;
            let crashPoint = 2.0;
            let currentMultiplier = 1.0;
            let rocketBet = 10;
            let vibration = 0;
            
            // История крашей
            let crashHistory = [2.45, 1.87, 3.21, 5.67, 1.23, 4.56];
            let maxCrash = 12.5;

            // Plinko переменные
            let plinkoRisk = 'low';
            const plinkoMultipliers = {
                low: [0.5, 0.7, 1, 1.2, 1.5, 1.2, 1, 0.7, 0.5],
                medium: [0.3, 0.5, 1, 2, 3, 2, 1, 0.5, 0.3],
                high: [0.1, 0.2, 0.5, 3, 8, 3, 0.5, 0.2, 0.1]
            };
            let currentMultipliers = plinkoMultipliers.low;
            let plinkoAnimation = null;

            // ========== DOM ЭЛЕМЕНТЫ ==========
            const balanceSpan = document.getElementById('balance');
            const tabRocket = document.getElementById('tabRocket');
            const tabPlinko = document.getElementById('tabPlinko');
            const rocketGame = document.getElementById('rocketGame');
            const plinkoGame = document.getElementById('plinkoGame');
            
            // Rocket элементы
            const rocketCanvas = document.getElementById('rocketCanvas');
            const rocketCtx = rocketCanvas.getContext('2d');
            const rocketMultiplier = document.getElementById('rocketMultiplier');
            const lastCrashSpan = document.getElementById('lastCrash');
            const maxCrashSpan = document.getElementById('maxCrash');
            const nextCrashSpan = document.getElementById('nextCrash');
            const rocketBetInput = document.getElementById('rocketBet');
            const rocketBetAmount = document.getElementById('rocketBetAmount');
            const rocketStart = document.getElementById('rocketStart');
            const rocketCashout = document.getElementById('rocketCashout');
            const starsLayer = document.getElementById('starsLayer');

            // Plinko элементы
            const plinkoCanvas = document.getElementById('plinkoCanvas');
            const plinkoCtx = plinkoCanvas.getContext('2d');
            const multiplierGrid = document.getElementById('multiplierGrid');
            const plinkoBetInput = document.getElementById('plinkoBet');
            const plinkoBetAmount = document.getElementById('plinkoBetAmount');
            const plinkoDrop = document.getElementById('plinkoDrop');
            const plinkoResult = document.getElementById('plinkoResult');
            const riskBtns = document.querySelectorAll('.risk-option');

            // ========== ФУНКЦИИ БАЛАНСА ==========
            function updateBalance() {
                balanceSpan.textContent = balance.toLocaleString();
            }

            function addStars(amount) {
                balance += amount;
                updateBalance();
                addHistory('Bonus', `+${amount} ⭐`, 'win');
                createParticles('win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            // ========== ROCKET - КИНЕМАТОГРАФИЧЕСКАЯ ФИЗИКА ==========
            function createStars() {
                starsLayer.innerHTML = '';
                for (let i = 0; i < 50; i++) {
                    let star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = Math.random() * 3 + 1 + 'px';
                    star.style.height = star.style.width;
                    star.style.opacity = Math.random() * 0.8 + 0.2;
                    starsLayer.appendChild(star);
                }
            }

            function animateStars(speed) {
                let stars = document.querySelectorAll('.star');
                stars.forEach(star => {
                    let top = parseFloat(star.style.top);
                    top += speed * 0.5;
                    if (top > 100) {
                        top = -5;
                        star.style.left = Math.random() * 100 + '%';
                    }
                    star.style.top = top + '%';
                });
            }

            function drawRocket(mult, vib) {
                rocketCtx.clearRect(0, 0, 800, 400);
                
                // Горизонт
                rocketCtx.fillStyle = '#0A0C12';
                rocketCtx.fillRect(0, 200, 800, 200);
                
                // Эффект свечения от ракеты
                let gradient = rocketCtx.createRadialGradient(400 + vib * 5, 300 - mult * 30, 20, 
                                                             400 + vib * 5, 300 - mult * 30, 100);
                gradient.addColorStop(0, 'rgba(99, 102, 241, 0.8)');
                gradient.addColorStop(1, 'transparent');
                rocketCtx.fillStyle = gradient;
                rocketCtx.fillRect(200, 100, 400, 200);
                
                // Ракета (минималистичный дизайн)
                rocketCtx.save();
                rocketCtx.translate(400 + vib * 3, 300 - mult * 30);
                
                // Корпус
                rocketCtx.fillStyle = '#FFFFFF';
                rocketCtx.shadowColor = '#6366F1';
                rocketCtx.shadowBlur = 30;
                rocketCtx.beginPath();
                rocketCtx.moveTo(-20, -30);
                rocketCtx.lineTo(20, -30);
                rocketCtx.lineTo(30, 0);
                rocketCtx.lineTo(20, 30);
                rocketCtx.lineTo(-20, 30);
                rocketCtx.lineTo(-30, 0);
                rocketCtx.closePath();
                rocketCtx.fill();
                
                // Иллюминатор
                rocketCtx.shadowBlur = 20;
                rocketCtx.fillStyle = '#6366F1';
                rocketCtx.beginPath();
                rocketCtx.arc(0, 0, 8, 0, Math.PI * 2);
                rocketCtx.fill();
                
                // Пламя (пульсирует)
                let flameSize = 15 + Math.sin(Date.now() * 0.02) * 5;
                rocketCtx.shadowColor = '#F59E0B';
                rocketCtx.fillStyle = '#F59E0B';
                rocketCtx.beginPath();
                rocketCtx.moveTo(-10, 35);
                rocketCtx.lineTo(0, 35 + flameSize);
                rocketCtx.lineTo(10, 35);
                rocketCtx.fill();
                
                rocketCtx.restore();
                
                // Линия графика
                rocketCtx.beginPath();
                rocketCtx.strokeStyle = '#6366F1';
                rocketCtx.lineWidth = 2;
                rocketCtx.shadowColor = '#6366F1';
                rocketCtx.shadowBlur = 10;
                rocketCtx.moveTo(100, 300);
                
                for (let x = 100; x <= 700; x += 10) {
                    let t = (x - 100) / 600;
                    let y = 300 - Math.min(t * crashPoint * 50, 250);
                    rocketCtx.lineTo(x, y);
                }
                rocketCtx.stroke();
            }

            // Обновление информации о крашах
            function updateCrashInfo() {
                lastCrashSpan.textContent = crashHistory[0]?.toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                let next = (1 + Math.random() * 9).toFixed(2);
                nextCrashSpan.textContent = next + 'x';
            }

            // ========== ROCKET ЛОГИКА ==========
            rocketStart.addEventListener('click', () => {
                if (gameActive) return;
                
                rocketBet = parseInt(rocketBetInput.value);
                if (rocketBet < 1 || rocketBet > balance) {
                    alert('Invalid bet amount');
                    return;
                }
                
                if (!deductStars(rocketBet)) return;
                
                // Генерация точки краша
                let r = Math.random();
                crashPoint = 0.99 / (1 - r);
                crashPoint = Math.min(10, Math.max(1, parseFloat(crashPoint.toFixed(2))));
                
                gameActive = true;
                vibration = 0;
                rocketStart.disabled = true;
                rocketCashout.disabled = false;
                currentMultiplier = 1.0;
                rocketMultiplier.textContent = '1.00x';
                
                createStars();
                let startTime = Date.now();
                
                // Интервал анимации ракеты
                rocketInterval = setInterval(() => {
                    if (!gameActive) return;
                    
                    let elapsed = (Date.now() - startTime) / 1000;
                    currentMultiplier = 1 + 0.8 * elapsed;
                    rocketMultiplier.textContent = currentMultiplier.toFixed(2) + 'x';
                    
                    // Увеличиваем вибрацию и скорость звезд
                    vibration = Math.min(5, elapsed * 2);
                    animateStars(elapsed * 2);
                    
                    drawRocket(currentMultiplier, vibration);
                    
                    if (currentMultiplier >= crashPoint) {
                        clearInterval(rocketInterval);
                        gameActive = false;
                        rocketStart.disabled = false;
                        rocketCashout.disabled = true;
                        
                        crashHistory.unshift(crashPoint);
                        if (crashHistory.length > 10) crashHistory.pop();
                        if (crashPoint > maxCrash) maxCrash = crashPoint;
                        
                        updateCrashInfo();
                        addHistory('Rocket', `Crash -${rocketBet} ⭐`, 'lose');
                        createParticles('crash');
                    }
                }, 30);
            });

            rocketCashout.addEventListener('click', () => {
                if (!gameActive) return;
                
                clearInterval(rocketInterval);
                gameActive = false;
                rocketStart.disabled = false;
                rocketCashout.disabled = true;
                
                let win = Math.floor(rocketBet * currentMultiplier);
                balance += win;
                
                crashHistory.unshift(currentMultiplier);
                if (crashHistory.length > 10) crashHistory.pop();
                if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;
                
                updateCrashInfo();
                updateBalance();
                addHistory('Rocket', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
                createParticles('win');
            });

            // ========== PLINKO - РЕАЛИСТИЧНАЯ ФИЗИКА ==========
            function drawPlinkoBoard() {
                plinkoCtx.clearRect(0, 0, 800, 600);
                
                const rows = 8;
                const startY = 80;
                const stepY = 55;
                const startX = 400;
                
                // Рисуем колышки
                plinkoCtx.fillStyle = '#94A3B8';
                plinkoCtx.shadowColor = '#6366F1';
                plinkoCtx.shadowBlur = 10;
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col <= row; col++) {
                        let x = startX - (row * 30) + col * 60;
                        let y = startY + row * stepY;
                        
                        plinkoCtx.beginPath();
                        plinkoCtx.arc(x, y, 6, 0, Math.PI * 2);
                        plinkoCtx.fill();
                    }
                }
                
                // Рисуем ячейки
                const cellY = startY + rows * stepY + 30;
                
                for (let i = 0; i < 9; i++) {
                    let x = startX - (rows * 30) + i * 60;
                    
                    // Контур ячейки
                    plinkoCtx.strokeStyle = currentMultipliers[i] >= 1 ? '#10B981' : '#EF4444';
                    plinkoCtx.lineWidth = 2;
                    plinkoCtx.strokeRect(x - 25, cellY - 15, 50, 40);
                    
                    // Текст
                    plinkoCtx.fillStyle = currentMultipliers[i] >= 1 ? '#10B981' : '#EF4444';
                    plinkoCtx.font = 'bold 14px Inter';
                    plinkoCtx.fillText(currentMultipliers[i] + 'x', x - 15, cellY + 10);
                }
            }

            // Физика падения с гравитацией и отскоками
            function animatePlinkoWithPhysics(targetPos, multiplier, win) {
                if (plinkoAnimation) clearInterval(plinkoAnimation);
                
                const rows = 8;
                const startY = 80;
                const stepY = 55;
                const startX = 400;
                
                let ball = {
                    x: 400,
                    y: 50,
                    vx: 0,
                    vy: 2,
                    row: 0,
                    col: 4,
                    bouncing: false
                };
                
                let path = [];
                let physicsInterval = setInterval(() => {
                    // Гравитация
                    ball.vy += 0.5;
                    ball.y += ball.vy;
                    
                    // Проверка столкновения с колышками
                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col <= row; col++) {
                            let pegX = startX - (row * 30) + col * 60;
                            let pegY = startY + row * stepY;
                            
                            let dx = ball.x - pegX;
                            let dy = ball.y - pegY;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < 15 && !ball.bouncing) {
                                // Отскок с случайным отклонением
                                ball.vy = -Math.abs(ball.vy) * 0.5;
                                ball.vx = (Math.random() - 0.5) * 8;
                                ball.bouncing = true;
                                
                                setTimeout(() => { ball.bouncing = false; }, 200);
                                
                                // Определяем направление для следующего ряда
                                if (row < rows - 1) {
                                    ball.row = row + 1;
                                    ball.col = col + (ball.vx > 0 ? 1 : 0);
                                    ball.col = Math.max(0, Math.min(8, ball.col));
                                }
                                break;
                            }
                        }
                    }
                    
                    // Обновление позиции
                    ball.x += ball.vx;
                    
                    // Границы
                    if (ball.x < 50) { ball.x = 50; ball.vx *= -0.5; }
                    if (ball.x > 750) { ball.x = 750; ball.vx *= -0.5; }
                    
                    // Отрисовка
                    drawPlinkoBoard();
                    
                    // Рисуем шарик
                    plinkoCtx.shadowColor = '#F59E0B';
                    plinkoCtx.shadowBlur = 20;
                    plinkoCtx.beginPath();
                    plinkoCtx.arc(ball.x, ball.y, 12, 0, Math.PI * 2);
                    
                    let gradient = plinkoCtx.createRadialGradient(ball.x-3, ball.y-3, 3, ball.x, ball.y, 15);
                    gradient.addColorStop(0, '#F59E0B');
                    gradient.addColorStop(1, '#EF4444');
                    plinkoCtx.fillStyle = gradient;
                    plinkoCtx.fill();
                    
                    // Проверка достижения дна
                    if (ball.y > 550) {
                        clearInterval(physicsInterval);
                        
                        let finalCol = Math.floor((ball.x - (startX - (rows * 30))) / 60);
                        finalCol = Math.max(0, Math.min(8, finalCol));
                        
                        let resultMultiplier = currentMultipliers[finalCol];
                        let resultWin = Math.floor(rocketBet * resultMultiplier);
                        
                        balance += resultWin;
                        updateBalance();
                        
                        plinkoResult.textContent = resultMultiplier >= 1 
                            ? `🎉 +${resultWin} ⭐ (${resultMultiplier}x)`
                            : `😔 ${resultWin} ⭐ (${resultMultiplier}x)`;
                        
                        addHistory('Plinko', `x${resultMultiplier} ${resultWin >= rocketBet ? '+' : ''}${resultWin - rocketBet} ⭐`, 
                                 resultMultiplier >= 1 ? 'win' : 'lose');
                        
                        if (resultMultiplier >= 3) createParticles('win');
                    }
                }, 20);
                
                plinkoAnimation = physicsInterval;
            }

            // Обновление сетки множителей
            function updateMultiplierGrid() {
                multiplierGrid.innerHTML = '';
                currentMultipliers.forEach((mult, index) => {
                    let cell = document.createElement('div');
                    cell.className = 'multiplier-cell';
                    cell.textContent = mult + 'x';
                    cell.style.color = mult >= 1 ? '#10B981' : '#EF4444';
                    multiplierGrid.appendChild(cell);
                });
            }

            // Выбор риска
            riskBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    riskBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    plinkoRisk = btn.dataset.risk;
                    currentMultipliers = plinkoMultipliers[plinkoRisk];
                    updateMultiplierGrid();
                    drawPlinkoBoard();
                });
            });

            // Бросок шарика
            plinkoDrop.addEventListener('click', () => {
                let bet = parseInt(plinkoBetInput.value);
                
                if (bet < 1 || bet > balance) {
                    alert('Invalid bet amount');
                    return;
                }
                
                if (!deductStars(bet)) return;
                rocketBet = bet;
                
                // Генерация случайной позиции (физика сама определит путь)
                animatePlinkoWithPhysics(null, null, null);
            });

            // ========== СИСТЕМА ЧАСТИЦ ДЛЯ ЭФФЕКТОВ ==========
            function createParticles(type) {
                for (let i = 0; i < 30; i++) {
                    let particle = document.createElement('div');
                    particle.style.position = 'fixed';
                    particle.style.left = '50%';
                    particle.style.top = '50%';
                    particle.style.width = '6px';
                    particle.style.height = '6px';
                    particle.style.background = type === 'win' ? '#10B981' : '#EF4444';
                    particle.style.borderRadius = '50%';
                    particle.style.pointerEvents = 'none';
                    particle.style.zIndex = '9999';
                    particle.style.transform = 'translate(-50%, -50%)';
                    
                    let angle = (i / 30) * Math.PI * 2;
                    let velocity = 5 + Math.random() * 5;
                    let vx = Math.cos(angle) * velocity;
                    let vy = Math.sin(angle) * velocity;
                    
                    document.body.appendChild(particle);
                    
                    let posX = window.innerWidth / 2;
                    let posY = window.innerHeight / 2;
                    
                    function animate() {
                        posX += vx;
                        posY += vy;
                        vy += 0.2;
                        
                        particle.style.left = posX + 'px';
                        particle.style.top = posY + 'px';
                        particle.style.opacity = parseFloat(particle.style.opacity || 1) - 0.01;
                        
                        if (parseFloat(particle.style.opacity) > 0) {
                            requestAnimationFrame(animate);
                        } else {
                            particle.remove();
                        }
                    }
                    
                    requestAnimationFrame(animate);
                }
            }

            // ========== ИСТОРИЯ ==========
            function addHistory(game, text, type) {
                let list = document.getElementById('historyList');
                let item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span>${game}</span>
                    <span class="history-${type}">${text}</span>
                `;
                list.prepend(item);
                if (list.children.length > 15) {
                    list.removeChild(list.lastElementChild);
                }
            }

            // ========== БЫСТРЫЕ СТАВКИ ==========
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let mult = parseInt(btn.dataset.mult);
                    let input = btn.closest('.bet-input-wrapper').querySelector('.bet-input');
                    let newVal = parseInt(input.value) * mult;
                    newVal = Math.min(10000, Math.max(1, newVal));
                    input.value = newVal;
                    input.dispatchEvent(new Event('input'));
                });
            });

            // Обновление отображения ставок
            rocketBetInput.addEventListener('input', () => {
                rocketBetAmount.textContent = rocketBetInput.value + ' ⭐';
            });

            plinkoBetInput.addEventListener('input', () => {
                plinkoBetAmount.textContent = plinkoBetInput.value + ' ⭐';
            });

            // ========== ПЕРЕКЛЮЧЕНИЕ ТАБОВ ==========
            tabRocket.addEventListener('click', () => {
                tabRocket.classList.add('active');
                tabPlinko.classList.remove('active');
                rocketGame.classList.remove('hidden');
                plinkoGame.classList.add('hidden');
            });

            tabPlinko.addEventListener('click', () => {
                tabPlinko.classList.add('active');
                tabRocket.classList.remove('active');
                rocketGame.classList.add('hidden');
                plinkoGame.classList.remove('hidden');
            });

            // ========== ЕЖЕДНЕВНЫЙ БОНУС ==========
            document.getElementById('dailyBonus').addEventListener('click', () => {
                addStars(1000);
            });

            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            function init() {
                updateBalance();
                createStars();
                drawRocket(1.0, 0);
                drawPlinkoBoard();
                updateMultiplierGrid();
                updateCrashInfo();
                
                // Добавляем примеры истории
                addHistory('Rocket', 'x2.45 +245 ⭐', 'win');
                addHistory('Plinko', 'x0.3 -7 ⭐', 'lose');
                addHistory('Rocket', 'x5.67 +567 ⭐', 'win');
                addHistory('Bonus', '+1000 ⭐', 'win');
            }

            init();
        })();
    </script>
