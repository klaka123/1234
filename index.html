<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAR ROCKET • PLINKO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== ГЛОБАЛЬНЫЙ СТИЛЬ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0c12;
            --bg-surface: #12161f;
            --bg-elevated: #1e2430;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #9aa4b8;
            --border-light: #2a313e;
            --border-glow: #3b82f6;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 24px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            padding: 10px 22px;
            border-radius: 60px;
            border: 1px solid var(--border-light);
        }

        .balance i {
            color: var(--accent-blue);
            font-size: 18px;
        }

        .balance span {
            font-weight: 700;
            font-size: 22px;
        }

        .daily-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .daily-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* ========== ТАБЫ ========== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            padding: 4px;
            background: var(--bg-elevated);
            border-radius: 60px;
            border: 1px solid var(--border-light);
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ========== ROCKET ========== */
        .rocket-container {
            background: var(--bg-elevated);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        .stage {
            position: relative;
            background: #000000; /* Чёрное небо */
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--border-light);
            height: 280px;
        }

        #rocketCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            position: relative;
            z-index: 5;
        }

        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        .multiplier-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            font-size: 32px;
            font-weight: 800;
            z-index: 10;
            letter-spacing: 1px;
        }

        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }

        .countdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .countdown-number {
            font-size: 90px;
            font-weight: 900;
            color: var(--accent-blue);
            text-shadow: 0 0 40px var(--accent-blue);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Инфо-панель */
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 16px 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 18px;
        }

        /* Панель ставок */
        .bet-panel {
            background: var(--bg-surface);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border-light);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .bet-input {
            width: 100%;
            padding: 16px;
            background: var(--bg-elevated);
            border: 2px solid var(--border-light);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn.primary {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .action-btn.primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .action-btn.success {
            background: #10b981;
            color: white;
        }

        .action-btn.success:hover {
            background: #059669;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== PLINKO ========== */
        .plinko-container {
            background: var(--bg-elevated);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        .plinko-stage {
            background: #000000;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--border-light);
        }

        #plinkoCanvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        .multiplier-row {
            display: flex;
            justify-content: space-around;
            margin: 16px 0 20px;
            gap: 4px;
        }

        .multiplier-cell {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-surface);
            padding: 12px 0;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        .plinko-result {
            margin-top: 20px;
            padding: 18px;
            background: var(--bg-surface);
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--accent-blue);
            border: 2px solid var(--border-light);
        }

        /* ========== ИСТОРИЯ ========== */
        .history-section {
            background: var(--bg-elevated);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid var(--border-light);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-radius: 24px;
            font-size: 14px;
            border: 1px solid var(--border-light);
        }

        .history-win { color: #3b82f6; }
        .history-lose { color: #ef4444; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <!-- ШАПКА -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <button class="daily-btn" id="dailyBonus">
                <i class="fas fa-gift"></i>
            </button>
        </header>

        <!-- ТАБЫ -->
        <div class="tabs">
            <button class="tab active" id="tabRocket">ROCKET</button>
            <button class="tab" id="tabPlinko">PLINKO</button>
        </div>

        <!-- ROCKET GAME -->
        <div id="rocketGame" class="rocket-container">
            <div class="stage">
                <div class="stars-layer" id="starsLayer"></div>
                <div class="countdown-overlay" id="countdownOverlay">
                    <div class="countdown-number" id="countdownNumber">3</div>
                </div>
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier-display" id="rocketMultiplier">1.00x</div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="info-label">LAST</div>
                    <div class="info-value" id="lastCrash">2.45x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">MAX</div>
                    <div class="info-value" id="maxCrash">12.5x</div>
                </div>
                <div class="info-item">
                    <div class="info-label">BET</div>
                    <div class="info-value" id="rocketBetAmount">10</div>
                </div>
            </div>

            <div class="bet-panel">
                <div class="bet-header">
                    <span>YOUR BET</span>
                </div>
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn primary" id="rocketStart">
                        <i class="fas fa-rocket"></i> СТАРТ
                    </button>
                    <button class="action-btn success" id="rocketStop" disabled>
                        <i class="fas fa-stop"></i> СТОП
                    </button>
                </div>
            </div>
        </div>

        <!-- PLINKO GAME -->
        <div id="plinkoGame" class="plinko-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="500"></canvas>
            </div>

            <!-- Один ряд множителей -->
            <div class="multiplier-row" id="multiplierRow"></div>

            <div class="bet-panel">
                <div class="bet-header">
                    <span>YOUR BET</span>
                </div>
                <input type="number" id="plinkoBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="plinkoDrop">
                    <i class="fas fa-arrow-down"></i> БРОСИТЬ
                </button>
                <div class="plinko-result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- ИСТОРИЯ (5 ПОСЛЕДНИХ) -->
        <div class="history-section">
            <div class="history-title">
                <i class="fas fa-history"></i>
                <span>RECENT 5 GAMES</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            // ========== ИНИЦИАЛИЗАЦИЯ TELEGRAM ==========
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
            let balance = 10000;               // текущий баланс
            let gameActive = false;             // активна ли игра в ракете
            let countdownActive = false;        // идёт ли обратный отсчёт
            let rocketInterval = null;           // интервал анимации ракеты
            let starsInterval = null;            // интервал движения звёзд
            let crashPoint = 2.0;                // реальная точка краша
            let visualCrashPoint = 2.0;           // для визуального продолжения
            let currentMultiplier = 1.0;          // текущий множитель
            let rocketBet = 10;                    // текущая ставка
            let vibration = 0;                      // сила тряски (0-...)
            let stars = [];                          // массив звёзд

            // История крашей
            let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];
            let maxCrash = 12.5;

            // Plinko
            let plinkoAnimation = null;
            const plinkoMultipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];

            // ========== DOM ЭЛЕМЕНТЫ ==========
            const balanceSpan = document.getElementById('balance');
            const tabRocket = document.getElementById('tabRocket');
            const tabPlinko = document.getElementById('tabPlinko');
            const rocketGame = document.getElementById('rocketGame');
            const plinkoGame = document.getElementById('plinkoGame');
            const rocketCanvas = document.getElementById('rocketCanvas');
            const rocketCtx = rocketCanvas.getContext('2d');
            const plinkoCanvas = document.getElementById('plinkoCanvas');
            const plinkoCtx = plinkoCanvas.getContext('2d');
            const rocketMultiplier = document.getElementById('rocketMultiplier');
            const lastCrashSpan = document.getElementById('lastCrash');
            const maxCrashSpan = document.getElementById('maxCrash');
            const rocketBetAmount = document.getElementById('rocketBetAmount');
            const rocketBetInput = document.getElementById('rocketBet');
            const rocketStart = document.getElementById('rocketStart');
            const rocketStop = document.getElementById('rocketStop');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const starsLayer = document.getElementById('starsLayer');
            const multiplierRow = document.getElementById('multiplierRow');
            const plinkoBetInput = document.getElementById('plinkoBet');
            const plinkoDrop = document.getElementById('plinkoDrop');
            const plinkoResult = document.getElementById('plinkoResult');
            const historyList = document.getElementById('historyList');

            // ========== ФУНКЦИИ УПРАВЛЕНИЯ БАЛАНСОМ ==========
            function updateBalance() {
                balanceSpan.textContent = balance.toLocaleString().replace(',', ' ');
            }

            function addStarsBalance(amount) {
                balance += amount;
                updateBalance();
                addHistory('BONUS', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            // ========== СОЗДАНИЕ ЗВЁЗД (МНОГО) ==========
            function createStars(count = 150) {
                starsLayer.innerHTML = '';
                stars = [];
                for (let i = 0; i < count; i++) {
                    let star = document.createElement('div');
                    star.className = 'star';
                    let size = Math.random() * 3 + 1;
                    let left = Math.random() * 100;
                    let top = Math.random() * 100;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = left + '%';
                    star.style.top = top + '%';
                    star.style.opacity = Math.random() * 0.8 + 0.2;
                    starsLayer.appendChild(star);
                    stars.push({ element: star, top: top, speed: 0 }); // speed будет меняться
                }
            }

            // Движение звёзд вниз (с ускорением)
            function moveStars(speedFactor) {
                let baseSpeed = 0.05; // базовая скорость
                let speed = baseSpeed * speedFactor;
                stars.forEach(star => {
                    let top = parseFloat(star.element.style.top);
                    top += speed;
                    if (top > 100) {
                        top = -5;
                        star.element.style.left = Math.random() * 100 + '%';
                    }
                    star.element.style.top = top + '%';
                });
            }

            // ========== ОТРИСОВКА РАКЕТЫ (СТИЛЬ BOXSTARX) ==========
            function drawRocket(mult, vib) {
                rocketCtx.clearRect(0, 0, 380, 280);

                // Чёрный фон уже есть, но канвас прозрачный — звёзды отдельно

                // Позиция ракеты: поднимается вверх с множителем
                const baseY = 210 - (mult - 1) * 25; // старт Y = 210
                // Тряска: смещение по X и Y на основе vib и синуса
                const shakeX = Math.sin(Date.now() * 0.02) * vib * 2;
                const shakeY = Math.cos(Date.now() * 0.03) * vib * 1.5;
                const x = 180 + shakeX;
                const y = baseY + shakeY;

                // ---- РИСУЕМ РАКЕТУ (ДЕТАЛЬНО) ----
                // Тень
                rocketCtx.shadowColor = '#3b82f6';
                rocketCtx.shadowBlur = 20 + vib * 2;

                // Корпус (основной) — белый градиент
                let grad = rocketCtx.createLinearGradient(x-20, y-20, x+20, y+20);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, '#e0e7ff');
                rocketCtx.fillStyle = grad;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-18, y-18);
                rocketCtx.lineTo(x+18, y-22);
                rocketCtx.lineTo(x+22, y+12);
                rocketCtx.lineTo(x-15, y+18);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Нос (красный)
                rocketCtx.fillStyle = '#ef4444';
                rocketCtx.shadowColor = '#ef4444';
                rocketCtx.beginPath();
                rocketCtx.moveTo(x+18, y-22);
                rocketCtx.lineTo(x+38, y-8);
                rocketCtx.lineTo(x+22, y+12);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Иллюминатор (синий ободок, белый внутри)
                rocketCtx.shadowColor = '#3b82f6';
                rocketCtx.fillStyle = '#3b82f6';
                rocketCtx.beginPath();
                rocketCtx.arc(x-2, y-6, 10, 0, Math.PI*2);
                rocketCtx.fill();
                rocketCtx.fillStyle = '#ffffff';
                rocketCtx.shadowBlur = 15;
                rocketCtx.beginPath();
                rocketCtx.arc(x-4, y-8, 4, 0, Math.PI*2);
                rocketCtx.fill();

                // Крылья (синие)
                rocketCtx.fillStyle = '#2563eb';
                rocketCtx.shadowColor = '#2563eb';
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-18, y+5);
                rocketCtx.lineTo(x-35, y+25);
                rocketCtx.lineTo(x-12, y+15);
                rocketCtx.closePath();
                rocketCtx.fill();

                rocketCtx.beginPath();
                rocketCtx.moveTo(x+12, y+5);
                rocketCtx.lineTo(x+30, y+25);
                rocketCtx.lineTo(x+8, y+15);
                rocketCtx.closePath();
                rocketCtx.fill();

                // Пламя (оранжевое, пульсирует)
                let flameSize = 18 + Math.sin(Date.now() * 0.02) * 6;
                rocketCtx.fillStyle = '#f97316';
                rocketCtx.shadowColor = '#f97316';
                rocketCtx.shadowBlur = 25;
                rocketCtx.beginPath();
                rocketCtx.moveTo(x-8, y+20);
                rocketCtx.lineTo(x, y+30 + flameSize);
                rocketCtx.lineTo(x+8, y+20);
                rocketCtx.fill();

                rocketCtx.shadowBlur = 0;
            }

            // ========== ЛОГИКА ROCKET ==========
            rocketStart.addEventListener('click', () => {
                if (gameActive || countdownActive) return;

                rocketBet = parseInt(rocketBetInput.value);
                if (rocketBet < 1 || rocketBet > balance) {
                    alert('Invalid bet amount');
                    return;
                }

                if (!deductStars(rocketBet)) return;

                // Генерация точки краша (с повышенными шансами на 4-10x)
                let r = Math.random();
                if (r < 0.4) {
                    crashPoint = 4 + Math.random() * 6;
                } else {
                    crashPoint = 1 + Math.random() * 3;
                }
                crashPoint = parseFloat(crashPoint.toFixed(2));
                visualCrashPoint = crashPoint;

                // Обратный отсчёт
                countdownActive = true;
                countdownOverlay.classList.add('active');
                let count = 3;
                countdownNumber.textContent = count;

                let countInterval = setInterval(() => {
                    count--;
                    countdownNumber.textContent = count;
                    if (count === 0) {
                        clearInterval(countInterval);
                        countdownOverlay.classList.remove('active');
                        countdownActive = false;

                        // Запуск игры
                        gameActive = true;
                        vibration = 0;
                        rocketStart.disabled = true;
                        rocketStop.disabled = false;
                        currentMultiplier = 1.0;
                        rocketMultiplier.textContent = '1.00x';

                        // Создаём много звёзд
                        createStars(200);
                        const startTime = Date.now();

                        rocketInterval = setInterval(() => {
                            if (!gameActive) return;

                            const elapsed = (Date.now() - startTime) / 1000;
                            currentMultiplier = 1 + 0.9 * elapsed;
                            rocketMultiplier.textContent = currentMultiplier.toFixed(2) + 'x';

                            // Тряска усиливается с множителем
                            vibration = currentMultiplier * 1.8;
                            // Движение звёзд: скорость зависит от множителя
                            moveStars(currentMultiplier * 1.5);

                            drawRocket(currentMultiplier, vibration);

                            // Проверка краша
                            if (currentMultiplier >= crashPoint) {
                                clearInterval(rocketInterval);
                                gameActive = false;
                                rocketStart.disabled = false;
                                rocketStop.disabled = true;

                                crashHistory.unshift(crashPoint);
                                if (crashHistory.length > 10) crashHistory.pop();
                                if (crashPoint > maxCrash) maxCrash = crashPoint;

                                lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                addHistory('ROCKET', `CRASH -${rocketBet} ⭐`, 'lose');
                            }
                        }, 30);
                    }
                }, 1000);
            });

            rocketStop.addEventListener('click', () => {
                if (!gameActive) return;

                clearInterval(rocketInterval);
                gameActive = false;
                rocketStart.disabled = false;
                rocketStop.disabled = true;

                const win = Math.floor(rocketBet * currentMultiplier);
                balance += win;

                crashHistory.unshift(currentMultiplier);
                if (crashHistory.length > 10) crashHistory.pop();
                if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;

                lastCrashSpan.textContent = currentMultiplier.toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                updateBalance();
                addHistory('ROCKET', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');

                // Ракета продолжает лететь визуально до crashPoint
                let visualInterval = setInterval(() => {
                    visualCrashPoint += 0.05;
                    drawRocket(currentMultiplier, vibration);
                    if (visualCrashPoint >= crashPoint) {
                        clearInterval(visualInterval);
                    }
                }, 30);
            });

            // ========== PLINKO ==========
            function drawPlinkoBoard() {
                plinkoCtx.clearRect(0, 0, 380, 500);
                const rows = 8;
                const startY = 40;
                const stepY = 48;
                const startX = 190;

                // Колышки (синие)
                plinkoCtx.fillStyle = '#3b82f6';
                plinkoCtx.shadowColor = '#3b82f6';
                plinkoCtx.shadowBlur = 10;
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col <= row; col++) {
                        let x = startX - (row * 20) + col * 40;
                        let y = startY + row * stepY;
                        plinkoCtx.beginPath();
                        plinkoCtx.arc(x, y, 6, 0, Math.PI*2);
                        plinkoCtx.fill();
                    }
                }

                // Ячейки внизу (только текст, без цвета)
                const cellY = startY + rows * stepY + 30;
                for (let i = 0; i < 9; i++) {
                    let x = startX - (rows * 20) + i * 40;
                    plinkoCtx.strokeStyle = '#2a313e';
                    plinkoCtx.lineWidth = 2;
                    plinkoCtx.strokeRect(x-16, cellY-8, 32, 28);
                    plinkoCtx.fillStyle = '#9aa4b8';
                    plinkoCtx.font = 'bold 12px Inter';
                    plinkoCtx.fillText(plinkoMultipliers[i].toFixed(1)+'x', x-12, cellY+10);
                }
                plinkoCtx.shadowBlur = 0;
            }

            function fillMultiplierRow() {
                multiplierRow.innerHTML = '';
                plinkoMultipliers.forEach(m => {
                    let cell = document.createElement('div');
                    cell.className = 'multiplier-cell';
                    cell.textContent = m.toFixed(1) + 'x';
                    multiplierRow.appendChild(cell);
                });
            }

            // Анимация падения с белым шаром (жемчужный)
            function animatePlinko() {
                if (plinkoAnimation) clearInterval(plinkoAnimation);
                const rows = 8;
                const startY = 40;
                const stepY = 48;
                const startX = 190;
                let ball = { x: 190, y: 20, vx: 0, vy: 1, row: 0 };
                let lastCollision = 0;

                plinkoAnimation = setInterval(() => {
                    // Гравитация
                    ball.vy += 0.4;
                    ball.y += ball.vy;
                    ball.x += ball.vx;
                    ball.vx *= 0.98;

                    // Столкновения с колышками
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c <= r; c++) {
                            let pegX = startX - (r * 20) + c * 40;
                            let pegY = startY + r * stepY;
                            let dx = ball.x - pegX;
                            let dy = ball.y - pegY;
                            let dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 12 && Date.now() - lastCollision > 200) {
                                let angle = Math.atan2(dy, dx);
                                ball.vx = Math.cos(angle) * 4;
                                ball.vy = -Math.abs(Math.sin(angle) * 3);
                                ball.vx += (Math.random() - 0.5) * 2;
                                lastCollision = Date.now();
                                break;
                            }
                        }
                    }

                    // Границы
                    if (ball.x < 30) { ball.x = 30; ball.vx *= -0.5; }
                    if (ball.x > 350) { ball.x = 350; ball.vx *= -0.5; }

                    // Отрисовка
                    drawPlinkoBoard();

                    // Белый жемчужный шар
                    let grad = plinkoCtx.createRadialGradient(ball.x-4, ball.y-4, 4, ball.x, ball.y, 15);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.8, '#cbd5e1');
                    plinkoCtx.fillStyle = grad;
                    plinkoCtx.shadowColor = '#3b82f6';
                    plinkoCtx.shadowBlur = 20;
                    plinkoCtx.beginPath();
                    plinkoCtx.arc(ball.x, ball.y, 10, 0, Math.PI*2);
                    plinkoCtx.fill();

                    // Проверка достижения ячеек
                    if (ball.y > 470) {
                        clearInterval(plinkoAnimation);
                        let col = Math.floor((ball.x - (startX - (rows*20))) / 40);
                        col = Math.max(0, Math.min(8, col));
                        let mult = plinkoMultipliers[col];
                        let bet = parseInt(plinkoBetInput.value);
                        let win = Math.floor(bet * mult);
                        balance += win;
                        updateBalance();
                        plinkoResult.textContent = mult >= 1 ? `WIN ${win} ⭐` : `LOSE ${win} ⭐`;
                        addHistory('PLINKO', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
                    }
                }, 25);
            }

            plinkoDrop.addEventListener('click', () => {
                let bet = parseInt(plinkoBetInput.value);
                if (bet < 1 || bet > balance) {
                    alert('Invalid bet');
                    return;
                }
                if (!deductStars(bet)) return;
                animatePlinko();
            });

            // ========== ИСТОРИЯ (5 ПОСЛЕДНИХ) ==========
            function addHistory(game, text, type) {
                if (historyList.children.length >= 5) {
                    historyList.removeChild(historyList.lastElementChild);
                }
                let item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
            }

            // ========== ПЕРЕКЛЮЧЕНИЕ ТАБОВ ==========
            tabRocket.addEventListener('click', () => {
                tabRocket.classList.add('active');
                tabPlinko.classList.remove('active');
                rocketGame.classList.remove('hidden');
                plinkoGame.classList.add('hidden');
            });

            tabPlinko.addEventListener('click', () => {
                tabPlinko.classList.add('active');
                tabRocket.classList.remove('active');
                rocketGame.classList.add('hidden');
                plinkoGame.classList.remove('hidden');
            });

            // ========== БЫСТРЫЕ ДЕЙСТВИЯ ==========
            rocketBetInput.addEventListener('input', () => {
                rocketBetAmount.textContent = rocketBetInput.value;
            });

            document.getElementById('dailyBonus').addEventListener('click', () => {
                addStarsBalance(1000);
            });

            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            function init() {
                updateBalance();
                createStars(200);
                drawRocket(1.0, 0);
                drawPlinkoBoard();
                fillMultiplierRow();

                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                rocketBetAmount.textContent = rocketBetInput.value;

                // Добавляем примеры истории (5 шт)
                addHistory('ROCKET', 'x4.56 +456 ⭐', 'win');
                addHistory('PLINKO', 'x0.5 -5 ⭐', 'lose');
                addHistory('ROCKET', 'x7.23 +723 ⭐', 'win');
                addHistory('ROCKET', 'CRASH -50 ⭐', 'lose');
                addHistory('PLINKO', 'x3.0 +300 ⭐', 'win');
            }

            init();
        })();
    </script>
</body>
</html>
