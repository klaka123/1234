<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ PREMIUM CASINO ✦</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== МИНИМАЛИЗМ ПРЕМИУМ-КЛАССА ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0c12;
            --bg-surface: #12161f;
            --bg-elevated: #1e2430;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-light: #2a313e;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            margin: 0;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg-surface);
            border-radius: 48px;
            padding: 24px;
            border: 1px solid var(--border-light);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid var(--border-light);
        }

        .balance i {
            color: var(--accent-blue);
            font-size: 20px;
        }

        .balance span {
            font-weight: 700;
            font-size: 24px;
            background: linear-gradient(135deg, #fff, #cbd5e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* ========== ТАБЫ (ПЕРЕКЛЮЧЕНИЕ РАБОТАЕТ) ========== */
        .tabs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 6px;
            background: var(--bg-elevated);
            border-radius: 60px;
            border: 1px solid var(--border-light);
            overflow-x: auto;
        }

        .tabs-row::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 0 0 auto;
            padding: 12px 16px;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ========== КОНТЕЙНЕРЫ ИГР ========== */
        .game-container {
            background: var(--bg-elevated);
            border-radius: 36px;
            padding: 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 24px;
            display: block; /* по умолчанию показываем первый */
        }

        .hidden {
            display: none !important;
        }

        /* ========== ROCKET ========== */
        .rocket-stage {
            position: relative;
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            height: 280px;
            border: 2px solid var(--border-light);
        }

        #rocketCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            box-shadow: 0 0 6px white;
        }

        .multiplier-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid var(--accent-blue);
            color: var(--accent-blue);
            font-size: 32px;
            font-weight: 800;
            z-index: 10;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            background: var(--bg-surface);
            border-radius: 40px;
            padding: 18px 20px;
            border: 1px solid var(--border-light);
            margin: 20px 0;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .info-value {
            font-weight: 800;
            color: var(--accent-blue);
            font-size: 20px;
        }

        .bet-panel {
            background: var(--bg-surface);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border-light);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
        }

        .bet-input {
            width: 100%;
            padding: 18px;
            background: var(--bg-elevated);
            border: 2px solid var(--border-light);
            border-radius: 40px;
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .action-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== PLINKO ========== */
        .plinko-stage {
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            height: 500px;
            border: 2px solid var(--border-light);
        }

        #plinkoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .plinko-result {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-surface);
            border-radius: 50px;
            text-align: center;
            font-weight: 800;
            font-size: 28px;
            color: var(--accent-blue);
            border: 2px solid var(--border-light);
        }

        /* ========== SLOTS ========== */
        .slots-machine {
            background: #000;
            border-radius: 40px;
            padding: 30px 20px;
            margin-bottom: 20px;
            border: 2px solid var(--border-light);
        }

        .reels {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: var(--bg-elevated);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 3px solid var(--accent-blue);
        }

        .slots-multiplier {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin: 20px 0;
            color: var(--accent-blue);
        }

        /* ========== WHEEL ========== */
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: var(--accent-blue);
        }

        .wheel-result {
            text-align: center;
            font-size: 28px;
            margin: 20px 0;
            font-weight: 800;
        }

        /* ========== MINES ========== */
        .mines-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mines-select {
            flex: 1;
            background: var(--bg-elevated);
            border: 2px solid var(--border-light);
            border-radius: 40px;
            padding: 12px;
            color: white;
            font-weight: 700;
            text-align: center;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .mines-cell {
            aspect-ratio: 1;
            background: var(--bg-elevated);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
        }

        .mines-cell.revealed-star {
            background: #1e3a8a;
            border-color: var(--success);
            color: var(--success);
        }

        .mines-cell.revealed-mine {
            background: #7f1d1d;
            border-color: var(--danger);
            color: var(--danger);
        }

        .mines-info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 20px;
            font-weight: 700;
        }

        .mines-multiplier {
            color: var(--accent-blue);
        }

        /* ========== ИСТОРИЯ ========== */
        .history-section {
            background: var(--bg-elevated);
            border-radius: 32px;
            padding: 18px;
            border: 1px solid var(--border-light);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--bg-surface);
            border-radius: 30px;
            font-size: 15px;
            border: 1px solid var(--border-light);
        }

        .history-win { color: var(--accent-blue); font-weight: 700; }
        .history-lose { color: var(--danger); font-weight: 700; }

        /* ========== МЕНЮ РЕФЕРАЛОВ ========== */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .menu-overlay.active {
            display: flex;
        }

        .menu-content {
            background: var(--bg-surface);
            border-radius: 48px;
            padding: 30px;
            max-width: 360px;
            width: 90%;
            border: 2px solid var(--accent-blue);
        }

        .ref-link {
            background: var(--bg-elevated);
            padding: 12px;
            border-radius: 30px;
            font-family: monospace;
            word-break: break-all;
            margin: 10px 0;
        }

        .close-menu {
            width: 100%;
            padding: 16px;
            background: var(--accent-blue);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ШАПКА -->
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="dailyBonus">
                    <i class="fas fa-gift"></i>
                </button>
                <button class="icon-btn" id="menuBtn">
                    <i class="fas fa-ellipsis-h"></i>
                </button>
            </div>
        </header>

        <!-- МЕНЮ РЕФЕРАЛОВ -->
        <div class="menu-overlay" id="menuOverlay">
            <div class="menu-content">
                <h3 style="color: var(--accent-blue); margin-bottom: 20px;">🤝 Партнёрская программа</h3>
                <p>Ваша ссылка:</p>
                <div class="ref-link" id="refLink">Загрузка...</div>
                <p>Приглашено: <span id="refCount">0</span> (бонус: <span id="refBonus">0</span> ⭐)</p>
                <button class="close-menu" id="closeMenu">Закрыть</button>
            </div>
        </div>

        <!-- ТАБЫ (ПЕРЕКЛЮЧАЮТСЯ!) -->
        <div class="tabs-row">
            <button class="tab active" data-game="rocket">🚀 ROCKET</button>
            <button class="tab" data-game="plinko">🔴 PLINKO</button>
            <button class="tab" data-game="slots">🎰 SLOTS</button>
            <button class="tab" data-game="wheel">🎡 WHEEL</button>
            <button class="tab" data-game="mines">💣 MINES</button>
        </div>

        <!-- ROCKET (с эмодзи 🚀) -->
        <div id="rocketGame" class="game-container">
            <div class="rocket-stage">
                <div class="stars-layer" id="starsLayer"></div>
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier-display" id="rocketMultiplier">1.00x</div>
            </div>
            <div class="info-panel">
                <div class="info-item"><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
                <div class="info-item"><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
                <div class="info-item"><div class="info-label">BET</div><div class="info-value" id="rocketBetAmount">10</div></div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn primary" id="rocketStart"><i class="fas fa-rocket"></i> СТАРТ</button>
                    <button class="action-btn success" id="rocketStop" disabled><i class="fas fa-stop"></i> СТОП</button>
                </div>
            </div>
        </div>

        <!-- PLINKO -->
        <div id="plinkoGame" class="game-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="500"></canvas>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="plinkoBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="plinkoDrop"><i class="fas fa-arrow-down"></i> БРОСИТЬ</button>
                <div class="plinko-result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- SLOTS -->
        <div id="slotsGame" class="game-container hidden">
            <div class="slots-machine">
                <div class="reels">
                    <div class="reel" id="slot1">🍒</div>
                    <div class="reel" id="slot2">🍒</div>
                    <div class="reel" id="slot3">🍒</div>
                </div>
                <div class="slots-multiplier" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="slotsBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="slotsSpin"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- WHEEL -->
        <div id="wheelGame" class="game-container hidden">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="250" height="250"></canvas>
                <div class="wheel-pointer">▼</div>
            </div>
            <div class="wheel-result" id="wheelResult">—</div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="wheelBet" class="bet-input" min="1" value="10">
                <button class="action-btn primary" id="wheelSpin"><i class="fas fa-play"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- MINES -->
        <div id="minesGame" class="game-container hidden">
            <div class="mines-header">
                <select id="minesCount" class="mines-select">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="action-btn success" id="minesNewGame">НОВАЯ</button>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
            <div class="mines-info">
                <span>Множитель: <span id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span></span>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="minesBet" class="bet-input" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn primary" id="minesStart">СТАВКА</button>
                    <button class="action-btn success" id="minesCashout" disabled>ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- ИСТОРИЯ -->
        <div class="history-section">
            <div class="history-title"><i class="fas fa-history"></i> ПОСЛЕДНИЕ 5 ИГР</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            // Telegram
            const tg = window.Telegram.WebApp;
            tg.expand();

            const userId = tg.initDataUnsafe?.user?.id?.toString() || 'guest';
            const storageKey = `casino_${userId}`;

            let data = JSON.parse(localStorage.getItem(storageKey)) || {
                balance: 10000,
                referrals: [],
                usedPromos: []
            };

            function saveData() {
                localStorage.setItem(storageKey, JSON.stringify(data));
            }

            function updateBalance() {
                document.getElementById('balance').textContent = data.balance.toLocaleString();
            }

            function addStars(amount) {
                data.balance += amount;
                saveData();
                updateBalance();
            }

            function deductStars(amount) {
                if (data.balance >= amount) {
                    data.balance -= amount;
                    saveData();
                    updateBalance();
                    return true;
                }
                return false;
            }

            // ========== РЕФЕРАЛЫ ==========
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('ref_')) {
                const referrerId = startParam.replace('ref_', '');
                if (!localStorage.getItem(`referred_${userId}`) && referrerId !== userId) {
                    let refData = JSON.parse(localStorage.getItem(`ref_${referrerId}`) || '{"count":0}');
                    refData.count++;
                    localStorage.setItem(`ref_${referrerId}`, JSON.stringify(refData));
                    localStorage.setItem(`referred_${userId}`, 'true');
                }
            }

            function getReferralCount() {
                const refData = JSON.parse(localStorage.getItem(`ref_${userId}`) || '{"count":0}');
                return refData.count;
            }

            function updateReferralDisplay() {
                const botName = tg.initDataUnsafe?.user?.username || 'your_bot';
                document.getElementById('refLink').textContent = `t.me/${botName}?start=ref_${userId}`;
                const count = getReferralCount();
                document.getElementById('refCount').textContent = count;
                document.getElementById('refBonus').textContent = count * 10;
            }

            // ========== ПЕРЕКЛЮЧЕНИЕ ТАБОВ (ИСПРАВЛЕНО) ==========
            const tabs = document.querySelectorAll('.tab');
            const games = {
                rocket: document.getElementById('rocketGame'),
                plinko: document.getElementById('plinkoGame'),
                slots: document.getElementById('slotsGame'),
                wheel: document.getElementById('wheelGame'),
                mines: document.getElementById('minesGame')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Убираем active у всех
                    tabs.forEach(t => t.classList.remove('active'));
                    // Добавляем active текущему
                    tab.classList.add('active');
                    
                    // Скрываем все игры
                    Object.values(games).forEach(game => game.classList.add('hidden'));
                    
                    // Показываем нужную
                    const gameId = tab.dataset.game;
                    if (games[gameId]) {
                        games[gameId].classList.remove('hidden');
                    }
                });
            });

            // ========== ИСТОРИЯ ==========
            const historyList = document.getElementById('historyList');

            function addHistory(game, text, type) {
                if (historyList.children.length >= 5) {
                    historyList.removeChild(historyList.lastElementChild);
                }
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
            }

            // ========== ROCKET (ТОЛЬКО ЭМОДЗИ) ==========
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const starsLayer = document.getElementById('starsLayer');
                const multiplierEl = document.getElementById('rocketMultiplier');
                const lastCrashSpan = document.getElementById('lastCrash');
                const maxCrashSpan = document.getElementById('maxCrash');
                const rocketBetInput = document.getElementById('rocketBet');
                const rocketBetAmount = document.getElementById('rocketBetAmount');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false;
                let countdownActive = false;
                let rocketInterval = null;
                let crashPoint = 2.0;
                let currentMultiplier = 1.0;
                let rocketBet = 10;
                let stars = [];
                let starSpeed = 0.1;
                let maxCrash = 12.5;
                let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];

                function createStars(count = 150) {
                    starsLayer.innerHTML = '';
                    stars = [];
                    for (let i = 0; i < count; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        star.style.width = Math.random() * 3 + 1 + 'px';
                        star.style.height = star.style.width;
                        star.style.left = Math.random() * 100 + '%';
                        star.style.top = Math.random() * 100 + '%';
                        starsLayer.appendChild(star);
                        stars.push({ element: star, top: parseFloat(star.style.top) });
                    }
                }

                function moveStars(speed) {
                    stars.forEach(s => {
                        let top = s.top + speed;
                        if (top > 100) {
                            top = -5;
                            s.element.style.left = Math.random() * 100 + '%';
                        }
                        s.element.style.top = top + '%';
                        s.top = top;
                    });
                }

                function drawRocket(mult) {
                    ctx.clearRect(0, 0, 380, 280);
                    
                    // Рисуем эмодзи 🚀 носом вверх
                    ctx.save();
                    ctx.translate(190, 210 - (mult - 1) * 20);
                    ctx.rotate(-Math.PI / 2); // поворот на 90° против часовой
                    ctx.font = '70px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 20 + mult * 2;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('🚀', 0, 0);
                    ctx.restore();
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive || countdownActive) return;
                    rocketBet = parseInt(rocketBetInput.value);
                    if (rocketBet < 1 || rocketBet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(rocketBet)) return;

                    const r = Math.random();
                    crashPoint = 0.99 / (1 - r);
                    crashPoint = Math.min(10, Math.max(1, parseFloat(crashPoint.toFixed(2))));

                    countdownActive = true;
                    multiplierEl.innerHTML = '<span style="color:#3b82f6;">3</span>';
                    let count = 3;
                    const ci = setInterval(() => {
                        count--;
                        if (count > 0) {
                            multiplierEl.innerHTML = `<span style="color:#3b82f6;">${count}</span>`;
                        } else {
                            clearInterval(ci);
                            countdownActive = false;
                            multiplierEl.textContent = '1.00x';
                            gameActive = true;
                            startBtn.disabled = true;
                            stopBtn.disabled = false;
                            currentMultiplier = 1.0;
                            createStars(150);
                            const startTime = Date.now();

                            rocketInterval = setInterval(() => {
                                if (!gameActive) return;
                                const elapsed = (Date.now() - startTime) / 1000;
                                currentMultiplier = 1 + 0.9 * elapsed;
                                multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                                starSpeed = 0.1 + currentMultiplier * 0.5;
                                moveStars(starSpeed);
                                drawRocket(currentMultiplier);

                                if (currentMultiplier >= crashPoint) {
                                    clearInterval(rocketInterval);
                                    gameActive = false;
                                    startBtn.disabled = false;
                                    stopBtn.disabled = true;
                                    crashHistory.unshift(crashPoint);
                                    if (crashHistory.length > 10) crashHistory.pop();
                                    if (crashPoint > maxCrash) maxCrash = crashPoint;
                                    lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                    addHistory('ROCKET', `CRASH -${rocketBet} ⭐`, 'lose');
                                }
                            }, 30);
                        }
                    }, 800);
                });

                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(rocketInterval);
                    gameActive = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const win = Math.floor(rocketBet * currentMultiplier);
                    data.balance += win;
                    saveData();
                    updateBalance();
                    crashHistory.unshift(currentMultiplier);
                    if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;
                    lastCrashSpan.textContent = currentMultiplier.toFixed(2) + 'x';
                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                    addHistory('ROCKET', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
                });

                rocketBetInput.addEventListener('input', () => {
                    rocketBetAmount.textContent = rocketBetInput.value;
                });

                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                createStars(150);
                drawRocket(1);
            })();

            // ========== PLINKO ==========
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const resultDiv = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');

                const rows = 8;
                const startY = 40;
                const stepY = 48;
                const startX = 190;
                const multipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];

                function drawBoard() {
                    ctx.clearRect(0, 0, 380, 500);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c <= r; c++) {
                            let x = startX - (r * 20) + c * 40;
                            let y = startY + r * stepY;
                            ctx.fillStyle = '#3b82f6';
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, 2*Math.PI);
                            ctx.fill();
                        }
                    }
                    const cellY = startY + rows * stepY + 30;
                    for (let i = 0; i < 9; i++) {
                        let x = startX - (rows * 20) + i * 40;
                        ctx.strokeStyle = '#2a313e';
                        ctx.strokeRect(x-16, cellY-10, 32, 28);
                        ctx.fillStyle = '#a0aec0';
                        ctx.font = 'bold 12px Inter';
                        ctx.fillText(multipliers[i].toFixed(1)+'x', x-10, cellY+10);
                    }
                }

                let anim = null;
                function dropBall(bet) {
                    if (anim) clearInterval(anim);
                    let ball = { x: 190, y: 20, vx: 0, vy: 1 };
                    let lastCollision = 0;
                    anim = setInterval(() => {
                        ball.vy += 0.4;
                        ball.y += ball.vy;
                        ball.x += ball.vx;
                        ball.vx *= 0.98;

                        for (let r = 0; r < rows; r++) {
                            for (let c = 0; c <= r; c++) {
                                let pegX = startX - (r * 20) + c * 40;
                                let pegY = startY + r * stepY;
                                let dx = ball.x - pegX, dy = ball.y - pegY;
                                let dist = Math.sqrt(dx*dx + dy*dy);
                                if (dist < 12 && Date.now() - lastCollision > 200) {
                                    let angle = Math.atan2(dy, dx);
                                    ball.vx = Math.cos(angle) * 4;
                                    ball.vy = -Math.abs(Math.sin(angle) * 3);
                                    ball.vx += (Math.random() - 0.5) * 2;
                                    lastCollision = Date.now();
                                    break;
                                }
                            }
                        }
                        if (ball.x < 30) { ball.x = 30; ball.vx *= -0.5; }
                        if (ball.x > 350) { ball.x = 350; ball.vx *= -0.5; }

                        drawBoard();

                        ctx.shadowColor = '#3b82f6';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(ball.x, ball.y, 10, 0, 2*Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();

                        if (ball.y > 470) {
                            clearInterval(anim);
                            const startXGrid = startX - (rows * 20);
                            const col = Math.floor((ball.x - startXGrid) / 40);
                            const clamped = Math.max(0, Math.min(8, col));
                            const mult = multipliers[clamped];
                            const win = Math.floor(bet * mult);
                            data.balance += win;
                            saveData();
                            updateBalance();
                            resultDiv.textContent = mult >= 1 ? `🏆 WIN ${win} ⭐` : `💥 LOSE ${win} ⭐`;
                            addHistory('PLINKO', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1?'win':'lose');
                        }
                    }, 25);
                }

                dropBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    dropBall(bet);
                });

                drawBoard();
            })();

            // ========== SLOTS ==========
            (function slots() {
                const slot1 = document.getElementById('slot1');
                const slot2 = document.getElementById('slot2');
                const slot3 = document.getElementById('slot3');
                const multiplierSpan = document.getElementById('slotsMultiplier');
                const spinBtn = document.getElementById('slotsSpin');
                const betInput = document.getElementById('slotsBet');

                const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '⭐'];
                const weights = [40, 30, 15, 8, 5, 2];

                function weightedRandom() {
                    const total = weights.reduce((a,b) => a+b, 0);
                    let rand = Math.random() * total;
                    let i = 0;
                    while (rand > weights[i]) {
                        rand -= weights[i];
                        i++;
                    }
                    return i;
                }

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    const r1 = weightedRandom();
                    const r2 = weightedRandom();
                    const r3 = weightedRandom();

                    slot1.textContent = symbols[r1];
                    slot2.textContent = symbols[r2];
                    slot3.textContent = symbols[r3];

                    let mult = 0;
                    if (r1 === r2 && r2 === r3) {
                        if (r1 === 4) mult = 15;
                        else if (r1 === 5) mult = 20;
                        else if (r1 === 3) mult = 8;
                        else if (r1 === 2) mult = 5;
                        else mult = 3;
                    } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                        mult = 2;
                    }

                    if (mult === 0) {
                        multiplierSpan.textContent = 'x0';
                        addHistory('SLOTS', `LOSE -${bet} ⭐`, 'lose');
                    } else {
                        const win = bet * mult;
                        data.balance += win;
                        saveData();
                        updateBalance();
                        multiplierSpan.textContent = `x${mult}`;
                        addHistory('SLOTS', `x${mult} +${win} ⭐`, 'win');
                    }
                });
            })();

            // ========== WHEEL ==========
            (function wheel() {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const spinBtn = document.getElementById('wheelSpin');
                const betInput = document.getElementById('wheelBet');
                const resultSpan = document.getElementById('wheelResult');

                const sectors = [
                    { label: 'x0', mult: 0, color: '#ef4444', weight: 10 },
                    { label: 'x1', mult: 1, color: '#3b82f6', weight: 15 },
                    { label: 'x2', mult: 2, color: '#10b981', weight: 12 },
                    { label: 'x5', mult: 5, color: '#f59e0b', weight: 8 },
                    { label: 'x10', mult: 10, color: '#8b5cf6', weight: 5 },
                    { label: 'x50', mult: 50, color: '#ec4899', weight: 4 }
                ];
                const totalWeight = sectors.reduce((s, w) => s + w.weight, 0);

                function drawWheel(rotation = 0) {
                    ctx.clearRect(0,0,250,250);
                    const cx = 125, cy = 125, r = 110;
                    let start = rotation;
                    for (let i = 0; i < sectors.length; i++) {
                        const angle = (sectors[i].weight / totalWeight) * 2 * Math.PI;
                        const end = start + angle;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.arc(cx, cy, r, start, end);
                        ctx.closePath();
                        ctx.fillStyle = sectors[i].color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();
                        start = end;
                    }
                }

                let spinning = false;
                spinBtn.addEventListener('click', () => {
                    if (spinning) return;
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    spinning = true;
                    const rand = Math.random() * totalWeight;
                    let cum = 0;
                    let resultIdx = 0;
                    for (let i = 0; i < sectors.length; i++) {
                        cum += sectors[i].weight;
                        if (rand < cum) { resultIdx = i; break; }
                    }

                    setTimeout(() => {
                        spinning = false;
                        const mult = sectors[resultIdx].mult;
                        const win = bet * mult;
                        data.balance += win;
                        saveData();
                        updateBalance();
                        resultSpan.textContent = `${sectors[resultIdx].label} → ${win} ⭐`;
                        addHistory('WHEEL', `${sectors[resultIdx].label} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>0?'win':'lose');
                        drawWheel();
                    }, 2000);

                    let spins = 20;
                    let interval = setInterval(() => {
                        drawWheel(Date.now() * 0.01);
                        spins--;
                        if (spins === 0) clearInterval(interval);
                    }, 50);
                });

                drawWheel();
            })();

            // ========== MINES ==========
            (function mines() {
                const gridDiv = document.getElementById('minesGrid');
                const minesCountSelect = document.getElementById('minesCount');
                const newGameBtn = document.getElementById('minesNewGame');
                const startBtn = document.getElementById('minesStart');
                const cashoutBtn = document.getElementById('minesCashout');
                const betInput = document.getElementById('minesBet');
                const multiplierSpan = document.getElementById('minesMultiplier');
                const winSpan = document.getElementById('minesWin');

                let board = [], revealed = [], gameActive = false, currentBet = 0, minesCount = 3, starsRevealed = 0;

                const multTable = {
                    3: [1.15, 1.35, 1.7, 2.2, 3.0, 6.5, 20, 50, 100],
                    5: [1.2, 1.5, 2.0, 3.0, 5.0, 10, 25, 60, 150],
                    10: [1.3, 2.0, 3.5, 6.0, 12, 25, 60, 150, 400]
                };

                function getMult(mines, rev) {
                    if (rev === 0) return 1.0;
                    const arr = multTable[mines];
                    return arr[Math.min(rev-1, arr.length-1)] || 1.0;
                }

                function renderGrid() {
                    gridDiv.innerHTML = '';
                    for (let i = 0; i < 25; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'mines-cell';
                        cell.dataset.index = i;
                        if (revealed[i]) {
                            cell.classList.add(board[i] ? 'revealed-mine' : 'revealed-star');
                            cell.textContent = board[i] ? '💣' : '⭐';
                        } else cell.textContent = '?';
                        cell.onclick = cellClick;
                        gridDiv.appendChild(cell);
                    }
                }

                function cellClick(e) {
                    if (!gameActive) return;
                    const idx = parseInt(e.target.dataset.index);
                    if (revealed[idx]) return;
                    if (board[idx]) {
                        revealed[idx] = true;
                        renderGrid();
                        gameActive = false;
                        cashoutBtn.disabled = true;
                        addHistory('MINES', `MINE -${currentBet} ⭐`, 'lose');
                        alert('💥 Вы проиграли!');
                    } else {
                        revealed[idx] = true;
                        starsRevealed++;
                        const mult = getMult(minesCount, starsRevealed);
                        multiplierSpan.textContent = mult.toFixed(2) + 'x';
                        winSpan.textContent = Math.floor(currentBet * mult);
                        renderGrid();
                    }
                }

                function newGame() {
                    gameActive = false;
                    cashoutBtn.disabled = true;
                    board = []; revealed = []; starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    renderGrid();
                }

                newGameBtn.onclick = newGame;

                startBtn.onclick = () => {
                    if (gameActive) return;
                    const bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    currentBet = bet;
                    minesCount = parseInt(minesCountSelect.value);
                    board = new Array(25).fill(false);
                    for (let i = 0; i < minesCount; i++) {
                        let pos;
                        do { pos = Math.floor(Math.random() * 25); } while (board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    gameActive = true;
                    cashoutBtn.disabled = false;
                    renderGrid();
                };

                cashoutBtn.onclick = () => {
                    if (!gameActive) return;
                    const mult = getMult(minesCount, starsRevealed);
                    const win = Math.floor(currentBet * mult);
                    data.balance += win;
                    saveData();
                    updateBalance();
                    addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                    gameActive = false;
                    cashoutBtn.disabled = true;
                    renderGrid();
                };

                newGame();
            })();

            // ========== БОНУС ==========
            document.getElementById('dailyBonus').addEventListener('click', () => {
                addStars(1000);
                addHistory('BONUS', '+1000 ⭐', 'win');
            });

            const menuBtn = document.getElementById('menuBtn');
            const menuOverlay = document.getElementById('menuOverlay');
            const closeMenu = document.getElementById('closeMenu');

            menuBtn.addEventListener('click', () => {
                updateReferralDisplay();
                menuOverlay.classList.add('active');
            });

            closeMenu.addEventListener('click', () => {
                menuOverlay.classList.remove('active');
            });

            menuOverlay.addEventListener('click', (e) => {
                if (e.target === menuOverlay) menuOverlay.classList.remove('active');
            });

            updateBalance();
            updateReferralDisplay();
        })();
    </script>
</body>
