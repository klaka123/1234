<!DOCTYPE html>
<html>
<body>
    <h1>Проверка ключа</h1>
    <div id="result"></div>

    <script>
    // ВСТАВЬ СВОЙ НОВЫЙ КЛЮЧ СЮДА
    const API_KEY = "r8_твой_ключ";
    
    async function checkKey() {
        try {
            const response = await fetch("https://api.replicate.com/v1/account", {
                headers: {
                    "Authorization": `Token ${API_KEY}`
                }
            });
            
            if (response.ok) {
                document.getElementById('result').innerHTML = "✅ Ключ РАБОТАЕТ!";
            } else {
                document.getElementById('result').innerHTML = "❌ Ключ НЕ РАБОТАЕТ. Проверь правильность";
            }
        } catch(e) {
            document.getElementById('result').innerHTML = "❌ Ошибка: " + e.message;
        }
    }
    
    checkKey();
    </script>
</body>
</html>
