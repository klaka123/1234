<!DOCTYPE html>
<html>
<head>
    <title>Проверка ключа</title>
</head>
<body>
    <h2>🔑 Проверка API ключа</h2>
    
    <div>
        <label>Вставь ключ сюда:</label>
        <input type="text" id="apiKey" size="50" placeholder="r8_...">
        <button onclick="checkKey()">Проверить</button>
    </div>
    
    <div id="result" style="margin-top: 20px; padding: 10px;"></div>

    <script>
    async function checkKey() {
        const key = document.getElementById('apiKey').value;
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML = "⏳ Проверяю...";
        
        try {
            const response = await fetch("https://api.replicate.com/v1/account", {
                headers: {
                    "Authorization": `Token ${key}`
                }
            });
            
            if (response.ok) {
                const data = await response.json();
                resultDiv.innerHTML = "✅ КЛЮЧ РАБОТАЕТ!<br>" + 
                                     `Аккаунт: ${data.name || 'OK'}`;
            } else {
                const error = await response.text();
                resultDiv.innerHTML = "❌ КЛЮЧ НЕ РАБОТАЕТ<br>" + 
                                     `Ошибка: ${response.status} - ${error}`;
            }
        } catch(e) {
            resultDiv.innerHTML = "❌ ОШИБКА СОЕДИНЕНИЯ<br>" + e.message;
        }
    }
    </script>
</body>
</html>
