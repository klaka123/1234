<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ PREMIUM CASINO ✦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0e14;
            --surface: #151e2a;
            --accent: #3b82f6;
            --accent-glow: rgba(59,130,246,0.4);
            --text: #ffffff;
            --text-dim: #8e9fb1;
            --border: #253241;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border-radius: 48px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px black;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.2);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid var(--border);
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 700;
        }

        .balance i {
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Навигация */
        .nav {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 60px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Игры */
        .game {
            display: none;
        }

        .game.active {
            display: block;
        }

        /* Общие элементы */
        .stage {
            background: #000;
            border-radius: 32px;
            border: 2px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            border-radius: 40px;
            padding: 18px 24px;
            border: 1px solid var(--border);
            margin: 20px 0;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
            color: var(--accent);
            font-size: 22px;
        }

        .bet-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 40px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        .bet-input {
            width: 100%;
            padding: 18px;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--border);
            border-radius: 40px;
            color: white;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ROCKET */
        .rocket-stage {
            height: 280px;
        }

        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 36px;
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
            display: none;
            z-index: 20;
        }

        /* PLINKO */
        .plinko-stage {
            height: 520px;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        /* SLOTS */
        .slots-machine {
            background: #000;
            border-radius: 40px;
            padding: 40px 20px;
            margin-bottom: 20px;
            border: 2px solid var(--border);
        }

        .reels {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .reel {
            width: 90px;
            height: 90px;
            background: #1e2632;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.05s;
        }

        .reel.spinning {
            animation: spin 0.1s infinite;
        }

        @keyframes spin {
            0% { transform: translateY(0); }
            25% { transform: translateY(-8px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(8px); }
            100% { transform: translateY(0); }
        }

        .slots-multiplier {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
            color: var(--accent);
        }

        /* WHEEL */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .wheel-result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        /* MINES */
        .mines-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mines-select {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--border);
            border-radius: 40px;
            padding: 16px;
            color: white;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            background: #1e2632;
            border: 2px solid var(--border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .cell:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .cell.star {
            background: #166534;
            border-color: var(--success);
            color: var(--success);
        }

        .cell.mine {
            background: #991b1b;
            border-color: var(--danger);
            color: var(--danger);
        }

        .mines-info {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 22px;
            font-weight: 700;
        }

        /* История */
        .history {
            margin-top: 28px;
            background: rgba(0,0,0,0.2);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .win { color: var(--accent); }
        .lose { color: var(--danger); }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 48px;
            padding: 32px;
            max-width: 360px;
            width: 90%;
            border: 2px solid var(--accent);
        }

        .modal-content h3 {
            color: var(--accent);
            margin-bottom: 24px;
            text-align: center;
        }

        .section {
            margin-bottom: 24px;
        }

        .section h4 {
            color: var(--accent);
            margin-bottom: 16px;
        }

        .ref-link {
            background: rgba(0,0,0,0.3);
            padding: 14px;
            border-radius: 40px;
            word-break: break-all;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .promo-item {
            background: rgba(0,0,0,0.3);
            padding: 14px 20px;
            border-radius: 40px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        .promo-item:hover {
            border-color: var(--accent);
        }

        .promo-code {
            color: var(--accent);
            font-weight: 700;
        }

        .promo-value {
            background: var(--accent);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
        }

        .promo-input {
            width: 100%;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border: 2px solid var(--border);
            border-radius: 40px;
            color: white;
            margin: 16px 0;
        }

        .promo-input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .modal .btn {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10000</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="bonusBtn"><i class="fas fa-gift"></i></button>
                <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            </div>
        </div>

        <!-- Навигация -->
        <div class="nav" id="nav">
            <button class="nav-btn active" data-game="rocket">🚀</button>
            <button class="nav-btn" data-game="plinko">🔴</button>
            <button class="nav-btn" data-game="slots">🎰</button>
            <button class="nav-btn" data-game="wheel">🎡</button>
            <button class="nav-btn" data-game="mines">💣</button>
        </div>

        <!-- ROCKET -->
        <div id="rocket" class="game active">
            <div class="stage rocket-stage">
                <canvas id="rocketCanvas" width="380" height="280"></canvas>
                <div class="multiplier" id="rocketMultiplier">1.00x</div>
                <div class="countdown" id="countdown">3</div>
            </div>
            <div class="info-panel">
                <div><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
                <div><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
                <div><div class="info-label">BET</div><div class="info-value" id="rocketBetValue">10</div></div>
            </div>
            <div class="bet-panel">
                <input type="number" id="rocketBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn btn-primary" id="rocketStart">🚀 СТАРТ</button>
                    <button class="btn btn-success" id="rocketStop" disabled>⏹️ СТОП</button>
                </div>
            </div>
        </div>

        <!-- PLINKO -->
        <div id="plinko" class="game">
            <div class="stage plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="520"></canvas>
            </div>
            <div class="bet-panel">
                <input type="number" id="plinkoBet" class="bet-input" value="10">
                <button class="btn btn-primary" id="plinkoDrop">🔽 БРОСИТЬ</button>
                <div class="result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- SLOTS -->
        <div id="slots" class="game">
            <div class="slots-machine">
                <div class="reels">
                    <div class="reel" id="slot1">🍒</div>
                    <div class="reel" id="slot2">🍒</div>
                    <div class="reel" id="slot3">🍒</div>
                </div>
                <div class="slots-multiplier" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <input type="number" id="slotsBet" class="bet-input" value="10">
                <button class="btn btn-primary" id="slotsSpin">🎰 КРУТИТЬ</button>
            </div>
        </div>

        <!-- WHEEL -->
        <div id="wheel" class="game">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="280" height="280"></canvas>
                <div class="pointer">▼</div>
            </div>
            <div class="wheel-result" id="wheelResult">—</div>
            <div class="bet-panel">
                <input type="number" id="wheelBet" class="bet-input" value="10">
                <button class="btn btn-primary" id="wheelSpin">🎡 КРУТИТЬ</button>
            </div>
        </div>

        <!-- MINES -->
        <div id="mines" class="game">
            <div class="mines-header">
                <select id="minesCount" class="mines-select">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="btn btn-success" id="minesNewGame">🔄 НОВАЯ</button>
            </div>
            <div class="grid" id="minesGrid"></div>
            <div class="mines-info">
                <span>Множитель: <span id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span></span>
            </div>
            <div class="bet-panel">
                <input type="number" id="minesBet" class="bet-input" value="10">
                <div class="actions">
                    <button class="btn btn-primary" id="minesStart">💣 СТАВКА</button>
                    <button class="btn btn-success" id="minesCashout" disabled>💰 ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- История -->
        <div class="history">
            <div class="history-header"><i class="fas fa-history"></i> ПОСЛЕДНИЕ ИГРЫ</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Меню -->
    <div class="modal" id="menuModal">
        <div class="modal-content">
            <h3>МЕНЮ</h3>
            <div class="section">
                <h4>🤝 РЕФЕРАЛЫ</h4>
                <div class="ref-link" id="refLink">Загрузка...</div>
                <div>Приглашено: <span id="refCount">0</span> (бонус: <span id="refBonus">0</span> ⭐)</div>
            </div>
            <div class="section">
                <h4>🎟️ ПРОМОКОДЫ</h4>
                <div class="promo-item" data-code="2026"><span class="promo-code">2026</span><span class="promo-value">+50 ⭐</span></div>
                <div class="promo-item" data-code="GDB"><span class="promo-code">GDB</span><span class="promo-value">+100 ⭐</span></div>
                <div class="promo-item" data-code="DROP"><span class="promo-code">DROP</span><span class="promo-value">+10 ⭐</span></div>
                <div class="promo-item" data-code="FREE"><span class="promo-code">FREE</span><span class="promo-value">+15 ⭐</span></div>
                <input type="text" id="promoInput" class="promo-input" placeholder="Введите промокод">
                <button class="btn btn-primary" id="applyPromo">АКТИВИРОВАТЬ</button>
            </div>
            <button class="btn btn-primary" id="closeMenu">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        (function() {
            const tg = Telegram.WebApp;
            tg.expand();

            const userId = tg.initDataUnsafe?.user?.id?.toString() || 'guest_' + Math.random().toString(36).substring(2);
            const storageKey = `casino_${userId}`;

            let data = JSON.parse(localStorage.getItem(storageKey)) || {
                balance: 10000,
                referrals: [],
                usedPromos: [],
                referralBonusPaid: 0,
                history: []
            };

            function saveData() {
                localStorage.setItem(storageKey, JSON.stringify(data));
            }

            function updateBalance() {
                document.getElementById('balance').textContent = data.balance;
            }

            function addStars(amount) {
                data.balance += amount;
                saveData();
                updateBalance();
                addHistory('БОНУС', `+${amount} ⭐`, 'win');
                confetti(20);
            }

            function deductStars(amount) {
                if (data.balance >= amount) {
                    data.balance -= amount;
                    saveData();
                    updateBalance();
                    return true;
                }
                return false;
            }

            function addHistory(game, text, type) {
                data.history.unshift({ game, text, type });
                if (data.history.length > 5) data.history.pop();
                renderHistory();
                saveData();
            }

            function renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = data.history.map(item => 
                    `<div class="history-item"><span>${item.game}</span><span class="${item.type}">${item.text}</span></div>`
                ).join('');
            }

            function confetti(count = 20) {
                for (let i = 0; i < count; i++) {
                    const c = document.createElement('div');
                    c.style.position = 'fixed';
                    c.style.left = Math.random() * 100 + '%';
                    c.style.top = '-10px';
                    c.style.width = '10px';
                    c.style.height = '10px';
                    c.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
                    c.style.borderRadius = '50%';
                    c.style.pointerEvents = 'none';
                    c.style.zIndex = '9999';
                    c.style.animation = `fall ${2+Math.random()*2}s linear`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }
            }

            const style = document.createElement('style');
            style.textContent = `@keyframes fall{to{transform:translateY(100vh) rotate(720deg);}}`;
            document.head.appendChild(style);

            // Навигация
            const navBtns = document.querySelectorAll('.nav-btn');
            const games = {
                rocket: document.getElementById('rocket'),
                plinko: document.getElementById('plinko'),
                slots: document.getElementById('slots'),
                wheel: document.getElementById('wheel'),
                mines: document.getElementById('mines')
            };

            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    navBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.values(games).forEach(g => g.classList.remove('active'));
                    games[btn.dataset.game].classList.add('active');
                });
            });

            // Рефералы
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('ref_')) {
                const referrerId = startParam.replace('ref_', '');
                if (!localStorage.getItem(`referred_${userId}`) && referrerId !== userId) {
                    let referrerData = JSON.parse(localStorage.getItem(`casino_${referrerId}`) || '{"referrals":[]}');
                    if (!referrerData.referrals) referrerData.referrals = [];
                    if (!referrerData.referrals.includes(userId)) {
                        referrerData.referrals.push(userId);
                        localStorage.setItem(`casino_${referrerId}`, JSON.stringify(referrerData));
                    }
                    localStorage.setItem(`referred_${userId}`, 'true');
                }
            }

            function getReferrals() {
                return data.referrals || [];
            }

            function updateReferralDisplay() {
                const botName = tg.initDataUnsafe?.user?.username || 'your_bot';
                document.getElementById('refLink').textContent = `t.me/${botName}?start=ref_${userId}`;
                const refs = getReferrals();
                document.getElementById('refCount').textContent = refs.length;
                document.getElementById('refBonus').textContent = refs.length * 10;
            }

            function applyReferralBonus() {
                const refs = getReferrals();
                const expected = refs.length * 10;
                const current = data.referralBonusPaid || 0;
                if (expected > current) {
                    data.balance += expected - current;
                    data.referralBonusPaid = expected;
                    saveData();
                    updateBalance();
                }
            }

            // Промокоды
            const promoCodes = {
                '2026': 50,
                'GDB': 100,
                'DROP': 10,
                'FREE': 15
            };

            function applyPromo(code) {
                const upper = code.toUpperCase();
                if (data.usedPromos.includes(upper)) {
                    alert('Промокод уже использован');
                    return false;
                }
                if (promoCodes[upper]) {
                    data.balance += promoCodes[upper];
                    data.usedPromos.push(upper);
                    saveData();
                    updateBalance();
                    alert(`Промокод активирован! +${promoCodes[upper]} ⭐`);
                    addHistory('ПРОМОКОД', `+${promoCodes[upper]} ⭐`, 'win');
                    confetti(30);
                    return true;
                }
                alert('Неверный промокод');
                return false;
            }

            // ROCKET
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const multiplierEl = document.getElementById('rocketMultiplier');
                const countdownEl = document.getElementById('countdown');
                const lastCrash = document.getElementById('lastCrash');
                const maxCrash = document.getElementById('maxCrash');
                const betInput = document.getElementById('rocketBet');
                const betValue = document.getElementById('rocketBetValue');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false;
                let interval = null;
                let crashPoint = 2.0;
                let currentMult = 1.0;
                let bet = 10;
                let max = 12.5;
                let history = [4.56, 2.89, 7.23, 3.45, 5.67];

                function drawRocket(mult, shake) {
                    ctx.clearRect(0, 0, 380, 280);
                    for (let i = 0; i < 30; i++) {
                        ctx.fillStyle = 'rgba(255,255,255,0.1)';
                        ctx.beginPath();
                        ctx.arc(Math.random()*380, Math.random()*280, Math.random()*2, 0, 2*Math.PI);
                        ctx.fill();
                    }

                    const y = 150 - (mult - 1) * 18;
                    const shakeX = Math.sin(Date.now() * 0.02) * shake;
                    const shakeY = Math.cos(Date.now() * 0.02) * shake;

                    // Пламя
                    ctx.shadowColor = '#f97316';
                    ctx.shadowBlur = 20 + shake;
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(190 + shakeX, y + 45 + shakeY, 15, 0, 2*Math.PI);
                    ctx.fill();

                    // Ракета
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 30 + shake;
                    ctx.font = '70px "Segoe UI Emoji"';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#fff';
                    ctx.fillText('🚀', 190 + shakeX, y + shakeY);
                    ctx.shadowBlur = 0;
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    crashPoint = 1 + Math.random() * 9;
                    crashPoint = Math.round(crashPoint * 100) / 100;

                    countdownEl.style.display = 'block';
                    let count = 3;
                    countdownEl.textContent = count;
                    const ci = setInterval(() => {
                        count--;
                        if (count > 0) countdownEl.textContent = count;
                        else {
                            clearInterval(ci);
                            countdownEl.style.display = 'none';
                            gameActive = true;
                            startBtn.disabled = true;
                            stopBtn.disabled = false;
                            currentMult = 1.0;
                            const startTime = Date.now();
                            interval = setInterval(() => {
                                if (!gameActive) return;
                                const elapsed = (Date.now() - startTime) / 1000;
                                currentMult = 1 + 0.5 * elapsed;
                                multiplierEl.textContent = currentMult.toFixed(2) + 'x';
                                drawRocket(currentMult, currentMult * 1.5);
                                if (currentMult >= crashPoint) {
                                    clearInterval(interval);
                                    gameActive = false;
                                    startBtn.disabled = false;
                                    stopBtn.disabled = true;
                                    history.unshift(crashPoint);
                                    if (crashPoint > max) max = crashPoint;
                                    lastCrash.textContent = crashPoint.toFixed(2) + 'x';
                                    maxCrash.textContent = max.toFixed(2) + 'x';
                                    addHistory('ROCKET', `CRASH -${bet} ⭐`, 'lose');
                                }
                            }, 30);
                        }
                    }, 1000);
                });

                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(interval);
                    gameActive = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const win = Math.floor(bet * currentMult);
                    data.balance += win;
                    saveData();
                    updateBalance();
                    history.unshift(currentMult);
                    if (currentMult > max) max = currentMult;
                    lastCrash.textContent = currentMult.toFixed(2) + 'x';
                    maxCrash.textContent = max.toFixed(2) + 'x';
                    addHistory('ROCKET', `x${currentMult.toFixed(2)} +${win} ⭐`, 'win');
                    confetti(25);
                });

                betInput.addEventListener('input', () => {
                    betValue.textContent = betInput.value;
                });

                lastCrash.textContent = history[0].toFixed(2) + 'x';
                maxCrash.textContent = max.toFixed(2) + 'x';
                drawRocket(1, 0);
            })();

            // PLINKO
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const result = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');

                const multipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];
                let anim = null;

                function drawBoard() {
                    ctx.clearRect(0, 0, 380, 520);
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c <= r; c++) {
                            let x = 190 - r * 20 + c * 40;
                            let y = 40 + r * 52;
                            ctx.fillStyle = '#3b82f6';
                            ctx.shadowColor = '#3b82f6';
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.arc(x, y, 7, 0, 2*Math.PI);
                            ctx.fill();
                        }
                    }
                    const cellY = 40 + 8*52 + 20;
                    ctx.shadowBlur = 0;
                    for (let i = 0; i < 9; i++) {
                        let x = 190 - 8*20 + i * 40;
                        ctx.strokeStyle = '#2a313e';
                        ctx.strokeRect(x-20, cellY-12, 40, 35);
                        ctx.fillStyle = '#8e9fb1';
                        ctx.font = 'bold 14px Inter';
                        ctx.fillText(multipliers[i].toFixed(1)+'x', x-12, cellY+15);
                    }
                }

                function dropBall(bet) {
                    if (anim) clearInterval(anim);
                    let ball = { x: 190, y: 20, vx: 0, vy: 1 };
                    let lastCollision = 0;
                    anim = setInterval(() => {
                        ball.vy += 0.4;
                        ball.y += ball.vy;
                        ball.x += ball.vx;
                        ball.vx *= 0.98;

                        for (let r = 0; r < 8; r++) {
                            for (let c = 0; c <= r; c++) {
                                let pegX = 190 - r * 20 + c * 40;
                                let pegY = 40 + r * 52;
                                let dx = ball.x - pegX, dy = ball.y - pegY;
                                let dist = Math.sqrt(dx*dx + dy*dy);
                                if (dist < 14 && Date.now() - lastCollision > 200) {
                                    let angle = Math.atan2(dy, dx);
                                    ball.vx = Math.cos(angle) * 4;
                                    ball.vy = -Math.abs(Math.sin(angle) * 3);
                                    ball.vx += (Math.random() - 0.5) * 2;
                                    lastCollision = Date.now();
                                    break;
                                }
                            }
                        }
                        if (ball.x < 25) { ball.x = 25; ball.vx *= -0.5; }
                        if (ball.x > 355) { ball.x = 355; ball.vx *= -0.5; }

                        drawBoard();

                        ctx.shadowColor = '#3b82f6';
                        ctx.shadowBlur = 25;
                        ctx.beginPath();
                        ctx.arc(ball.x, ball.y, 12, 0, 2*Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        ctx.fillStyle = '#cbd5e1';
                        ctx.beginPath();
                        ctx.arc(ball.x-3, ball.y-3, 4, 0, 2*Math.PI);
                        ctx.fill();

                        if (ball.y > 480) {
                            clearInterval(anim);
                            let col = Math.floor((ball.x - (190 - 8*20)) / 40);
                            col = Math.max(0, Math.min(8, col));
                            let mult = multipliers[col];
                            let win = Math.floor(bet * mult);
                            data.balance += win;
                            saveData();
                            updateBalance();
                            result.textContent = mult >= 1 ? `WIN ${win} ⭐` : `LOSE ${win} ⭐`;
                            addHistory('PLINKO', `x${mult.toFixed(1)} ${win>=bet?'+':''}${win-bet} ⭐`, mult>=1?'win':'lose');
                            if (mult >= 3) confetti(20);
                        }
                    }, 25);
                }

                dropBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    dropBall(bet);
                });

                drawBoard();
            })();

            // SLOTS
            (function slots() {
                const slot1 = document.getElementById('slot1');
                const slot2 = document.getElementById('slot2');
                const slot3 = document.getElementById('slot3');
                const multiplierSpan = document.getElementById('slotsMultiplier');
                const spinBtn = document.getElementById('slotsSpin');
                const betInput = document.getElementById('slotsBet');

                const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '⭐'];

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    slot1.classList.add('spinning');
                    slot2.classList.add('spinning');
                    slot3.classList.add('spinning');

                    let spins = 15;
                    let interval = setInterval(() => {
                        slot1.textContent = symbols[Math.floor(Math.random()*6)];
                        slot2.textContent = symbols[Math.floor(Math.random()*6)];
                        slot3.textContent = symbols[Math.floor(Math.random()*6)];
                        spins--;
                        if (spins === 0) {
                            clearInterval(interval);
                            slot1.classList.remove('spinning');
                            slot2.classList.remove('spinning');
                            slot3.classList.remove('spinning');

                            const r1 = Math.floor(Math.random()*6);
                            const r2 = Math.floor(Math.random()*6);
                            const r3 = Math.floor(Math.random()*6);
                            slot1.textContent = symbols[r1];
                            slot2.textContent = symbols[r2];
                            slot3.textContent = symbols[r3];

                            let mult = 0;
                            if (r1 === r2 && r2 === r3) {
                                if (r1 === 4) mult = 15;
                                else if (r1 === 5) mult = 20;
                                else if (r1 === 3) mult = 8;
                                else if (r1 === 2) mult = 5;
                                else mult = 3;
                            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                                mult = 2;
                            }

                            if (mult === 0) {
                                multiplierSpan.textContent = 'x0';
                                addHistory('SLOTS', `LOSE -${bet} ⭐`, 'lose');
                            } else {
                                const win = bet * mult;
                                data.balance += win;
                                saveData();
                                updateBalance();
                                multiplierSpan.textContent = `x${mult}`;
                                addHistory('SLOTS', `x${mult} +${win} ⭐`, 'win');
                                if (mult >= 5) confetti(30);
                            }
                        }
                    }, 70);
                });
            })();

            // WHEEL
            (function wheel() {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const spinBtn = document.getElementById('wheelSpin');
                const betInput = document.getElementById('wheelBet');
                const resultSpan = document.getElementById('wheelResult');

                const sectors = [
                    { label: 'x0', mult: 0, color: '#ef4444' },
                    { label: 'x1', mult: 1, color: '#3b82f6' },
                    { label: 'x2', mult: 2, color: '#10b981' },
                    { label: 'x5', mult: 5, color: '#f59e0b' },
                    { label: 'x10', mult: 10, color: '#8b5cf6' },
                    { label: 'x50', mult: 50, color: '#ec4899' }
                ];

                function drawWheel(rot = 0) {
                    ctx.clearRect(0,0,280,280);
                    const ang = (2*Math.PI)/6;
                    for (let i = 0; i < 6; i++) {
                        ctx.beginPath();
                        ctx.moveTo(140,140);
                        ctx.arc(140,140,120, i*ang+rot, (i+1)*ang+rot);
                        ctx.closePath();
                        ctx.fillStyle = sectors[i].color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();
                    }
                }

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    const idx = Math.floor(Math.random() * 6);
                    const mult = sectors[idx].mult;
                    const win = bet * mult;
                    data.balance += win;
                    saveData();
                    updateBalance();
                    resultSpan.textContent = `${sectors[idx].label} → ${win} ⭐`;
                    addHistory('WHEEL', `${sectors[idx].label} ${win>=bet?'+':''}${win-bet} ⭐`, mult>0?'win':'lose');
                    if (mult >= 10) confetti(40);

                    let spins = 20;
                    let interval = setInterval(() => {
                        drawWheel(Date.now() * 0.01);
                        spins--;
                        if (spins === 0) clearInterval(interval);
                    }, 30);
                });

                drawWheel();
            })();

            // MINES
            (function mines() {
                const grid = document.getElementById('minesGrid');
                const countSelect = document.getElementById('minesCount');
                const newGame = document.getElementById('minesNewGame');
                const startBtn = document.getElementById('minesStart');
                const cashoutBtn = document.getElementById('minesCashout');
                const betInput = document.getElementById('minesBet');
                const multSpan = document.getElementById('minesMultiplier');
                const winSpan = document.getElementById('minesWin');

                let board = [], revealed = [], active = false, bet = 0, mines = 3, stars = 0;

                const multTable = {
                    3: [1.15, 1.35, 1.7, 2.2, 3.0, 6.5, 20, 50, 100],
                    5: [1.2, 1.5, 2.0, 3.0, 5.0, 10, 25, 60, 150],
                    10: [1.3, 2.0, 3.5, 6.0, 12, 25, 60, 150, 400]
                };

                function getMult(m, r) {
                    if (r === 0) return 1.0;
                    const arr = multTable[m];
                    return arr[Math.min(r-1, arr.length-1)] || 1.0;
                }

                function render() {
                    grid.innerHTML = '';
                    for (let i = 0; i < 25; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        if (revealed[i]) {
                            cell.classList.add(board[i] ? 'mine' : 'star');
                            cell.textContent = board[i] ? '💣' : '⭐';
                        } else {
                            cell.textContent = '?';
                        }
                        cell.onclick = () => {
                            if (!active) return;
                            if (revealed[i]) return;
                            if (board[i]) {
                                revealed[i] = true;
                                render();
                                active = false;
                                cashoutBtn.disabled = true;
                                addHistory('MINES', `MINE -${bet} ⭐`, 'lose');
                                alert('💥 Проигрыш!');
                            } else {
                                revealed[i] = true;
                                stars++;
                                const mult = getMult(mines, stars);
                                multSpan.textContent = mult.toFixed(2) + 'x';
                                winSpan.textContent = Math.floor(bet * mult);
                                render();
                            }
                        };
                        grid.appendChild(cell);
                    }
                }

                function reset() {
                    active = false;
                    cashoutBtn.disabled = true;
                    stars = 0;
                    multSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    render();
                }

                newGame.onclick = reset;

                startBtn.onclick = () => {
                    const b = parseInt(betInput.value);
                    if (b < 1 || b > data.balance) return alert('Неверная ставка');
                    if (!deductStars(b)) return;
                    bet = b;
                    mines = parseInt(countSelect.value);
                    board = new Array(25).fill(false);
                    for (let i = 0; i < mines; i++) {
                        let pos;
                        do { pos = Math.floor(Math.random()*25); } while (board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    stars = 0;
                    multSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    active = true;
                    cashoutBtn.disabled = false;
                    render();
                };

                cashoutBtn.onclick = () => {
                    if (!active) return;
                    const mult = getMult(mines, stars);
                    const win = Math.floor(bet * mult);
                    data.balance += win;
                    saveData();
                    updateBalance();
                    addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                    active = false;
                    cashoutBtn.disabled = true;
                    render();
                    if (mult >= 5) confetti(25);
                };

                reset();
            })();

            // Бонус
            document.getElementById('bonusBtn').addEventListener('click', () => {
                addStars(1000);
            });

            // Меню
            const menuBtn = document.getElementById('menuBtn');
            const menuModal = document.getElementById('menuModal');
            const closeMenu = document.getElementById('closeMenu');
            const applyPromo = document.getElementById('applyPromo');
            const promoInput = document.getElementById('promoInput');

            menuBtn.addEventListener('click', () => {
                applyReferralBonus();
                updateReferralDisplay();
                menuModal.classList.add('active');
            });

            closeMenu.addEventListener('click', () => {
                menuModal.classList.remove('active');
            });

            menuModal.addEventListener('click', (e) => {
                if (e.target === menuModal) menuModal.classList.remove('active');
            });

            document.querySelectorAll('.promo-item').forEach(item => {
                item.addEventListener('click', () => {
                    promoInput.value = item.dataset.code;
                });
            });

            applyPromo.addEventListener('click', () => {
                const code = promoInput.value.trim();
                if (code) applyPromo(code);
                promoInput.value = '';
            });

            updateBalance();
            updateReferralDisplay();
            renderHistory();
        })();
    </script>
</body>
</html>
