<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ IMPERIAL CASINO ✦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #0a0c12;
            color: white;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            background: #12161f;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #2a313e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2632;
            padding: 12px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: bold;
        }
        .balance i { color: #3b82f6; }
        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a313e;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-btn:hover { color: #3b82f6; }
        .nav {
            display: flex;
            gap: 5px;
            background: #1e2632;
            padding: 5px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .nav-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 35px;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn.active {
            background: #3b82f6;
            color: white;
        }
        .game { display: none; }
        .game.active { display: block; }
        .stage {
            background: #000;
            border-radius: 30px;
            border: 2px solid #2a313e;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }
        canvas { display: block; width: 100%; height: auto; }
        .info-panel {
            display: flex;
            justify-content: space-between;
            background: #1e2632;
            border-radius: 30px;
            padding: 16px;
            margin: 16px 0;
        }
        .info-item { text-align: center; }
        .info-label { color: #94a3b8; font-size: 12px; }
        .info-value { font-weight: bold; color: #3b82f6; font-size: 18px; }
        .bet-panel {
            background: #1e2632;
            border-radius: 30px;
            padding: 20px;
        }
        .bet-input {
            width: 100%;
            padding: 16px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }
        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn.primary { background: #3b82f6; color: white; }
        .btn.success { background: #10b981; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .multiplier {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 32px;
            font-weight: bold;
        }
        .result {
            margin-top: 16px;
            padding: 20px;
            background: #1e2632;
            border-radius: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        .cell {
            aspect-ratio: 1;
            background: #2a313e;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { border: 2px solid #3b82f6; }
        .cell.star { background: #166534; color: #10b981; }
        .cell.mine { background: #991b1b; color: #ef4444; }
        .history {
            background: #1e2632;
            border-radius: 30px;
            padding: 16px;
            margin-top: 20px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #2a313e;
        }
        .win { color: #3b82f6; }
        .lose { color: #ef4444; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e2632;
            border-radius: 40px;
            padding: 30px;
            max-width: 360px;
            width: 90%;
            border: 2px solid #3b82f6;
        }
        .modal-content h3 { margin-bottom: 20px; text-align: center; }
        .section { margin-bottom: 24px; }
        .section h4 { margin-bottom: 12px; color: #3b82f6; }
        .ref-link {
            background: #2a313e;
            padding: 12px;
            border-radius: 30px;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .promo-item {
            background: #2a313e;
            padding: 12px 16px;
            border-radius: 30px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        .promo-code { color: #3b82f6; font-weight: bold; }
        .promo-value {
            background: #3b82f6;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .promo-input {
            width: 100%;
            padding: 14px;
            background: #2a313e;
            border: none;
            border-radius: 30px;
            color: white;
            margin: 12px 0;
        }
        .close-btn {
            width: 100%;
            padding: 16px;
            background: #3b82f6;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .reel {
            width: 80px; height: 80px;
            background: #1e2632;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 3px solid #3b82f6;
        }
        /* Чёрно-белое колесо */
        .wheel-black, .wheel-white { transition: 0.3s; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="balance"><i class="fas fa-star"></i> <span id="balance">10000</span></div>
            <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        </div>

        <div class="nav" id="nav">
            <button class="nav-btn active" data-game="rocket">🚀</button>
            <button class="nav-btn" data-game="plinko">🔴</button>
            <button class="nav-btn" data-game="slots">🎰</button>
            <button class="nav-btn" data-game="wheel">🎡</button>
            <button class="nav-btn" data-game="mines">💣</button>
        </div>

        <!-- ROCKET -->
        <div id="rocket" class="game active">
            <div class="stage" style="height:280px"><canvas id="rocketCanvas" width="380" height="280"></canvas><div class="multiplier" id="rocketMultiplier">1.00x</div></div>
            <div class="info-panel"><div><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div><div><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div><div><div class="info-label">BET</div><div class="info-value" id="rocketBetValue">10</div></div></div>
            <div class="bet-panel"><input type="number" id="rocketBet" class="bet-input" value="10"><div class="actions"><button class="btn primary" id="rocketStart">🚀 СТАРТ</button><button class="btn success" id="rocketStop" disabled>⏹️ СТОП</button></div></div>
        </div>

        <!-- PLINKO -->
        <div id="plinko" class="game">
            <div class="stage" style="height:500px"><canvas id="plinkoCanvas" width="380" height="500"></canvas></div>
            <div class="bet-panel"><input type="number" id="plinkoBet" class="bet-input" value="10"><button class="btn primary" id="plinkoDrop">🔽 БРОСИТЬ</button><div class="result" id="plinkoResult">—</div></div>
        </div>

        <!-- SLOTS -->
        <div id="slots" class="game">
            <div class="stage" style="padding:30px"><div style="display:flex;gap:15px;justify-content:center"><div class="reel" id="slot1">🍒</div><div class="reel" id="slot2">🍒</div><div class="reel" id="slot3">🍒</div></div><div style="text-align:center;margin-top:20px;font-size:24px;color:#3b82f6" id="slotsMultiplier">x1</div></div>
            <div class="bet-panel"><input type="number" id="slotsBet" class="bet-input" value="10"><button class="btn primary" id="slotsSpin">🎰 КРУТИТЬ</button></div>
        </div>

        <!-- WHEEL (чёрно-белое) -->
        <div id="wheel" class="game">
            <div style="width:280px;height:280px;margin:20px auto;position:relative">
                <canvas id="wheelCanvas" width="280" height="280"></canvas>
                <div style="position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:40px;color:#3b82f6">▼</div>
            </div>
            <div class="result" id="wheelResult">—</div>
            <div class="bet-panel"><input type="number" id="wheelBet" class="bet-input" value="10"><button class="btn primary" id="wheelSpin">🎡 КРУТИТЬ</button></div>
        </div>

        <!-- MINES (исправлен баг с кнопкой "Забрать") -->
        <div id="mines" class="game">
            <div style="display:flex;gap:10px;margin-bottom:20px"><select id="minesCount" class="bet-input" style="margin:0"><option value="3">3 💣</option><option value="5">5 💣</option><option value="10">10 💣</option></select><button class="btn success" id="minesNewGame">🔄 НОВАЯ</button></div>
            <div class="grid" id="minesGrid"></div>
            <div class="info-panel"><span>Множитель: <span id="minesMultiplier">1.00x</span></span><span>Выигрыш: <span id="minesWin">0</span></span></div>
            <div class="bet-panel"><input type="number" id="minesBet" class="bet-input" value="10"><div class="actions"><button class="btn primary" id="minesStart">💣 СТАВКА</button><button class="btn success" id="minesCashout" disabled>💰 ЗАБРАТЬ</button></div></div>
        </div>

        <div class="history"><div style="margin-bottom:10px">📜 ИСТОРИЯ</div><div id="historyList"></div></div>
    </div>

    <div class="modal" id="menuModal">
        <div class="modal-content">
            <h3>МЕНЮ</h3>
            <div class="section"><h4>🤝 РЕФЕРАЛЫ</h4><div class="ref-link" id="refLink">Загрузка...</div><div>Приглашено: <span id="refCount">0</span> (бонус: <span id="refBonus">0</span> ⭐)</div><button class="btn primary" id="addTestReferral" style="margin-top:10px;">➕ ТЕСТ (добавить реферала)</button></div>
            <div class="section"><h4>🎟️ ПРОМОКОДЫ</h4><div class="promo-item" data-code="2026"><span class="promo-code">2026</span><span class="promo-value">+50</span></div><div class="promo-item" data-code="GDB"><span class="promo-code">GDB</span><span class="promo-value">+100</span></div><div class="promo-item" data-code="DROP"><span class="promo-code">DROP</span><span class="promo-value">+10</span></div><div class="promo-item" data-code="FREE"><span class="promo-code">FREE</span><span class="promo-value">+15</span></div><input type="text" id="promoInput" class="promo-input" placeholder="Введите промокод"><button class="close-btn" id="applyPromo">АКТИВИРОВАТЬ</button></div>
            <button class="close-btn" id="closeMenu">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        (function() {
            // Telegram
            const tg = window.Telegram.WebApp;
            tg.expand();

            const userId = tg.initDataUnsafe?.user?.id?.toString() || 'guest_' + Math.random().toString(36).substring(2);
            const storageKey = `casino_${userId}`;

            let data = JSON.parse(localStorage.getItem(storageKey)) || {
                balance: 10000,
                referrals: 0,               // количество рефералов (для теста)
                usedPromos: [],
                history: []
            };

            function saveData() { localStorage.setItem(storageKey, JSON.stringify(data)); }
            function updateBalance() { document.getElementById('balance').textContent = data.balance; }
            function addStars(amount) { data.balance += amount; saveData(); updateBalance(); addHistory('Бонус', `+${amount}⭐`, 'win'); }
            function deductStars(amount) { if (data.balance >= amount) { data.balance -= amount; saveData(); updateBalance(); return true; } return false; }

            function addHistory(game, text, type) {
                data.history.unshift({ game, text, type });
                if (data.history.length > 5) data.history.pop();
                renderHistory(); saveData();
            }
            function renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = data.history.map(item => `<div class="history-item"><span>${item.game}</span><span class="${item.type}">${item.text}</span></div>`).join('');
            }

            // Рефералы (упрощённо: тестовая кнопка)
            function updateReferralDisplay() {
                document.getElementById('refLink').textContent = `t.me/your_bot?start=ref_${userId}`;
                document.getElementById('refCount').textContent = data.referrals;
                document.getElementById('refBonus').textContent = data.referrals * 10;
            }
            document.getElementById('addTestReferral').addEventListener('click', () => {
                data.referrals++;
                saveData();
                updateReferralDisplay();
                addStars(10); // за каждого реферала сразу начисляем 10 звёзд
                alert('Тестовый реферал добавлен! +10⭐');
            });

            // Промокоды
            const promoCodes = { '2026': 50, 'GDB': 100, 'DROP': 10, 'FREE': 15 };
            function applyPromo(code) {
                const upper = code.toUpperCase();
                if (data.usedPromos.includes(upper)) { alert('Уже использован'); return false; }
                if (promoCodes[upper]) { data.balance += promoCodes[upper]; data.usedPromos.push(upper); saveData(); updateBalance(); alert(`+${promoCodes[upper]}⭐`); addHistory('Промокод', `+${promoCodes[upper]}⭐`, 'win'); return true; }
                alert('Неверный код'); return false;
            }

            // Навигация
            const navBtns = document.querySelectorAll('.nav-btn');
            const games = { rocket: document.getElementById('rocket'), plinko: document.getElementById('plinko'), slots: document.getElementById('slots'), wheel: document.getElementById('wheel'), mines: document.getElementById('mines') };
            navBtns.forEach(btn => btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(games).forEach(g => g.classList.remove('active'));
                games[btn.dataset.game].classList.add('active');
            }));

            // ROCKET (звёздный фон)
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const multEl = document.getElementById('rocketMultiplier');
                const lastCrash = document.getElementById('lastCrash');
                const maxCrash = document.getElementById('maxCrash');
                const betInput = document.getElementById('rocketBet');
                const betValue = document.getElementById('rocketBetValue');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false, interval = null, crashPoint = 2, current = 1, bet = 10, max = 12.5, hist = [4.56, 2.89, 7.23, 3.45, 5.67];
                let stars = [];

                function initStars(count=50) {
                    for (let i=0; i<count; i++) stars.push({ x: Math.random()*380, y: Math.random()*280, size: Math.random()*2+1 });
                }
                initStars();

                function draw(mult) {
                    ctx.clearRect(0,0,380,280);
                    // звёзды
                    ctx.fillStyle = '#fff';
                    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 2*Math.PI); ctx.fill(); });
                    // ракета
                    ctx.font = '70px "Segoe UI Emoji"';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#fff';
                    ctx.fillText('🚀', 190, 150-(mult-1)*15);
                    ctx.shadowBlur = 0;
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    bet = parseInt(betInput.value);
                    if (bet<1||bet>data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    crashPoint = +(1+Math.random()*9).toFixed(2);
                    gameActive = true; startBtn.disabled = true; stopBtn.disabled = false;
                    current = 1; multEl.textContent='1.00x'; draw(1);
                    const startTime = Date.now();
                    interval = setInterval(() => {
                        const elapsed = (Date.now()-startTime)/1000;
                        current = 1+0.5*elapsed;
                        multEl.textContent = current.toFixed(2)+'x';
                        draw(current);
                        if (current >= crashPoint) {
                            clearInterval(interval);
                            gameActive = false; startBtn.disabled = false; stopBtn.disabled = true;
                            hist.unshift(crashPoint); if (crashPoint>max) max=crashPoint;
                            lastCrash.textContent = crashPoint.toFixed(2)+'x'; maxCrash.textContent = max.toFixed(2)+'x';
                            addHistory('Rocket', `CRASH -${bet}⭐`, 'lose');
                        }
                    }, 30);
                });
                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(interval); gameActive = false; startBtn.disabled = false; stopBtn.disabled = true;
                    const win = Math.floor(bet*current);
                    data.balance += win; saveData(); updateBalance();
                    hist.unshift(current); if (current>max) max=current;
                    lastCrash.textContent = current.toFixed(2)+'x'; maxCrash.textContent = max.toFixed(2)+'x';
                    addHistory('Rocket', `x${current.toFixed(2)} +${win}⭐`, 'win');
                });
                betInput.addEventListener('input', () => betValue.textContent = betInput.value);
                lastCrash.textContent = hist[0].toFixed(2)+'x'; maxCrash.textContent = max.toFixed(2)+'x';
                draw(1);
            })();

            // PLINKO (без изменений, работает)
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const result = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');
                const mults = [0.5,0.7,1,1.5,2,3,5,8,10];
                let anim = null;

                function drawBoard() {
                    ctx.clearRect(0,0,380,500);
                    for (let r=0;r<8;r++) for (let c=0;c<=r;c++) {
                        let x=190-r*20+c*40, y=40+r*52;
                        ctx.fillStyle='#3b82f6'; ctx.beginPath(); ctx.arc(x,y,6,0,2*Math.PI); ctx.fill();
                    }
                    const cellY=40+8*52+20;
                    for (let i=0;i<9;i++) {
                        let x=190-8*20+i*40;
                        ctx.strokeStyle='#2a313e'; ctx.strokeRect(x-18,cellY-10,36,30);
                        ctx.fillStyle='#94a3b8'; ctx.font='bold 14px Inter';
                        ctx.fillText(mults[i].toFixed(1)+'x', x-12, cellY+12);
                    }
                }

                function dropBall(bet) {
                    if (anim) clearInterval(anim);
                    let ball={x:190,y:20,vx:0,vy:1}, lastColl=0;
                    anim = setInterval(() => {
                        ball.vy+=0.4; ball.y+=ball.vy; ball.x+=ball.vx; ball.vx*=0.98;
                        for (let r=0;r<8;r++) for (let c=0;c<=r;c++) {
                            let px=190-r*20+c*40, py=40+r*52;
                            let dx=ball.x-px, dy=ball.y-py;
                            if (Math.hypot(dx,dy)<12 && Date.now()-lastColl>200) {
                                let angle=Math.atan2(dy,dx);
                                ball.vx=Math.cos(angle)*4; ball.vy=-Math.abs(Math.sin(angle)*3);
                                ball.vx+=(Math.random()-0.5)*2;
                                lastColl=Date.now(); break;
                            }
                        }
                        if (ball.x<30) { ball.x=30; ball.vx*=-0.5; }
                        if (ball.x>350) { ball.x=350; ball.vx*=-0.5; }
                        drawBoard();
                        ctx.shadowColor='#3b82f6'; ctx.shadowBlur=20;
                        ctx.beginPath(); ctx.arc(ball.x,ball.y,12,0,2*Math.PI);
                        ctx.fillStyle='#fff'; ctx.fill();
                        if (ball.y>470) {
                            clearInterval(anim);
                            let col=Math.floor((ball.x-(190-8*20))/40);
                            col=Math.max(0,Math.min(8,col));
                            let mult=mults[col], win=Math.floor(bet*mult);
                            data.balance+=win; saveData(); updateBalance();
                            result.textContent = mult>=1 ? `WIN ${win}⭐` : `LOSE ${win}⭐`;
                            addHistory('Plinko', `x${mult.toFixed(1)} ${win>=bet?'+':''}${win-bet}⭐`, mult>=1?'win':'lose');
                        }
                    },25);
                }

                dropBtn.addEventListener('click', () => {
                    let bet=parseInt(betInput.value);
                    if (bet<1||bet>data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    dropBall(bet);
                });
                drawBoard();
            })();

            // SLOTS
            (function slots() {
                const slot1=document.getElementById('slot1'), slot2=document.getElementById('slot2'), slot3=document.getElementById('slot3');
                const multSpan=document.getElementById('slotsMultiplier');
                const spinBtn=document.getElementById('slotsSpin'), betInput=document.getElementById('slotsBet');
                const symbols=['🍒','🍋','🍇','🔔','💎','⭐'];
                spinBtn.addEventListener('click', () => {
                    let bet=parseInt(betInput.value);
                    if (bet<1||bet>data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    let spins=15;
                    let interval = setInterval(() => {
                        slot1.textContent = symbols[Math.floor(Math.random()*6)];
                        slot2.textContent = symbols[Math.floor(Math.random()*6)];
                        slot3.textContent = symbols[Math.floor(Math.random()*6)];
                        spins--;
                        if (spins===0) {
                            clearInterval(interval);
                            let r1=Math.floor(Math.random()*6), r2=Math.floor(Math.random()*6), r3=Math.floor(Math.random()*6);
                            slot1.textContent=symbols[r1]; slot2.textContent=symbols[r2]; slot3.textContent=symbols[r3];
                            let mult=0;
                            if (r1===r2 && r2===r3) {
                                if (r1===4) mult=15; else if (r1===5) mult=20; else if (r1===3) mult=8; else if (r1===2) mult=5; else mult=3;
                            } else if (r1===r2 || r2===r3 || r1===r3) mult=2;
                            if (mult===0) { multSpan.textContent='x0'; addHistory('Slots', `LOSE -${bet}⭐`, 'lose'); }
                            else { let win=bet*mult; data.balance+=win; saveData(); updateBalance(); multSpan.textContent=`x${mult}`; addHistory('Slots', `x${mult} +${win}⭐`, 'win'); }
                        }
                    },80);
                });
            })();

            // WHEEL (чёрно-белое, с вращением)
            (function wheel() {
                const canvas=document.getElementById('wheelCanvas'), ctx=canvas.getContext('2d');
                const spinBtn=document.getElementById('wheelSpin'), betInput=document.getElementById('wheelBet'), result=document.getElementById('wheelResult');
                const sectors = ['x0','x1','x2','x5','x10','x50'];
                const mults = [0,1,2,5,10,50];
                const colors = ['#000000','#ffffff','#000000','#ffffff','#000000','#ffffff']; // чередуем чёрный и белый
                let rotation = 0;
                let spinning = false;
                let animFrame = null;

                function drawWheel(rot) {
                    ctx.clearRect(0,0,280,280);
                    let angle = (2*Math.PI)/6;
                    for (let i=0;i<6;i++) {
                        ctx.beginPath();
                        ctx.moveTo(140,140);
                        ctx.arc(140,140,120, i*angle+rot, (i+1)*angle+rot);
                        ctx.closePath();
                        ctx.fillStyle = colors[i];
                        ctx.fill();
                        ctx.strokeStyle = '#2a313e';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        // подписи
                        ctx.save();
                        ctx.translate(140,140);
                        ctx.rotate(i*angle + angle/2 + rot);
                        ctx.fillStyle = colors[i] === '#000000' ? '#ffffff' : '#000000';
                        ctx.font = 'bold 16px Inter';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(sectors[i], 80, 0);
                        ctx.restore();
                    }
                }

                spinBtn.addEventListener('click', () => {
                    if (spinning) return;
                    let bet = parseInt(betInput.value);
                    if (bet<1||bet>data.balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    spinning = true;
                    spinBtn.disabled = true;

                    const spinDuration = 3000;
                    const startTime = Date.now();
                    const startRot = rotation;
                    const spins = 5 + Math.floor(Math.random()*5);
                    const targetRot = startRot + spins * 2 * Math.PI;

                    // Предопределим результат
                    const idx = Math.floor(Math.random()*6);
                    const mult = mults[idx];
                    const win = bet * mult;

                    function animate() {
                        const elapsed = Date.now() - startTime;
                        if (elapsed >= spinDuration) {
                            spinning = false;
                            spinBtn.disabled = false;
                            rotation = targetRot % (2*Math.PI);
                            drawWheel(rotation);
                            data.balance += win;
                            saveData(); updateBalance();
                            result.textContent = `${sectors[idx]} → ${win}⭐`;
                            addHistory('Wheel', `${sectors[idx]} ${win>=bet?'+':''}${win-bet}⭐`, mult>0?'win':'lose');
                            return;
                        }
                        const progress = elapsed / spinDuration;
                        const eased = 1 - Math.pow(1 - progress, 3);
                        rotation = startRot + (targetRot - startRot) * eased;
                        drawWheel(rotation);
                        animFrame = requestAnimationFrame(animate);
                    }
                    animate();
                });

                drawWheel(0);
            })();

            // MINES (исправлен баг с кнопкой "Забрать")
            (function mines() {
                const grid=document.getElementById('minesGrid'), countSel=document.getElementById('minesCount'), newGame=document.getElementById('minesNewGame');
                const startBtn=document.getElementById('minesStart'), cashout=document.getElementById('minesCashout'), betInput=document.getElementById('minesBet');
                const multSpan=document.getElementById('minesMultiplier'), winSpan=document.getElementById('minesWin');

                let board=[], revealed=[], gameActive=false, bet=0, mines=3, starsRevealed=0;

                function getMultiplier(stars) {
                    return 1 + stars * 0.3; // простой линейный рост
                }

                function render() {
                    grid.innerHTML='';
                    for (let i=0;i<25;i++) {
                        let cell=document.createElement('div'); cell.className='cell';
                        if (revealed[i]) {
                            cell.classList.add(board[i]?'mine':'star');
                            cell.textContent=board[i]?'💣':'⭐';
                        } else cell.textContent='?';
                        cell.onclick=() => {
                            if (!gameActive || revealed[i]) return;
                            if (board[i]) {
                                revealed[i]=true; render();
                                gameActive=false; cashout.disabled=true;
                                addHistory('Mines', `MINE -${bet}⭐`, 'lose');
                                alert('💥 Проигрыш!');
                            } else {
                                revealed[i]=true; starsRevealed++;
                                let mult = getMultiplier(starsRevealed);
                                multSpan.textContent=mult.toFixed(2)+'x';
                                winSpan.textContent=Math.floor(bet*mult);
                                render();
                            }
                        };
                        grid.appendChild(cell);
                    }
                }

                function reset() {
                    gameActive=false; cashout.disabled=true;
                    starsRevealed=0; multSpan.textContent='1.00x'; winSpan.textContent='0';
                    board=[]; revealed=[];
                    render();
                }

                newGame.onclick = reset;

                startBtn.onclick = () => {
                    let b = parseInt(betInput.value);
                    if (b<1||b>data.balance) return alert('Неверная ставка');
                    if (!deductStars(b)) return;
                    bet = b;
                    mines = parseInt(countSel.value);
                    board = new Array(25).fill(false);
                    for (let i=0;i<mines;i++) {
                        let pos;
                        do { pos = Math.floor(Math.random()*25); } while(board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    starsRevealed = 0;
                    multSpan.textContent='1.00x'; winSpan.textContent='0';
                    gameActive = true;
                    cashout.disabled = false;
                    render();
                };

                cashout.onclick = () => {
                    if (!gameActive) return;
                    let mult = getMultiplier(starsRevealed);
                    let win = Math.floor(bet * mult);
                    data.balance += win;
                    saveData(); updateBalance();
                    addHistory('Mines', `x${mult.toFixed(2)}+${win}⭐`, 'win');
                    gameActive = false;
                    cashout.disabled = true;
                    render(); // перерисовываем, но клетки остаются открытыми (как обычно)
                };

                reset();
            })();

            // Меню
            const menuBtn=document.getElementById('menuBtn'), menuModal=document.getElementById('menuModal'), closeMenu=document.getElementById('closeMenu');
            menuBtn.addEventListener('click',()=>{ updateReferralDisplay(); menuModal.classList.add('active'); });
            closeMenu.addEventListener('click',()=>menuModal.classList.remove('active'));
            menuModal.addEventListener('click',e=>{ if(e.target===menuModal) menuModal.classList.remove('active'); });

            document.querySelectorAll('.promo-item').forEach(item=>{
                item.addEventListener('click',()=>{ document.getElementById('promoInput').value=item.dataset.code; });
            });
            document.getElementById('applyPromo').addEventListener('click',()=>{
                let code=document.getElementById('promoInput').value.trim(); if(code) applyPromo(code); document.getElementById('promoInput').value='';
            });

            updateBalance(); updateReferralDisplay(); renderHistory();
        })();
    </script>
</body>
</html>
