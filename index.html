<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💎 PREMIUM CASINO • ROCKET • PLINKO • SLOTS • WHEEL • MINES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== МИНИМАЛИСТИЧНЫЙ ПРЕМИУМ ДИЗАЙН ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0c10;
            --surface: #12141a;
            --surface-light: #1e2128;
            --text: #ffffff;
            --text-muted: #8e98a3;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: #262b33;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            margin: 0;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--surface);
            border-radius: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* ШАПКА */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-light);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .balance i {
            color: var(--accent);
            font-size: 18px;
        }

        .balance span {
            font-weight: 700;
            font-size: 22px;
        }

        .daily-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .daily-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* МЕНЮ ИГР В ОДНУ СТРОКУ */
        .game-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px;
            margin-bottom: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--border);
            -webkit-overflow-scrolling: touch;
        }

        .game-menu::-webkit-scrollbar {
            height: 3px;
        }
        .game-menu::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .menu-item {
            flex: 0 0 auto;
            padding: 10px 20px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 40px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .menu-item.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ИГРОВЫЕ КОНТЕЙНЕРЫ */
        .game-container {
            background: var(--surface-light);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .hidden { display: none; }

        /* ========== ROCKET ========== */
        .rocket-stage {
            position: relative;
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            height: 260px;
        }

        #rocketCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            position: relative;
            z-index: 5;
        }

        .stars-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
        }

        .multiplier-display {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 28px;
            font-weight: 800;
            z-index: 10;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            background: var(--surface);
            border-radius: 30px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 700;
            color: var(--accent);
            font-size: 18px;
        }

        .bet-panel {
            background: var(--surface);
            border-radius: 30px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .bet-input {
            width: 100%;
            padding: 14px;
            background: var(--surface-light);
            border: 2px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }

        .bet-input:focus {
            border-color: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn.primary {
            background: var(--accent);
            color: white;
        }
        .action-btn.success {
            background: var(--success);
            color: white;
        }
        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== PLINKO ========== */
        .plinko-stage {
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            height: 460px;
        }

        #plinkoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .plinko-result {
            margin-top: 16px;
            padding: 16px;
            background: var(--surface);
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        /* ========== SLOTS ========== */
        .slots-machine {
            background: #000;
            border-radius: 32px;
            padding: 30px 16px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .reel {
            width: 80px;
            height: 80px;
            background: var(--surface-light);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .slots-multiplier {
            text-align: center;
            font-size: 22px;
            margin: 16px 0 0;
            color: var(--accent);
            font-weight: 700;
        }

        /* ========== WHEEL ========== */
        .wheel-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 16px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: var(--accent);
            filter: drop-shadow(0 0 5px var(--accent));
        }

        .wheel-result {
            text-align: center;
            font-size: 24px;
            margin: 16px 0;
            font-weight: 700;
        }

        /* ========== MINES ========== */
        .mines-header {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .mines-select {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 40px;
            padding: 10px;
            color: white;
            font-weight: 600;
            text-align: center;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 16px 0;
        }

        .mines-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.1s;
        }

        .mines-cell.revealed-star {
            background: #0f2b3f;
            border-color: var(--success);
            color: var(--success);
        }
        .mines-cell.revealed-mine {
            background: #3f1f1f;
            border-color: var(--danger);
            color: var(--danger);
        }

        .mines-info {
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
            font-size: 18px;
            font-weight: 600;
        }

        .mines-multiplier {
            color: var(--accent);
        }

        /* ИСТОРИЯ */
        .history-section {
            background: var(--surface-light);
            border-radius: 28px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .history-title {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: var(--surface);
            border-radius: 24px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .history-win { color: var(--success); font-weight: 600; }
        .history-lose { color: var(--danger); font-weight: 600; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="balance">
                <i class="fas fa-star"></i>
                <span id="balance">10 000</span>
            </div>
            <button class="daily-btn" id="dailyBonus">
                <i class="fas fa-gift"></i>
            </button>
        </header>

        <!-- МЕНЮ ИГР (ОДНА СТРОКА) -->
        <div class="game-menu">
            <div class="menu-item active" data-game="rocket">🚀 ROCKET</div>
            <div class="menu-item" data-game="plinko">🔴 PLINKO</div>
            <div class="menu-item" data-game="slots">🎰 SLOTS</div>
            <div class="menu-item" data-game="wheel">🎡 WHEEL</div>
            <div class="menu-item" data-game="mines">💣 MINES</div>
        </div>

        <!-- ROCKET -->
        <div id="rocketGame" class="game-container">
            <div class="rocket-stage">
                <div class="stars-layer" id="starsLayer"></div>
                <canvas id="rocketCanvas" width="380" height="260"></canvas>
                <div class="multiplier-display" id="rocketMultiplier">1.00x</div>
            </div>
            <div class="info-panel">
                <div class="info-item"><div class="info-label">LAST</div><div class="info-value" id="lastCrash">2.45x</div></div>
                <div class="info-item"><div class="info-label">MAX</div><div class="info-value" id="maxCrash">12.5x</div></div>
                <div class="info-item"><div class="info-label">BET</div><div class="info-value" id="rocketBetAmount">10</div></div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="rocketBet" class="bet-input" min="1" value="10" inputmode="numeric">
                <div class="action-buttons">
                    <button class="action-btn primary" id="rocketStart"><i class="fas fa-play"></i> СТАРТ</button>
                    <button class="action-btn success" id="rocketStop" disabled><i class="fas fa-stop"></i> СТОП</button>
                </div>
            </div>
        </div>

        <!-- PLINKO -->
        <div id="plinkoGame" class="game-container hidden">
            <div class="plinko-stage">
                <canvas id="plinkoCanvas" width="380" height="460"></canvas>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="plinkoBet" class="bet-input" min="1" value="10" inputmode="numeric">
                <button class="action-btn primary" id="plinkoDrop"><i class="fas fa-arrow-down"></i> БРОСИТЬ</button>
                <div class="plinko-result" id="plinkoResult">—</div>
            </div>
        </div>

        <!-- SLOTS -->
        <div id="slotsGame" class="game-container hidden">
            <div class="slots-machine">
                <div class="reels">
                    <div class="reel" id="slot1">🍒</div>
                    <div class="reel" id="slot2">🍒</div>
                    <div class="reel" id="slot3">🍒</div>
                </div>
                <div class="slots-multiplier" id="slotsMultiplier">x1</div>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="slotsBet" class="bet-input" min="1" value="10" inputmode="numeric">
                <button class="action-btn primary" id="slotsSpin"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- WHEEL -->
        <div id="wheelGame" class="game-container hidden">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="220" height="220"></canvas>
                <div class="wheel-pointer">▼</div>
            </div>
            <div class="wheel-result" id="wheelResult">—</div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="wheelBet" class="bet-input" min="1" value="10" inputmode="numeric">
                <button class="action-btn primary" id="wheelSpin"><i class="fas fa-play"></i> КРУТИТЬ</button>
            </div>
        </div>

        <!-- MINES -->
        <div id="minesGame" class="game-container hidden">
            <div class="mines-header">
                <select id="minesCount" class="mines-select">
                    <option value="3">3 💣</option>
                    <option value="5">5 💣</option>
                    <option value="10">10 💣</option>
                </select>
                <button class="action-btn success" id="minesNewGame">НОВАЯ</button>
            </div>
            <div class="mines-grid" id="minesGrid"></div>
            <div class="mines-info">
                <span>Множитель: <span id="minesMultiplier">1.00x</span></span>
                <span>Выигрыш: <span id="minesWin">0</span> ⭐</span>
            </div>
            <div class="bet-panel">
                <div class="bet-header"><span>СТАВКА</span></div>
                <input type="number" id="minesBet" class="bet-input" min="1" value="10" inputmode="numeric">
                <div class="action-buttons">
                    <button class="action-btn primary" id="minesStart">СТАВКА</button>
                    <button class="action-btn success" id="minesCashout" disabled>ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- ИСТОРИЯ -->
        <div class="history-section">
            <div class="history-title"><i class="fas fa-history"></i> ПОСЛЕДНИЕ 5</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            // ========== БАЛАНС И ИСТОРИЯ ==========
            let balance = 10000;
            const historyList = document.getElementById('historyList');

            function updateBalance() {
                document.getElementById('balance').textContent = balance.toLocaleString().replace(',', ' ');
            }

            function addStars(amount) {
                balance += amount;
                updateBalance();
                addHistory('БОНУС', `+${amount} ⭐`, 'win');
            }

            function deductStars(amount) {
                if (balance >= amount) {
                    balance -= amount;
                    updateBalance();
                    return true;
                }
                return false;
            }

            function addHistory(game, text, type) {
                if (historyList.children.length >= 5) {
                    historyList.removeChild(historyList.lastElementChild);
                }
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span>${game}</span><span class="history-${type}">${text}</span>`;
                historyList.prepend(item);
            }

            // ========== ПЕРЕКЛЮЧЕНИЕ ИГР ==========
            const menuItems = document.querySelectorAll('.menu-item');
            const games = {
                rocket: document.getElementById('rocketGame'),
                plinko: document.getElementById('plinkoGame'),
                slots: document.getElementById('slotsGame'),
                wheel: document.getElementById('wheelGame'),
                mines: document.getElementById('minesGame')
            };

            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    menuItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    const gameId = item.dataset.game;
                    Object.values(games).forEach(g => g.classList.add('hidden'));
                    games[gameId].classList.remove('hidden');
                });
            });

            // ========== ROCKET ==========
            (function rocket() {
                const canvas = document.getElementById('rocketCanvas');
                const ctx = canvas.getContext('2d');
                const starsLayer = document.getElementById('starsLayer');
                const multiplierEl = document.getElementById('rocketMultiplier');
                const lastCrashSpan = document.getElementById('lastCrash');
                const maxCrashSpan = document.getElementById('maxCrash');
                const rocketBetInput = document.getElementById('rocketBet');
                const rocketBetAmount = document.getElementById('rocketBetAmount');
                const startBtn = document.getElementById('rocketStart');
                const stopBtn = document.getElementById('rocketStop');

                let gameActive = false;
                let countdownActive = false;
                let rocketInterval = null;
                let crashPoint = 2.0;
                let currentMultiplier = 1.0;
                let rocketBet = 10;
                let stars = [];
                let starSpeed = 0.1;
                let maxCrash = 12.5;
                let crashHistory = [4.56, 2.89, 7.23, 3.45, 5.67];

                // Создание звёзд (без мерцания)
                function createStars(count = 80) {
                    starsLayer.innerHTML = '';
                    stars = [];
                    for (let i = 0; i < count; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        const size = Math.random() * 2 + 1;
                        star.style.width = size + 'px';
                        star.style.height = size + 'px';
                        star.style.left = Math.random() * 100 + '%';
                        star.style.top = Math.random() * 100 + '%';
                        starsLayer.appendChild(star);
                        stars.push({ element: star, top: parseFloat(star.style.top) });
                    }
                }

                function moveStars(speed) {
                    stars.forEach(s => {
                        let top = s.top + speed;
                        if (top > 100) {
                            top = -5;
                            s.element.style.left = Math.random() * 100 + '%';
                        }
                        s.element.style.top = top + '%';
                        s.top = top;
                    });
                }

                // Ракета носом вверх (эмодзи)
                function drawRocket(mult, vib) {
                    ctx.clearRect(0, 0, 380, 260);
                    ctx.font = '70px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 20 + vib;
                    const baseY = 180 - (mult - 1) * 12;
                    const offsetX = Math.sin(Date.now() * 0.03) * vib * 0.3;
                    const offsetY = Math.cos(Date.now() * 0.04) * vib * 0.3;
                    ctx.fillStyle = '#fff';
                    ctx.fillText('🚀', 190 + offsetX, baseY + offsetY);
                }

                startBtn.addEventListener('click', () => {
                    if (gameActive || countdownActive) return;
                    rocketBet = parseInt(rocketBetInput.value);
                    if (rocketBet < 1 || rocketBet > balance) return alert('Неверная ставка');
                    if (!deductStars(rocketBet)) return;

                    // Генерация краша (средние значения, чтобы чаще были 2-5x)
                    const r = Math.random();
                    if (r < 0.3) crashPoint = 1.2 + Math.random() * 1.5;      // 30% 1.2-2.7
                    else if (r < 0.7) crashPoint = 2.5 + Math.random() * 3;   // 40% 2.5-5.5
                    else crashPoint = 5 + Math.random() * 5;                  // 30% 5-10
                    crashPoint = parseFloat(crashPoint.toFixed(2));

                    countdownActive = true;
                    multiplierEl.innerHTML = '<span style="color:#3b82f6;">3</span>';
                    let count = 3;
                    const ci = setInterval(() => {
                        count--;
                        if (count > 0) multiplierEl.innerHTML = `<span style="color:#3b82f6;">${count}</span>`;
                        else {
                            clearInterval(ci);
                            countdownActive = false;
                            multiplierEl.textContent = '1.00x';
                            gameActive = true;
                            startBtn.disabled = true;
                            stopBtn.disabled = false;
                            currentMultiplier = 1.0;
                            starSpeed = 0.2;
                            createStars(80);
                            const startTime = Date.now();

                            rocketInterval = setInterval(() => {
                                if (!gameActive) return;
                                const elapsed = (Date.now() - startTime) / 1000;
                                currentMultiplier = 1 + 0.9 * elapsed;
                                multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                                starSpeed = 0.2 + currentMultiplier * 0.3;
                                moveStars(starSpeed);
                                drawRocket(currentMultiplier, currentMultiplier * 1.5);

                                if (currentMultiplier >= crashPoint) {
                                    clearInterval(rocketInterval);
                                    gameActive = false;
                                    startBtn.disabled = false;
                                    stopBtn.disabled = true;
                                    crashHistory.unshift(crashPoint);
                                    if (crashHistory.length > 10) crashHistory.pop();
                                    if (crashPoint > maxCrash) maxCrash = crashPoint;
                                    lastCrashSpan.textContent = crashPoint.toFixed(2) + 'x';
                                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                                    addHistory('ROCKET', `CRASH -${rocketBet} ⭐`, 'lose');
                                }
                            }, 30);
                        }
                    }, 800);
                });

                stopBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    clearInterval(rocketInterval);
                    gameActive = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const win = Math.floor(rocketBet * currentMultiplier);
                    balance += win;
                    crashHistory.unshift(currentMultiplier);
                    if (currentMultiplier > maxCrash) maxCrash = currentMultiplier;
                    lastCrashSpan.textContent = currentMultiplier.toFixed(2) + 'x';
                    maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                    updateBalance();
                    addHistory('ROCKET', `x${currentMultiplier.toFixed(2)} +${win} ⭐`, 'win');
                });

                rocketBetInput.addEventListener('input', () => {
                    rocketBetAmount.textContent = rocketBetInput.value;
                });

                lastCrashSpan.textContent = crashHistory[0].toFixed(2) + 'x';
                maxCrashSpan.textContent = maxCrash.toFixed(2) + 'x';
                createStars(80);
                drawRocket(1, 0);
            })();

            // ========== PLINKO (исправленная механика) ==========
            (function plinko() {
                const canvas = document.getElementById('plinkoCanvas');
                const ctx = canvas.getContext('2d');
                const dropBtn = document.getElementById('plinkoDrop');
                const resultDiv = document.getElementById('plinkoResult');
                const betInput = document.getElementById('plinkoBet');

                const rows = 8;
                const startY = 30;
                const stepY = 48;
                const startX = 190;
                const multipliers = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 10.0];

                function drawBoard() {
                    ctx.clearRect(0, 0, 380, 460);
                    // колышки
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c <= r; c++) {
                            let x = startX - (r * 20) + c * 40;
                            let y = startY + r * stepY;
                            ctx.fillStyle = '#3b82f6';
                            ctx.shadowColor = '#3b82f6';
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.arc(x, y, 8, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }
                    // ячейки
                    const cellY = startY + rows * stepY + 30;
                    for (let i = 0; i < 9; i++) {
                        let x = startX - (rows * 20) + i * 40;
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(x-16, cellY-12, 32, 30);
                        ctx.strokeStyle = multipliers[i] >= 1 ? '#10b981' : '#ef4444';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x-16, cellY-12, 32, 30);
                        ctx.fillStyle = multipliers[i] >= 1 ? '#10b981' : '#ef4444';
                        ctx.font = 'bold 14px Inter';
                        ctx.fillText(multipliers[i].toFixed(1)+'x', x-10, cellY+8);
                    }
                }

                let anim = null;
                function dropBall(bet) {
                    if (anim) clearInterval(anim);
                    let ball = { x: 190, y: 15, vx: 0, vy: 1 };
                    let lastCollision = 0;
                    anim = setInterval(() => {
                        ball.vy += 0.4;
                        ball.y += ball.vy;
                        ball.x += ball.vx;
                        ball.vx *= 0.98;

                        // столкновения
                        for (let r = 0; r < rows; r++) {
                            for (let c = 0; c <= r; c++) {
                                let pegX = startX - (r * 20) + c * 40;
                                let pegY = startY + r * stepY;
                                let dx = ball.x - pegX;
                                let dy = ball.y - pegY;
                                let dist = Math.sqrt(dx*dx + dy*dy);
                                if (dist < 14 && Date.now() - lastCollision > 200) {
                                    let angle = Math.atan2(dy, dx);
                                    ball.vx = Math.cos(angle) * 4;
                                    ball.vy = -Math.abs(Math.sin(angle) * 3);
                                    ball.vx += (Math.random() - 0.5) * 2;
                                    lastCollision = Date.now();
                                    break;
                                }
                            }
                        }

                        // границы
                        if (ball.x < 30) { ball.x = 30; ball.vx *= -0.5; }
                        if (ball.x > 350) { ball.x = 350; ball.vx *= -0.5; }

                        drawBoard();
                        // шар
                        ctx.shadowColor = '#3b82f6';
                        ctx.shadowBlur = 25;
                        ctx.beginPath();
                        ctx.arc(ball.x, ball.y, 12, 0, 2*Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        ctx.shadowBlur = 10;
                        ctx.fillStyle = '#cbd5e1';
                        ctx.beginPath();
                        ctx.arc(ball.x-3, ball.y-3, 4, 0, 2*Math.PI);
                        ctx.fill();

                        if (ball.y > 430) {
                            clearInterval(anim);
                            let col = Math.floor((ball.x - (startX - (rows*20))) / 40);
                            col = Math.max(0, Math.min(8, col));
                            let mult = multipliers[col];
                            let win = Math.floor(bet * mult);
                            balance += win;
                            updateBalance();
                            resultDiv.textContent = mult >= 1 ? `🏆 WIN ${win} ⭐` : `💥 LOSE ${win} ⭐`;
                            addHistory('PLINKO', `x${mult.toFixed(1)} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>=1 ? 'win' : 'lose');
                        }
                    }, 25);
                }

                dropBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    dropBall(bet);
                });

                drawBoard();
            })();

            // ========== СЛОТЫ С PSYCHOLOGY ==========
            (function slots() {
                const reel1 = document.getElementById('slot1');
                const reel2 = document.getElementById('slot2');
                const reel3 = document.getElementById('slot3');
                const multiplierSpan = document.getElementById('slotsMultiplier');
                const spinBtn = document.getElementById('slotsSpin');
                const betInput = document.getElementById('slotsBet');

                // Эмодзи с их значениями и весами (RTP 94%)
                const symbols = [
                    { emoji: '🍒', value: 2, weight: 30 },  // частый дешёвый
                    { emoji: '🍋', value: 2, weight: 30 },
                    { emoji: '🍇', value: 4, weight: 15 },
                    { emoji: '🔔', value: 6, weight: 12 },
                    { emoji: '💎', value: 10, weight: 8 },  // может давать до 25 через бонус
                    { emoji: '⭐', value: 'bonus', weight: 5 }
                ];

                // Весовая функция для выбора символа
                function getRandomSymbol() {
                    const totalWeight = symbols.reduce((acc, s) => acc + s.weight, 0);
                    let rand = Math.random() * totalWeight;
                    for (let s of symbols) {
                        if (rand < s.weight) return s;
                        rand -= s.weight;
                    }
                    return symbols[0];
                }

                spinBtn.addEventListener('click', () => {
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    // Анимация прокрутки (упрощённая)
                    let spins = 0;
                    const spinInterval = setInterval(() => {
                        reel1.textContent = symbols[Math.floor(Math.random() * symbols.length)].emoji;
                        reel2.textContent = symbols[Math.floor(Math.random() * symbols.length)].emoji;
                        reel3.textContent = symbols[Math.floor(Math.random() * symbols.length)].emoji;
                        spins++;
                        if (spins > 15) {
                            clearInterval(spinInterval);
                            // финальный результат
                            const s1 = getRandomSymbol();
                            const s2 = getRandomSymbol();
                            const s3 = getRandomSymbol();
                            reel1.textContent = s1.emoji;
                            reel2.textContent = s2.emoji;
                            reel3.textContent = s3.emoji;

                            let mult = 1;
                            let winType = 'lose';
                            // Проверка комбинаций
                            if (s1.emoji === s2.emoji && s2.emoji === s3.emoji) {
                                if (s1.emoji === '💎') mult = 15 + Math.floor(Math.random()*10); // 15-25
                                else if (s1.emoji === '⭐') mult = 0; // бонус, пока просто фриспин не реализован
                                else if (s1.emoji === '🔔') mult = 6;
                                else if (s1.emoji === '🍇') mult = 4;
                                else mult = 3; // 🍒🍋
                                winType = 'win';
                            } else if (s1.emoji === s2.emoji || s2.emoji === s3.emoji || s1.emoji === s3.emoji) {
                                mult = 2; // две одинаковых
                                winType = 'win';
                            }

                            const winAmount = Math.floor(bet * mult);
                            balance += winAmount;
                            updateBalance();
                            multiplierSpan.textContent = `x${mult}`;
                            addHistory('SLOTS', `x${mult} ${winAmount >= bet ? '+' : ''}${winAmount-bet} ⭐`, mult > 1 ? 'win' : 'lose');
                            // Визуальный эффект при крупном выигрыше
                            if (mult >= 10) {
                                document.body.style.animation = 'shake 0.3s';
                                setTimeout(() => document.body.style.animation = '', 300);
                                // можно добавить конфетти
                            }
                        }
                    }, 50);
                });
            })();

            // ========== КОЛЕСО (ИСПРАВЛЕНО) ==========
            (function wheel() {
                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                const spinBtn = document.getElementById('wheelSpin');
                const betInput = document.getElementById('wheelBet');
                const resultSpan = document.getElementById('wheelResult');

                const segments = [
                    { label: 'x1', color: '#3b82f6', mult: 1 },
                    { label: 'x0', color: '#ef4444', mult: 0 },
                    { label: 'x2', color: '#10b981', mult: 2 },
                    { label: 'x5', color: '#f59e0b', mult: 5 },
                    { label: 'x10', color: '#8b5cf6', mult: 10 },
                    { label: 'x50', color: '#ec4899', mult: 50 }
                ];
                const angleStep = (Math.PI * 2) / segments.length;

                function drawWheel(rotation = 0) {
                    ctx.clearRect(0,0,220,220);
                    const cx = 110, cy = 110, r = 100;
                    for (let i = 0; i < segments.length; i++) {
                        const start = i * angleStep + rotation;
                        const end = (i+1) * angleStep + rotation;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.arc(cx, cy, r, start, end);
                        ctx.closePath();
                        ctx.fillStyle = segments[i].color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // текст
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(start + angleStep/2);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 14px Inter';
                        ctx.fillText(segments[i].label, 60, 0);
                        ctx.restore();
                    }
                }

                let spinning = false;
                spinBtn.addEventListener('click', () => {
                    if (spinning) return;
                    let bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;

                    spinning = true;
                    const startTime = Date.now();
                    const startRot = Math.random() * 2 * Math.PI;
                    const spins = 5 + Math.floor(Math.random()*5);
                    const targetRot = startRot + spins * 2 * Math.PI;

                    function animate() {
                        const elapsed = Date.now() - startTime;
                        const duration = 3000;
                        if (elapsed >= duration) {
                            spinning = false;
                            drawWheel(targetRot % (2*Math.PI));
                            // определяем сектор
                            let angle = targetRot % (2*Math.PI);
                            if (angle < 0) angle += 2*Math.PI;
                            const idx = Math.floor(angle / angleStep);
                            const mult = segments[idx].mult;
                            const win = bet * mult;
                            balance += win;
                            updateBalance();
                            resultSpan.textContent = `${segments[idx].label} → ${win} ⭐`;
                            addHistory('WHEEL', `${segments[idx].label} ${win >= bet ? '+' : ''}${win-bet} ⭐`, mult>0?'win':'lose');
                            return;
                        }
                        const progress = elapsed / duration;
                        const eased = 1 - Math.pow(1 - progress, 3);
                        const rot = startRot + (targetRot - startRot) * eased;
                        drawWheel(rot);
                        requestAnimationFrame(animate);
                    }
                    animate();
                });

                drawWheel();
            })();

            // ========== MINES ==========
            (function mines() {
                const gridDiv = document.getElementById('minesGrid');
                const minesCountSelect = document.getElementById('minesCount');
                const newGameBtn = document.getElementById('minesNewGame');
                const startBtn = document.getElementById('minesStart');
                const cashoutBtn = document.getElementById('minesCashout');
                const betInput = document.getElementById('minesBet');
                const multiplierSpan = document.getElementById('minesMultiplier');
                const winSpan = document.getElementById('minesWin');

                let board = []; // true = мина
                let revealed = [];
                let gameActive = false;
                let currentBet = 0;
                let minesCount = 3;
                let starsRevealed = 0;

                // таблица множителей для разного кол-ва мин
                const multTable = {
                    3: [1.15, 1.35, 1.70, 2.20, 3.00, 6.50, 20, 50, 100, 200],
                    5: [1.20, 1.50, 2.00, 3.00, 5.00, 10, 25, 60, 150, 300],
                    10: [1.30, 2.00, 3.50, 6.00, 12, 25, 60, 150, 400, 1000]
                };

                function getMultiplier(mines, revealed) {
                    const arr = multTable[mines] || multTable[3];
                    return revealed === 0 ? 1.0 : (arr[revealed-1] || 1.0);
                }

                function renderGrid() {
                    gridDiv.innerHTML = '';
                    for (let i = 0; i < 25; i++) {
                        const cell = document.createElement('div');
                        cell.className = 'mines-cell';
                        cell.dataset.index = i;
                        if (revealed[i]) {
                            if (board[i]) {
                                cell.classList.add('revealed-mine');
                                cell.textContent = '💣';
                            } else {
                                cell.classList.add('revealed-star');
                                cell.textContent = '⭐';
                            }
                        } else {
                            cell.textContent = '?';
                        }
                        cell.addEventListener('click', cellClickHandler);
                        gridDiv.appendChild(cell);
                    }
                }

                function cellClickHandler(e) {
                    if (!gameActive) return;
                    const idx = parseInt(e.currentTarget.dataset.index);
                    if (revealed[idx]) return;
                    if (board[idx]) {
                        revealed[idx] = true;
                        renderGrid();
                        gameActive = false;
                        cashoutBtn.disabled = true;
                        addHistory('MINES', `MINE -${currentBet} ⭐`, 'lose');
                        alert('💥 Вы наткнулись на мину!');
                    } else {
                        revealed[idx] = true;
                        starsRevealed++;
                        const mult = getMultiplier(minesCount, starsRevealed);
                        multiplierSpan.textContent = mult.toFixed(2) + 'x';
                        const potentialWin = Math.floor(currentBet * mult);
                        winSpan.textContent = potentialWin;
                        renderGrid();
                    }
                }

                function newGame() {
                    gameActive = false;
                    cashoutBtn.disabled = true;
                    board = [];
                    revealed = [];
                    starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    renderGrid();
                }

                newGameBtn.addEventListener('click', newGame);

                startBtn.addEventListener('click', () => {
                    if (gameActive) return;
                    const bet = parseInt(betInput.value);
                    if (bet < 1 || bet > balance) return alert('Неверная ставка');
                    if (!deductStars(bet)) return;
                    currentBet = bet;
                    minesCount = parseInt(minesCountSelect.value);
                    // генерация поля
                    board = new Array(25).fill(false);
                    for (let i = 0; i < minesCount; i++) {
                        let pos;
                        do { pos = Math.floor(Math.random() * 25); } while (board[pos]);
                        board[pos] = true;
                    }
                    revealed = new Array(25).fill(false);
                    starsRevealed = 0;
                    multiplierSpan.textContent = '1.00x';
                    winSpan.textContent = '0';
                    gameActive = true;
                    cashoutBtn.disabled = false;
                    renderGrid();
                });

                cashoutBtn.addEventListener('click', () => {
                    if (!gameActive) return;
                    const mult = getMultiplier(minesCount, starsRevealed);
                    const win = Math.floor(currentBet * mult);
                    balance += win;
                    updateBalance();
                    addHistory('MINES', `x${mult.toFixed(2)} +${win} ⭐`, 'win');
                    gameActive = false;
                    cashoutBtn.disabled = true;
                    renderGrid();
                });

                newGame();
            })();

            // ========== БОНУС ==========
            document.getElementById('dailyBonus').addEventListener('click', () => addStars(1000));

            updateBalance();
        })();
    </script>
