<!DOCTYPE html>
<html>
<head>
    <title>Простой тест</title>
</head>
<body>
    <h2>🔑 Тест Replicate API</h2>
    
    <div>
        <input type="text" id="key" placeholder="r8_...." size="50">
        <button onclick="test()">Тест</button>
    </div>
    
    <div id="result" style="margin-top: 20px;"></div>

    <script>
    async function test() {
        const key = document.getElementById('key').value;
        const result = document.getElementById('result');
        
        result.innerHTML = "⏳ Проверка...";
        
        try {
            // Простой запрос к API
            const res = await fetch('https://api.replicate.com/v1/models', {
                method: 'GET',
                headers: {
                    'Authorization': 'Token ' + key
                }
            });
            
            result.innerHTML = `Статус: ${res.status}<br>`;
            result.innerHTML += `Статус текст: ${res.statusText}<br>`;
            
            if (res.ok) {
                const data = await res.json();
                result.innerHTML += "✅ Успешно!";
            } else {
                const text = await res.text();
                result.innerHTML += "❌ Ошибка: " + text;
            }
        } catch(e) {
            result.innerHTML = "❌ Ошибка соединения: " + e.message;
        }
    }
    </script>
</body>
</html>
